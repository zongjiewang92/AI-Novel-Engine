
# 宇宙海==========================
- time: 十几个纪元  ========================================
  event: 大破灭
  description: '原始宇宙诞生、衍变、运转、衰弱、破灭后的新的轮回.原始宇宙内所有一切湮灭，当原始宇宙再度诞生出新的族群时，便又是一个新的轮回了。而大破灭前的一些存在，自然有能躲过大破灭保住性命的。'
  internal_time:
  - time: 不明时间
    event: 宇宙海中的三大绝地深处产生至强至宝和巅峰至宝
    description: '据传，在宇宙海中三大绝地最深处都有好些至强至宝，并且还有大量的巅峰至宝。'

  - time: 两天多时间后
    event: 罗峰和混沌城主到达参照物小型宇宙附近
    description: '罗峰和混沌城主从空间漩涡中走出，来到一座直径约1亿光年的小型宇宙附近。该小型宇宙膜壁残破不堪，可见数百个破碎的洞口和裂缝。'

  - time: 不详
    event: 宇宙海中的小型宇宙不断崩毁
    description: '罗峰得知，在每个轮回中都会孕育出亿万族群及诸多天才，并且在达到最繁华巅峰后迅速衰落直至毁灭。目前已发现的小型宇宙有18022颗，大部分已经破败。'

  - time: 不详
    event: 宇宙海的三个时代强者幸存情况
    description: '混沌城主解释说整个宇宙海除了两大圣地外，仅有第三宇宙时代的强者还处于繁衍过程中，而前两个轮回的时代中孕育诞生的强者数量远远超过当前时代。'

  - time: 当罗峰进入水域时
    event: 天体山石缓缓冒起
    description: 在广袤无尽水域深处距离罗峰大概一亿多光年外，有一尊天体山石正缓缓冒起。

  - time: 距离罗峰约300万光年外
    event: 燧石之主在水域中飞行
    description: 那体型巍峨神体隐隐有火焰环绕的燧石之主正在水域中缓缓飞行着，他自然已经和那螂犴之主分开了。

  - time: 没有明确的时间节点
    event: 安永之主追杀燧石之主
    description: 燧石之主在水域深处小心避开远处一些‘水流灵’时遇到了神眼族的安永之主，后者开始穷追不舍。

  - time: 两年后
    event: 珈御之主发现洞穴并进入探索
    description: '珈御之主在水域底部飞行时，发现了看似普通的山峰洞穴，并决定进入探索。'

  - time: 六个小时后
    event: 发现能量波动和光幕
    description: '珈御之主感受到微弱的能量波动，并发现前方有一层无法侦查的光幕阻挡前进路径。'

  - time: 立即
    event: 珈御之主穿透九层光幕
    description: '珈御之主穿过九层光幕后进入疑似宝藏之地，然而立刻遭遇未知危险导致化身湮灭。'

  - time: 立即
    event: 第三真主发现珈御之主陨落
    description: '小型宇宙的第三真主立即察觉到珈御之主的化身被摧毁并得知其死亡的消息。'

  - time: 这些年来
    event: 安永之主一直在第193293号参照系区域寻找原始宇宙人类罗峰
    description: '这些年来他一直在第193293号参照系区域来慢慢寻找，无比细心的寻找。'

  - time: 不知道具体时间点
    event: 安永之主发现了罗峰
    description: '这次属于无聊后随意的大范围扫荡探索，竟然令他发现了那原始宇宙人类罗峰。'

  - time: 这些年来
    event: 安永之主碰到过路过的两名异族宇宙之主
    description: '这些年他这种大范围扫荡探索，也碰到过路过的两名异族宇宙之主。'

  - time: 不知道具体时间点
    event: 罗峰和安永之主见面
    description: '当金觇之主和安永之主的化身彼此约定时，在倾峰界水域第193293参照系区域深处，罗峰和安永之主已然见面。'

  - time: 不知道具体时间点
    event: 罗峰持绝客战刀冲向安永之主
    description: '轰！罗峰手持绝客战刀，瞬间化作一道流光直接冲向那安永之主。'




  - time: 飞行了三天
    event: 接近巨大光翼
    description: '罗峰注意到那夺目的巨大光翼并非真正的巨大光翼，而是由无数的密密麻麻刀刃光芒不断叠加形成的超巨大光翼。'

  - time: 近一天时间
    event: 清晰观察核心部位
    description: '罗峰看清了整个巨大光翼的核心，发现白色羽翼是所有刀刃光芒的源头，并决定弄到手。'

  - time: 距离越来越近
    event: 遭受意志冲击
    description: '随着接近白色羽翼，罗峰受到一股无比高高在上和疯狂狰狞的意志碾压，但最终保持清醒并继续前进。'

  - time: 10万公里
    event: 意志冲击增强
    description: '距离白色羽翼约10万公里时，意志冲击开始显著增强，并不断发出“滚开”的咆哮声。'

  - time: 2万公里
    event: 继续前进
    description: '罗峰无视意志的恐吓和威胁，继续以较慢的速度前进。'

  - time: 5000公里
    event: 靠近白色羽翼核心区域
    description: '星辰塔逐步减速接近白色羽翼的核心区域，意志冲击愈发强烈并带有无比高高在上的感觉。'

  - time: 2000公里
    event: 意志碾压更加强烈
    description: '罗峰感到意志碾压更加难以抵抗，但继续以谨慎的态度前进。'

  - time: 1000公里
    event: 接近白色羽翼1000公里
    description: '距离白色羽翼约1000公里时，意志冲击达到了前所未有的强度，罗峰额头渗出汗珠。'



  - time: 三年后
    event: 白色羽翼之灵联系罗峰
    description: '白色羽翼之灵终于联系罗峰，并试探罗峰是否在故意拖延时间。'

  - time: 又过了三年
    event: 罗峰认主白色羽翼
    description: '罗峰最终答应将核心部件脱离，开始进行认主过程。'

  - time: 数光年
    event: 进入洞穴通道前进
    description: '罗峰通过星辰塔沿着洞穴通道朝内钻探，已经前进了数光年的距离。'

  - time: 三十多光年
    event: 到达火焰溶洞
    description: '经过飞行了三十多光年后，最终到达一个巨大的类似火焰溶洞的地方。'

  - time: 不明时间
    event: 发现爪印石柱
    description: '罗峰在不远处的另外一石柱上发现了一个爪印，表面有四指大小的手掌形状印记。'

  - time: 回到地球的第三个月
    event: 罗峰离开原始宇宙前往宇宙舟
    description: '虽然无奈，可是罗峰在回到地球的第三个月独自悄然离开了原始宇宙再度进入宇宙海，这次却是前往宇宙舟。'

  - time: 第一宇宙时代
    event: 混沌城主提到的地图资料来源
    description: '混沌城主询问罗峰得到的地图是否是从第一宇宙时代的强者那获得。'

  - time: 飞了三天
    event: 开始高效率前进
    description: '罗峰飞了三天后，体验了一番路线上的第一区域之后开始高效地前进。'

  - time: 转眼，便过去了21年
    event: 内域闯荡
    description: '在内域的闯荡中，罗峰经历了各种危险，并且使用星辰塔度过危险达数十次。'

  - time: 第十一天
    event: 进入灭神涧
    description: '进入灭神涧已经十一天，罗峰愈加小心地前行，因为这里是宇宙舟中最可怕的区域之一。'

  - time: 原文未明确给出具体时间点
    event: 水波狱忽然动了，能量精华汇聚成巨大的天柱手掌出现。
    description: '原本无尽的水波狱忽然动了，能量精华汇聚成的巨大天柱手指构成的手掌朝罗峰拍下。'


# 五浑之主=====================巨斧创始者再次攻击第三真主和第六真主========
- time: 几十纪元
  event: 罗峰维持着浩荡金色国度引发火焰海对抗五浑之主。
  description: '罗峰时刻维持浩荡的金色国度并引发了火焰海，抵御五浑之主的攻击。'
  internal_time:
  - time: 原文未明确给出具体时间点
    event: 水波狱消散后巨大手掌消失。
    description: '水波狱消散，构成的巨大手掌也瞬间消失在罗峰头顶上方。'

  - time: 原文未明确给出具体时间点
    event: 罗峰引发微型宇宙和金色国度对抗五浑之主的攻击。
    description: '罗峰操控着微型宇宙、金色的国度合力撞击那方世界，导致一方世界的崩溃和微型宇宙消散。'

  - time: 原文未明确给出具体时间点
    event: 熔岩魔神出现。
    description: '从远处高空岩浆海中出现熔岩魔神，五浑之主等人被无尽金光火焰缠绕无法逃脱。'

  - time: 第5分钟第33秒
    event: 罗峰穿透岩浆海冲出并扎进冰冷水域
    description: '罗峰的血色金字塔从岩浆海中急速穿过虚空，撞击到冰冷水域。'

  - time: 第1分钟第58秒
    event: 血色金字塔进入冰冷水域后速度锐减并悬浮在空中
    description: '穿透岩浆海后的血色金字塔，在冰冷水域中减速，并最终悬浮于高空不动。罗峰从里面飞出，恢复成十米高的形态。'

  - time: 就在罗峰被封砻之主、五浑之主等四位宇宙之主追杀的时候。
    event: 消息传到人类族群
    description: '消息传到了人类族群，虚金之主得知后表示不相信。'

  - time: 不详（消息传播时间）
    event: 消息在宇宙海内传播
    description: '因沱散布的消息，在传播到了两大圣地宇宙后，终于开始逐步传播到第二轮回时代、原始宇宙中了。'

  - time: 不详（混沌城主召集罗峰的时间）
    event: 混沌城主询问真相
    description: '混沌城主得知消息后，立即召见罗峰确认此事的真实性。'
  - time: 六天前
    event: 罗峰进入第九深渊
    description: '罗峰开始在无尽深渊中经历狂暴的吞吸力量，持续六天时间。'

  - time: 第四天
    event: 吞吸力量达到巅峰
    description: '吞吸力量在第四天时达到最强。'

  - time: 六天后
    event: 吞吸力量减弱
    description: '经过第六天，吞吸力量急剧减弱，罗峰可以抓住黑色挂件并将其收入血色金字塔内。'

  - time: 八天前
    event: 第三真主、第六真主开始寻找至宝碎片
    description: '第三真主和第六真主在深渊中已经足足八天了，他们按照“吞吸力量”走向，顺着来，很快抵达大概区域，同时也终于发现了一片至宝碎片。'

  - time: 九天前
    event: 罗峰开始寻找灭绝神铠鳞片
    description: '罗峰根据之前的海量鳞片分布图，在边缘地带飞行寻找灭绝神铠的最后两片鳞片，总共已经找到了四片，还有三天时间便能找到最后两片。'

  - time: 六天前
    event: 坐山客进入第九深渊
    description: '坐山客已经在第九深渊内，并且随着吞吸力量抵达深处，发现第三真主和第六真主却没发现他。'

  - time: 六天后
    event: 罗峰与坐山客见面
    description: '罗峰与坐山客在三角山峰之巅见面。'

  - time: 超过三天
    event: 罗峰研究秘纹图时间
    description: '罗峰沉迷于微型秘纹图的研究，超过三天才被老师叫醒。'

  - time: 几秒钟后
    event: 青色山峰飞起
    description: '青色山峰悬浮而起并迅速朝远处高速飞去，数秒内离开隐秘空间。'

  - time: 不详
    event: 神力化身留在岛上
    description: '罗峰留下一个神力化身在岛屿上继续参悟秘纹图。'

  - time: 几天后（百倍光速飞行时间）
    event: 山峰飞往战斗地点
    description: '坐山客带着青色山峰以超高速度飞向宇宙最强者交战的地点，途中突破了运转法则限制引起强烈波动。'
  - time: 第十五！
    event: 巨斧创始者出手攻击永恒真神
    description: '巨斧创始者使用第十五招，令无尽时空暗下，出现泛着光芒的巨斧虚影，并将永恒真神分解为大量星辰、两道碧光及一对紫色护手。'

  - time: 第十五！！！
    event: 巨斧创始者再次攻击第三真主和第六真主
    description: '巨斧创始者使用第十五招，令无尽时空暗下，并出现泛着光芒的巨斧虚影将其追击的目标困住并逼近。'

  - time: 不详
    event: 第三真主向巨斧创始者投降
    description: '第三真主交出三件巅峰极品至宝后立即逃离现场，以换取神眼族和人类族群之间仇怨的解决。'


- time: 数百年后
  event: 罗峰创出最强秘法‘裂金’和驱动疯魔灭神甲第三重秘纹
  description: '罗峰在波星海一役后的岁月中，创造了一套“宇宙之主最强秘法”，并命名为《裂金》。同时他还特意命名了右手的第三重秘纹为《灭神》。'

- time: 数百年后
  event: 巨斧和混沌城主对罗峰未来可能性的重新评估
  description: '在数百年前波星海一役中，罗峰爆发让巨斧和混沌城主震惊，原祖也认定罗峰成为宇宙最强者的机会超过混沌城主。'

- time: 数百年后
  event: 混沌城主对罗峰的期待
  description: '混沌城主认为以罗峰现在的进步速度，未来会变得非常强大，并且有可能很快尝试冲刺宇宙最强者的称号。'
- time: 半个月
  event: 罗峰找到属于自己的空间密室
  description: '罗峰耗费了半个月时间，终于找到了自己的空间密室。'

- time: 不详
  event: 净眼之主与罗峰交手
  description: '净眼之主与罗峰交手后，灵魂攻击被罗峰轻易抵挡，只能使用领域类至宝压制罗峰。'

- time: 离开黑纹石柱空间后
  event: 前往宇宙舟深处
  description: '罗峰继续朝宇宙舟深处前进，环境更加恶劣、危险。'

- time: 当初
  event: 得到黑色信物
  description: '罗峰得到黑色信物，并从密室空间中获得详细地图。'


#  墓陵之舟====================================
- time: 十几纪元
  event: 各方联手对付鹿虫之主
  description: '不约而同的包括一直不对盘的骸族、神眼族，此时也同样是对鹿虫之主下手。'
  internal_time:
  - time: 紧跟着正彼此牵制的鹿虫之主、神眼族、骸族、第一祖神教，几乎同时冲进了闸门入口。
    event: 强者进入墓陵之舟
    description: '各路强者几乎是同一时间进入了墓陵之舟内部。'

  - time: 沿着墓陵之舟内部通道，六道身影在高速前进，鹿虫之主的确是众矢之的，他的速度也明显变慢。
    event: 六人争夺控制核心
    description: '各路强者继续沿通道前进，其中鹿虫之主被众人围攻减速。'

  - time: "就是那！"
    event: 鹿虫之主撞击旋转廊道壁
    description: '鹿虫之主撞击旋转廊道壁触发机关关闭巨大闸门。'

  - time: 当罗峰他们九位在这迷雾殿厅时
    event: 青发男子断东河出现并开始第一次筛选
    description: '青发男子断东河出现在迷雾殿厅，宣布进行第一次筛选。'

  - time: 片刻
    event: 筛选结束，鹿虫之主通过
    description: '魔方仪器筛选结果公布，鹿虫之主通过了筛选。'

  - time: 片刻
    event: 唳海之主被判定不符合
    description: '唳海之主进入魔方仪器后，被断东河宣布不符合条件。'

  - time: 不详
    event: 琉玖之主、影埃之主等通过筛选
    description: '琉玖之主和影埃之主等人相继通过了魔方仪器的筛选。'

  - time: 不详
    event: 断东河指向罗峰进行筛选
    description: '断东河指名让罗峰进入魔方仪器，进行筛选测试。'

  - time: 片刻
    event: 罗峰通过筛选
    description: '罗峰完成魔方仪器的筛选，并且得到了断东河的认可。'

  - time: 不详
    event: 断东河宣布三位不符合者离开
    description: '断东河命令岩巨之主、唳海之主和赤鹨之主立即离去，否则将面临陨落的命运。'
  - time: 前面一部分
    event: 断东河检测结束
    description: '断东河宣布六位闯荡者中，两位陨落。剩下四位继续前进。'

  - time: 未具体提及时间
    event: 罗峰讲述经历
    description: '罗峰向巨斧神殿前的宇宙之主们展示自己在断东河传承中的经历片段。'

  - time: 半年后
    event: 影钟魔主阻止其他宇宙之主进入墓陵之舟舱门。
    description: '在墓陵之舟舱门口，影钟魔主为了自己的族人考虑，不让其他强者越晚进去越好。'

