# index: 宇宙篇
- time: 2174年
  event: 宇宙穿梭抵达血洛世界
  description: '宇宙飞船速度达到36倍光速，在19小时后进行宇宙穿梭抵达目的地。'

- time: 2175年
  event: 罗峰融合第一颗血洛晶
  description: '罗峰盘膝坐在那深吸一口气，身体皮肤隐约有着白气腾绕。'

- time: 罗峰摇头一叹
  event: 第二颗血洛晶没融合成功
  description: '罗峰在尝试第二颗血洛晶时没有成功，决定继续修炼。'

- time: 两年多前
  event: 罗峰通过混沌城第五层
  description: '罗峰在混沌城中通过了第五层，伯兰急于去挑战第六层。'

- time: 两年前
  event: 罗峰通过通天桥第六层
  description: '罗峰成功通过宇宙通天桥的第六层，并获得3200积分。'

- time: 最近
  event: 伯兰尝试通过第七层失败
  description: '伯兰急于挑战通天桥第七层，但因时间参悟不足而失败。'

- time: 融合三颗血洛晶
  event: 成为血武者
  description: '融合三颗后，血洛晶让金角巨兽的本源感悟和战斗威力都提高一倍。'

- time: 融合第四颗血洛晶
  event: 感悟与威力提升不明显
  description: '尽管提升了右蹄爪上的秘纹复杂度，但对宇宙本源契合程度和施展时的效果提升有限。'

- time: 融合第五颗至第八颗血洛晶
  event: 继续融合更多血洛晶
  description: '每次融合都使金角巨兽的右蹄爪上浮现更多的秘纹，并且对宇宙本源法则的感悟和战斗威力继续提升。'

- time: 融合第十颗血洛晶
  event: 感悟与结构发生剧变
  description: '融合十颗后，金角巨兽感受到极大的痛苦并经历物质构成上的根本变化，右蹄爪的力量、颜色和形态都发生了显著改变，使得其力量相当于之前全身总力量。'

- time: 半年（80年内）
  event: 融合97颗血洛晶
  description: 在过去的80年间，罗峰没有受到煞气侵袭的情况下，融合了共计97颗血洛晶。

- time: 2256年
  event: 离开血洛世界
  description: '离开血洛世界'

- time: 2256年
  event: 罗峰通过通天桥第七层
  description: '罗峰成功闯过通天桥第七层并领先于伯兰。'

- time: 六个月后
  event: 罗峰完成四个危险级任务
  description: '罗峰已经完成了四个危险级任务，乌卡和戎钧对此表示惊讶。'

- time: 不详
  event: 真衍王劝说罗峰关于绝境任务的决定
  description: '真衍王对罗峰决心执行绝境任务表示担忧，并告诫他要小心谨慎。'

- time: 六个月后
  event: 罗峰接受绝境级任务
  description: '罗峰在老师建议下，决定接取虚拟宇宙公司的绝境级任务“魔山”。'

- time: 文章开头前的情节
  event: 界主、域主们进入神殿行礼
  description: '界主、域主们进入千星宗的神殿向太上宗主行礼。'

- time: 不明时刻
  event: 大门自动关闭
  description: '大门在美妇人的力量推动下自动关闭，令所有人感到紧张和恐惧。'

