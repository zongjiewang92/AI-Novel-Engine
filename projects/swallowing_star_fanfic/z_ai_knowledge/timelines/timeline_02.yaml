- time: 2264年
  event: 进入磨山试炼
  description: '美妇人要求闯过魔山的站在左边，没闯过的站右边，并让六名界主、域主留下。 莫洛出现'

- time: 一年后
  event: 魄瑜侯处决巴彦等人
  description: '魄瑜侯从巴彦等三人手中夺取空间戒指和镭射枪，并杀死三人以确保不会泄露秘密。'

