
# 上万亿纪元 =================================
- time: 上万亿纪元
  event: 罗峰实力日渐强大，修炼《神眼秘术》。
  description: '随着罗峰实力日益增强，他的眼神让其他真神感到畏惧。'

- time: 当初
  event: 巨斧事件。
  description: '混沌城主提醒罗峰不要小瞧界兽，提到了巨斧事件。'

- time: 遥远的过去
  event: 昏暗之地的黑色雾气增加。
  description: '随着时间推移，昏暗之地散发的气息越来越恐怖强烈。'

- time: 最近这些年
  event: 晋之世界出现后宇宙海的变化。
  description: '震迦王描述了因为晋之世界的出现使得宇宙海变得更加强大，并强调必须小心银河领主罗峰。'
- time: 未明确具体时间
  event: 查闇之主确认界兽位置
  description: '查闇之主通过瞬移寻找并确认了火虫真主感应到的异种能量汇聚方向，发现那是一头金色界兽。'

- time: 未明确具体时间
  event: 查闇之主分身被吞噬
  description: '查闈之主的一个分身被界兽的一道曲折光线完全吞噬了。'

- time: 未明确具体时间
  event: 火虫真主下令传讯
  description: '火虫真主命令麾下向宇宙海各族传递界兽出现的消息，同时通知所有能传讯的真神。'

- time: 未明确具体时间
  event: 罗峰准备出发
  description: '罗峰接到消息后决定和洪、火穹一起前往火虫真主所在地应对界兽威胁。'
- time: 数秒内
  event: 黑雾蚕茧破裂
  description: '八名真神结合，所有神力浩荡一次冲击，顿时那界兽摩罗撒幅散开的一道道曲折光线，尽皆缠绕向黑色蚕茧。此刻没有一道光线渗透向虚空，而尽皆都是缠绕成黑雾蚕茧，显然全力以赴。'

- time: 数秒
  event: 火虫真主冲出
  description: '狼狈不堪的火虫真主从中冲出。'

- time: 不详
  event: 黑色光柱攻击
  description: '原本黑雾蚕茧破碎后分散开的一条条曲折光线，猛地大亮，变成耀眼的一道道黑色光线。这些黑色光线不再曲折，而是尽皆聚集在一起……形成了一条黑的发亮的光柱！这条黑色光柱，轰然直接冲击在那火虫真主身上，攻击速度之快，火虫真主都无法逃避。'

- time: 一天
  event: 界兽吞吃小型宇宙本源后消失
  description: '界兽在吞食横行魔神的小型宇宙本源仅仅一天就神秘消失，没有任何攻击迹象。'

- time: 半月后
  event: 真神们的担忧和猜测
  description: '所有真神都担心界兽的行动模式改变，并希望是因为特殊原因导致的暂时现象。'

- time: 六个月
  event: 界兽再次出现
  description: '界兽在吞食横行魔神的小型宇宙本源半年后又出现在瞳魔神的小型宇宙附近。'


- time: 第一次出乎各大势力所料，界兽吞吃了紫月圣地小型宇宙本源后消失不到一个月又在宇宙海出现
  event: 界兽再次现身
  description: '界兽在吞食了紫月圣地的小型宇宙本源之后，在不足一个月的时间内重新出现在宇宙海，并且这一次它前往的是横行魔神的宇宙。'

- time: 第二年、第三年的交替期间
  event: 界兽持续活动
  description: '界兽继续其行为模式，每吞食一次小型宇宙本源后消失半年再出现，令整个宇宙海都为之担忧和恐惧。'

- time: 紫月圣地事件过后第三年
  event: 海犽真主发现界兽接近
  description: '罗峰的金角巨兽分身在海犽真主的小型宇宙外发现了界兽，并且罗峰随即前去协助海犽。'

- time: 此次一战
  event: 界兽摩罗撒与银河领主罗峰交战后逃走
  description: '界兽摩罗撒在和银河领主罗峰的战斗中虽然损失不小，但依旧从他手中逃脱。'

- time: 虚拟宇宙内独属罗峰那一位面空间内
  event: 罗峰向众多真神通报与界兽交战的情况
  description: '罗峰在虚拟宇宙内的宫殿广场上向聚集的真神们汇报了自己和界兽摩罗撒战斗的过程以及发现的一些重要信息。'

- time: 提前通知下，明天上午有事，更新依旧要到晚上。
  event: 更新时间提醒
  description: '作者提前告知读者明日白天有事，当晚会继续更新章节。'
- time: 当前情景
  event: 罗峰向界兽摩罗撒发出挑战，要求其发誓不对人类族群出手。
  description: '罗峰嗤笑回应誓言无用。界兽摩罗撒提出以宇宙海运转规则为证的誓言，并表示可以提供额外力量保护投靠的一方免受界兽灾难影响。'

- time: 当前情景
  event: 罗峰冷言拒绝谈判，要求界兽摩罗撒直接投降。
  description: '罗峰明确表示对方无法说服他，除非能够证明其誓言可信并让其他界兽也遵守誓言。'

- time: 当前情景
  event: 摩罗撒最终放弃和谈，使用分解之术加速逃离现场。
  description: '摩罗撒分身被罗峰的星辰塔第七重秘法‘漩涡世界’所困，并且开始倒飞回原处。'

- time: 当前情景
  event: 罗峰施展力量控制住界兽摩罗撒，迫使其九十九个分身合并成一个。
  description: '罗峰通过星辰塔的引力作用迫使所有分身重聚一体，在强大漩涡世界中难以逃脱。'

- time: 当前情景
  event: 摩罗撒面对绝境，承认自己低估了银河领主的实力，并被迫放弃反抗。
  description: '摩罗撒表示即使施展血光聚集于眼眸的拼命战斗绝招也无法逃走，请求罗峰放过它并发誓不再针对人类族群。'



- time: 很久很久以前
  event: 紫月始祖成为族群最强者
  description: '在很久很久以前，紫月始祖只是族群的一员，后来不断崛起才成为整个族群的最强者。'

- time: 不详
  event: 界兽巢穴中界兽逃走
  description: '罗峰和界兽战斗占据绝对上风，杀得界兽实力大损，但最终界兽施展出类似传送通道的招数逃脱。'


- time: 界兽和宇宙海生命的第一次接触
  event: 摩罗撒败退回去
  description: '界兽摩罗撒被银河领主击败，退回一阶。'

- time: 银河领主受到压力的时刻
  event: 宇宙海各族将希望寄托在银河领主身上
  description: '宇宙海各族认为如果银河领主无法突破为真神，他们将面临大灭绝。'

- time: 短短一年多点时间
  event: 无尽幽海再度扩张到直径12光年
  description: '罗峰突破后，无尽幽海在短短一年左右的时间内再次扩大至直径12光年的规模。'


- time: 未明确具体时刻
  event: 罗峰开始凝结分身与本尊为一体
  description: '罗峰准备将所有分身和地球人本尊融为一体，开始进行融合仪式。'
- time: 立刻
  event: 摩罗撒来到小型宇宙轮廓外准备吞噬本源
  description: '摩罗撒贪婪地看着远处隐隐的小型宇宙轮廓，准备吞噬一颗小型宇宙本源以提升到二阶巅峰。'

- time: 不久前
  event: 震魔神受到界兽攻击并重伤逃走
  description: '震魔神上次出现的界兽将其重伤后逃脱。这次界兽再次出现让震魔神感到担忧，因为上一次它没能处理好局面。'

- time: 虚拟宇宙内会议时
  event: 界兽重新出现的消息迅速传遍各族
  description: '界兽又出现了，消息迅速在各族之间传播开来，除了震迦王和虬岩祖神这两族之外的所有种族都收到了这一消息。'

- time: 当天
  event: 原始宇宙一方派真神队伍保护罗峰小型宇宙不受外界干扰
  description: '原始宇宙派出大量宇宙之主及一些真神环绕在罗峰的小型宇宙周围巡守，禁止任何第一轮回时代和第二轮回时代的强者攻击“小型宇宙”。'

- time: 约一个月后
  event: 摩罗撒连续吞吃六处小型宇宙本源并逃离
  description: '摩罗撒不迎战真神队伍，每次遇到则立即逃逸。在短短一个月内它已经连续袭击了六颗小型宇宙，并且成功逃脱。'

- time: 一个小时
  event: 界兽吞吃初始宇宙本源
  description: '原祖的小型宇宙本源正在遭到界兽吞吃，预计一个小时后将损失八成。'

- time: 十余天
  event: 小型宇宙被吞吃的一般情况
  description: '正常小型宇宙即便被吞吃，一般也能坚持十余天之久。'

- time: 五天
  event: 宇宙之主赶回初始宇宙所需时间
  description: '罗峰从横行魔神的小型宇宙返回原始宇宙需要五天时间（作为宇宙之主）。'

- time: 1小时多些
  event: 真神赶回初始宇宙所需时间
  description: '现在作为真神的罗峰只需一个多小时即可回到原始宇宙。'

- time: 昨日
  event: 罗峰学会《三星界》初卷
  description: '罗峰翻手取令牌回了一句，感应到摩罗撒的灵魂。'

- time: 不久前
  event: 摩罗撒传讯给其他界兽有关银河领主罗峰的信息
  description: '摩罗撒说已经被银河领主镇压，并让它们小心银河领主的“星辰塔”。'

- time: 数万亿纪元后
  event: 界兽诞生最后的王者
  description: '原本还要经过数万亿纪元才能诞生最后的王者。'

- time: 数万纪元内
  event: 界兽进化速度急剧加速
  description: '现在怕会急剧加速，缩短到数万纪元都可能。'

- time: 十个纪元内
  event: 贝迪成为五阶界兽
  description: '贝迪估计十个纪元内成为五阶很有把握。'

- time: 上百个纪元内
  event: 贝迪成为六阶界兽
  description: '上百个纪元内成为六阶，也是可能性极大！'

- time: 1890年
  event: 罗峰开始准备前往界兽巢穴
  description: '罗峰奴役界兽的第1890年便悄无声息离开了。'

- time: 不明时间点
  event: 星辰塔横冲直撞和瞬移飞行
  description: '星辰塔一路横冲直撞，时而瞬移，时而高速飞行。'

- time: 不明时间点
  event: 罗峰进入万重浪水域
  description: '星辰塔直接飞入万重浪水域，开始朝昏暗之地逼近。'

- time: 不明时间点
  event: 星辰塔消失并瞬移前进
  description: '罗峰小心驾驭着星辰塔飞入无尽黑暗中后消失，并以一块漂浮的石头形态前行。'

- time: 不明时间点
  event: 界兽发现岩石
  description: '一头丑陋狰狞的界兽凭借空间感应，发现了那块岩石的存在。'

- time: 不明时间点
  event: 岩石碎裂后重新凝聚并继续前进
  description: '罗峰在界兽离开许久后让岩石再度凝聚，并变幻成另一模样，继续瞬移前进。'
- time: 界兽贝迪施展轮回通道时
  event: 施展最强招数前
  description: '界兽贝迪施展燃血秘术，全身的血色秘纹迸发光芒。'

- time: 界兽贝迪施展毁灭法术后
  event: 最强之法‘毁灭’
  description: '界兽贝迪身体表面游动着血色丝线纹路，形成巨大的血色纹图悬浮在身后。'

- time: 施展最强招数后
  event: 毁灭的怒吼
  description: '贝迪和身后的巨大光之界兽同时发出毁灭的怒吼声，令罗峰灵魂一颤。'
- time: 当前时刻
  event: 界兽数量增加至一百六十万
  description: '一百六十万界兽从各个方向迅速围来，个个都施展着自己极限距离瞬移，不断逼近。'

- time: 某段时间后
  event: 包围圈缩小
  description: '密密麻麻的界兽们彼此传音，比最精密的军队配合还要精妙，每个保持一定距离，每个感应一片区域，不断缩小包围圈。'

- time: 时间流逝...
  event: 搜索失败
  description: '所有界兽疯狂寻找银河领主，任凭它们怎么找都找不到。'

- time: 当前时刻
  event: 界兽数量增加至六百万
  description: '更多的界兽行动了，疯狂也从众多区域围捕过来，原本已经形成包围圈的那一百多万界兽们也开始反向往外瞬移前进，继续搜捕罗峰。'

- time: 当前时刻
  event: 摩罗撒报告六百万界兽动向
  description: '摩罗撒操控着巨大的昏暗之地模型，连道，“包括之前的那一百多万界兽，现在一共已经有约六百万界兽行动了”。'
- time: 千万倍时间加速
  event: 创出最高境界一式刀法
  description: '罗峰借助千万倍时间加速创出了代表自己当前最高境界的一式刀法。'

- time: 星辰塔底座的其中一侧门中
  event: 罗峰出现
  description: '银甲身影出现在星辰塔的一个侧门，准备应对围堵的界兽们。'

- time: 刷！
  event: 星辰塔消失和神力海洋显现
  description: '星辰塔瞬间消失，罗峰化为一神力海洋散开。'

- time: 界兽受到冲击时
  event: 使用神眼秘术
  description: '罗峰使用神眼秘术对最近的九百多名界兽施加灵魂冲击。'

- time: 刀光瞬间飞出
  event: 施展刀法
  description: '罗峰挥出一招结合四大基础法则和毁灭本源的强大刀法，斩向面前的界兽们。'

- time: 足有六千道光柱同时降临
  event: 界兽数量联合攻击
  description: '六千界兽发动联合攻击，在罗峰施放刀光后碰撞并爆炸。'

- time: 不详
  event: 界兽数量增加
  description: '前往围剿罗峰的界兽数量达到七百九十万，神力化身感到效果不错。'

- time: 摩罗撒报告
  event: 界兽数量变化
  description: '摩罗撒告知神力化身，最近的队伍有12000界兽迅速撤退并分散逃窜。'
- time: 当四十五万界兽完全分散开，从整个倾峰界主体高山的山口同时往外瞬移前进时
  event: 界兽开始逃出倾峰界
  description: '当所有的界兽分散开来，并开始逃离倾峰界进入宇宙海的时候。'

- time: 罗峰一摇头，随即施展开超远距离瞬移
  event: 罗峰返回原始宇宙
  description: '罗峰意识到无法阻止所有界兽逃出后决定赶回原始宇宙。'
- time: 现在正是最关键时刻，估计一两天后界兽便到了
  event: 预计界兽来袭
  description: 混沌城主预计一两天后界兽将到达原始宇宙。

- time: 尚未明确
  event: 原祖被放出
  description: 本源意志告知原祖无法立即释放，但解除对其意志的压制。

- time: 未知（未来）
  event: 界兽浩劫解决
  description: 如果能够成功抵御界兽浩劫并作出大贡献，则可以放出现祖。

- time: 近二十天
  event: 界兽们吞吃罗峰小型宇宙
  description: '坐山客已经在罗峰的小型宇宙等待近二十天，等待界兽们吞吃罗峰的小型宇宙。'

- time: 十九万纪元内
  event: 银河领主飞到第一轮回时代小型宇宙区域
  description: '罗峰飞到那第一轮回时代小型宇宙区域耗时极为短暂，主要是那些界兽们厮杀吞吃耗时很长，界兽原本是要数万亿纪元才能进化出最后的王者，现在缩减再快也要十九万纪元内。'

- time: 罗峰回到原始宇宙，回到了银河圣地。
  event: 回到银河圣地
  description: '罗峰从外界回到银河圣地，准备去见亲人。'

- time: 不多时
  event: 面见家人
  description: '罗峰见到父母、妻子及儿子等家人，告诉他们界兽浩劫的最终决战即将到来。'
- time: 历经亿万纪元
  event: 等待学会《列元术》的存在出现
  description: '晋之神王等待了一个足以让神王们为之痴狂的秘术存在，这一秘术入门需要意志化圣。'

- time: 当下这一刻
  event: 罗峰成功掌握至高意志秘术《列元术》，击败界兽漠河
  description: '罗峰在意志化圣后瞬间学会了《列元术》并用它消灭了两头界兽漠河及它们的数百万分身。'

- time: 当下这一刻
  event: 准备让摩罗撒进化成界兽王者
  description: '罗峰将摩罗撒收入星辰塔，准备让它在其中完成进阶，成为最后的界兽王者。'

- time: 星辰塔镇压空间内
  event: 界兽摩罗撒开始进化
  description: '无数界兽的气息疯狂灌入摩罗撒体内，使其迅速变大并攀升到六阶顶尖，最终融入所有死去界兽的力量。'
- time: 界兽浩劫度过后
  event: 释放原祖
  description: '罗峰解决界兽浩劫，祖神教遵照本源意志的承诺开始释放人类原祖。'

