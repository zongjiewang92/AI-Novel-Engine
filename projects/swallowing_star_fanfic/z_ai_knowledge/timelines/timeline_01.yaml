# index: 进入初始宇宙-混沌城
- time: 2074年
  event: 进入初始宇宙
  description:
  - 进入初始宇宙
  - 混沌城修行
  - 初始宇宙 30 年 外界100年
  internal_time:
  - time: 旅途三年后
    event: 罗峰和戎钧等人闯通天桥
    description: '罗峰大吃一惊，得知戎钧成功通过一层。'

  - time: 八个月前
    event: 伯兰无法闯过第三层
    description: '八个月前，伯兰未能通过通天桥的第三层。'

  - time: 几日前
    event: 陇云尝试闯第一层失败
    description: '前几天，陇云尝试闯过通天桥的第一层但未能成功。'

  - time: 不久前
    event: 伯兰通过第三层
    description: '前不久，伯兰已经通过了通天桥的第三层。'

  - time: 刚刚
    event: 加莱西通过第一层
    description: '加莱西刚刚通过通天桥的第一层，成为继伯兰和戎钧之后第三个成功者。'

  - time: 十年
    event: 罗峰修炼《飘血》完成第一套剑法领悟
    description: '罗峰在混沌城花费十年时间完成了对《飘血》第一套剑法的完全领悟，准备前往通天桥挑战。'

  - time: 第四年
    event: 戎钧通过第二层通天桥
    description: '戎钧用了四年时间通过了通天桥第二层。'

  - time: 第七年
    event: 涛通过第二层通天桥
    description: '涛在第七年通过了通天桥第二层。'

  - time: 第八年
    event: 古思罗、陇云、加莱西通过第二层通天桥
    description: '古思罗、陇云和加莱西都在第八年通过了通天桥第二层。'

  - time: 第九年
    event: 乌卡、千水突破至第二层通天桥
    description: '乌卡和千水在第九年突破到通天桥第二层。'

  - time: 十年
    event: 伯兰通过第四层通天桥
    description: '伯兰用了十年时间通过了通天桥第四层，比预期的二十年提前了一半的时间。'

  - time: 第四年至目前
    event: 罗峰闭关修炼
    description: '罗峰在这四年内一直闭关静坐参悟，未去闯通天桥，直至第十个年头方才睁开眼睛准备前往挑战通天桥。'

  - time: 罗峰这次爆发前
    event: 天才们通过通天桥的层数
    description: "伯兰通过第四层，戎钧等七人通过第二层，其他人通过第一层。"

  - time: 在混沌城第28年
    event: 悟透剑法
    description: 罗峰悟透《九宇混沌碑》第一幅图“雨滴图”的第九套剑法。

  - time: 混沌城第19年
    event: 罗峰闯过第四层通天桥
    description: 罗峰在混沌城第19年就已经通过了通天桥的第四层。

