

# 距离开始 6万5千8百年了   # =============跨入不朽之时==========================
- time: 67800年
  event: 罗峰跨入不朽
  description: '罗峰跨入不朽，神力灌体的动静比真衍王成为宇宙尊者时要大上千倍万倍。'
  internal_time:
  - time: 混沌城主观察之时
    event: 观察罗峰不朽变化
    description: '混沌城主隐约看到宇宙翻覆，法则海洋倾倒，神力涌入虚空的现象，并震惊于罗峰的神秘力量。'

  - time: 当天
    event: 罗峰选择在雷霆岛山腰建造宫殿群
    description: '罗峰入驻雷霆岛山腰后，引发了宇宙尊者们的不满和议论。'

  - time: 不详
    event: 雷鸣尊者和其他七位宇宙尊者对罗峰占据山腰位置表示不满，并讨论此事。
    description: '雷鸣尊者等人向真衍尊者诉说他们对于刀河王罗峰入驻山腰的不满情绪。'

  - time: 不详
    event: 真衍尊者告知罗峰关于他入驻山腰引发争议的事宜。
    description: '真衍尊者告诉罗峰，他的举动在宇宙尊者中引发了广泛的不满，并建议罗峰搬出山腰以避免不必要的麻烦和误解。'

  - time: 当年
    event: 吠镜王追杀罗峰
    description: '当年吠镜王追杀罗峰，最后推断罗峰有灵魂类至宝。'

  - time: 没有具体时间点
    event: 法则领域施展
    description: '沛风尊者施展法则领域的秘法，使方圆上亿公里陷入时间法则的法则领域中。'

  - time: 当年
    event: 吠镜王自爆前未能公开消息
    description: '当年吠镜王没有将罗峰拥有灵魂类至宝的消息回禀给北疆联盟族群高层，怕被北疆联盟超级存在夺走。'

  - time: 当自己和吠镜王一战已经过去了两天时
    event: 战斗视频传入人类族群中，一些宇宙尊者看到后反应。
    description: '战斗视频早些时候已被传入人类族群，并且被许多宇宙尊者观看。'

  - time: 击杀吠镜王消息传开时
    event: 罗峰跨入新的圈子——宇宙尊者这一层圈子。
    description: '罗峰的消息传播后，他被看作是强者，未来可能更加强大，成为人类族群的支柱存在。'

  - time: 接下来的几天内
    event: 多名宇宙尊者前来拜访罗峰。
    description: '在这段时间里，已经有一百六十三名超级存在如宇宙国主和宇宙尊者来到罗峰处做客。'

  - time: 罗峰击杀吠镜王消息传开时
    event: 宇宙尊者的反应与态度变化。
    description: '许多之前对罗峰不满的宇宙尊者，现在遇到真衍尊者会向他赔罪并表达歉意。'

  - time: 几天后
    event: 罗峰被邀请加入人类最高会议。
    description: '归一尊者奉混沌城主之命，传达消息给罗峰，关于其加入人类最高会议的提案已获通过。'

  - time: 当吠镜王无比愤怒时
    event: 祖神秘境的紫荆岛上热闹非凡
    description: '上亿的各族传承者都在谈论之前雷之兽神降临并赐予刀河王宝物的事情，并猜测刀河王得到了什么宝物。'

  - time: 当罗峰试验新得到的宝物时
    event: 罗峰获得金线极光镜
    description: '罗峰站在古老镜子前，将生命印记烙印在镜子中，使其变小并融入世界戒指。随后，他迅速掌握了该宝物的信息和功能，并开始研究如何将其与其他至宝结合使用以提高战斗力。'

  - time: 罗峰得到金线极光镜后
    event: 每天研究金线极光镜
    description: '罗峰每天都将金线极光镜和其他至宝结合起来，思考在不同的战斗方式下如何使用它。'

# 距离开始 7万   # =============原始星即将开启==========================
- time: 70000年
  event: 最高会议召开
  description: '混沌城主宣布原始星将要开启，这是一个族群中超级强者们争夺宝物的机会。'

- time: 不详
  event: 宇宙本源之地通道关闭
  description: '宇宙中的10081条通往原始星的通道平常都是关闭状态，仅在漫长岁月后会开启一次，并持续一千纪元。'

- time: 开启时
  event: 强者进入原始星
  description: '每次原始星开启时都会有超级强者们进入争夺宝物，甚至有宇宙之主陨落。'

- time: 最高会议加入
  event: 贡献值制度介绍
  description: '新加入最高会议的成员如刀河王罗峰将会了解到贡献值制度及如何通过贡献为族群做出巨大贡献并换取所需资源宝物。'

- time: 当时在虚拟宇宙中，鸿盟城内城剑河罗消息传开时
  event: 宇宙尊者们想要赶来原始星
  description: '当时大量宇宙尊者想要赶到剑河罗出世之地的原始星。'

- time: 不久前
  event: 罗峰和混沌城主交谈完后
  description: '罗峰迅速离开原始星前往远处山林。'

- time: 不详
  event: 炎帝带着麾下焱神族脱离人类族群居住在遥远的偏僻疆域
  description: '无尽岁月以前，炎帝带领着焱神族从人类族群中分离出来定居于远离人类疆域的一个宇宙秘境。'
- time: 立即
  event: 邪翼教主感应到罗峰的瞬移波动
  description: '邪翼教主巨大的双翼一振，那蛇尾一甩，连一个瞬移直接逼近过去。'

- time: 不详
  event: 罗峰抵达空间封锁区域最外围
  description: '罗峰是直接抵达空间封锁区域最外围，看到二师兄缩小封锁范围并推测异族可能到了。'

- time: 接近光速飞行时
  event: 邪翼教主追上罗峰
  description: '邪翼教主迅速施展开法则领域，并试图困住罗峰，但未成功。'

- time: 罗峰被沙粒围攻后
  event: 罗峰使用天赋秘法逃脱
  description: '罗峰利用“域”的天赋秘法逃脱了麻沙尊者的攻击并迅速到达数万公里外。'

- time: 麻沙尊者操控无尽沙粒后
  event: 罗峰再次逃逸成功
  description: '罗峰使用“域”天赋秘法，连续闪烁到数十万公里外，令追杀的邪翼教主和泥蛙智者感到棘手。'

- time: 麻沙尊者愤怒咆哮时
  event: 罗峰利用天赋逃脱成功
  description: '罗峰逃出麻沙尊者的掌控范围，并让三位宇宙霸主徒劳无功，无法抓住他。'
- time: 现在
  event: 炎帝拖延时间不让罗峰取劫甲
  description: '焱帝称自己正在原始星和其他族群强者争斗宝物，耽搁了点时间。'

- time: 当前
  event: 罗峰来取劫甲
  description: '罗峰奉坐山客老师命令前来取劫甲。'

- time: 将来
  event: 若遗失劫甲
  description: '若将来遗失了劫甲，焱帝表示不怪师兄就好！'
- time: 罗峰瞬间化作一道流光，速度飙升起来
  event: 罗峰加速飞行
  description: '罗峰为了查看远处的动静而迅速提高了自己的速度。'

- time: 很快便看到遥远处连绵丘陵上的五名正在厮杀的强者身影
  event: 强者们在战斗
  description: '罗峰飞速前进，很快发现了一群宇宙尊者正在进行一场激烈的战斗。'

- time: 嗖！罗峰迅速降落下。
  event: 罗峰降落
  description: '罗峰看到远处的战斗后决定快速下降到地面。'

- time: 不久前（从妖族、九域联盟双方强者离去开始算起）
  event: 其他异族强者的离开
  description: '因为战斗引起的动静，除了已经离开的两组宇宙尊者外还有六组其他种族的强者也离开了此地。'

- time: 罗峰一眼看到遥远处半空中的空间漩涡
  event: 发现新的通道
  description: '罗峰在飞过荒原时注意到了一个通向未知原始星的空间漩涡。'

- time: 当即俯冲而下，罗峰飞入一座低矮的古老山林中
  event: 进入古老山林
  description: '罗峰决定遵循历史经验，在一个地方等待，并选择了进入一片古老的山林之中。'

- time: 彭！罗峰一脚踹在大树的树干上
  event: 踹树实验
  description: '为了测试原始星的独特性质，罗峰用神力撞向一棵巨大的树干，体验其震动效果和恢复能力。'

- time: 嗤！罗峰一脚碰在某个坚硬物体上
  event: 发现银白色尖角
  description: '罗峰走路时无意中踩到了一个异常的坚固物体——一根银白色的尖角，并发现这根尖角似乎蕴含了某种不凡的力量。'

- time: 罗峰蹲下，右手落在尖角上
  event: 拔出正方体重宝
  description: '罗峰在仔细检查后用力拔出了一个通体银色的正方体物体，并确认其为一件重宝。'
- time: 新的一月到来
  event: 番茄会努力存稿
  description: '新的一月番茄会努力存稿，让自己更加稳定点，写的情节也更加激情点！'

- time: 不详
  event: 宝物认主成功
  description: '罗峰的神力烙印生命印记在黑色剑体上，完成认主。'

- time: 罗峰思索时
  event: 八名宇宙高等尊者攻击金角巨兽
  description: '三支队伍共八名宇宙超级存在疯狂攻击金角巨兽双翼。'

- time: 宝物认主后不久
  event: 宇宙强者离去
  description: '得知宝物被认主，围攻的八位宇宙高等尊者失望离去。'

- time: 正文描述时
  event: 异族宇宙尊者交谈
  description: '一些异族宇宙尊者们讨论这次夺宝结束并猜测下次再试。'

- time: 不详
  event: 发现剑河罗神剑
  description: '北疆联盟的一名紫色金属型宇宙尊者发现剑河罗中一柄黑剑至宝，并传消息给联盟内部。'

- time: 前不久
  event: 罗峰得知剑河罗神剑的消息并开始计划逃跑
  description: '罗峰在虚拟宇宙得知剑河罗神剑出世消息后立即决定逃跑，并选择了通往外界的漩涡通道作为逃跑路线。'

- time: 刚刚
  event: 罗峰与岐血宫主、卑酆尊者交战
  description: '罗峰与岐血宫主和卑酆尊者发生战斗，北疆联盟迅速对罗峰采取行动，并开始布局对付他。'

- time: 原始星上，悬浮在半空的空间漩涡旁
  event: 宇宙之主降临原始星
  description: '一道巍峨的身影高足有上千公里，全身有着黑色、红色驳杂的鳞片铠甲，面部皮肤呈现绿色，眉毛也为绿色，有着两根暗红色的弯曲长角，独眼仿佛看透整个原始星上一切动静般。他掌控了整个原始星上的时空。'

- time: 不详
  event: 宇宙之主控制时空束缚金角巨兽
  description: '宇宙之主通过控制时空对森林中的金角巨兽施加束缚，使其难以活动和反抗。'



- time: 近十万年
  event: 罗峰回顾过去经历并感慨时间流逝
  description: '罗峰回想自己从第一次前往混沌城到现在已经近十万年的漫长岁月，期间经历了血洛世界闯荡、魔音山冒险、担任乾巫分部监察特使等众多事件。'

- time: 每一万年两次
  event: 天才战举行
  description: '罗峰知道每隔一万年就会举办一次天才战，但对此他一直没关注过。'

# 距离开始 10万   # =============匠神山==========================
- time: 100000年
  event: 罗峰在匠神山下守候
  description: '罗峰在这半年时间里，观察匠神山的一些动静，寻找机会。'
  internal_time:
  - time: 显然令罗峰很轻松了。
    event: 罗峰进入黑色葫芦内获取第四块金属板
    description: '金角巨兽分身凭借劫甲削弱火焰伤害，神体缓慢消耗，并由幽海分身不断补充神力。'

  - time: 很快坠落到这火焰空间的底部。
    event: 金角巨兽到达黑色葫芦底部
    description: '金角巨兽迅速抵达并尝试夺取第四块金属板。'

  - time: 自己斩断那秘法封印，果然令布下秘法封印的匠神之主察觉了，
    event: 匠神之主发现入侵者
    description: '当金角巨兽破坏火焰空间底部的秘法封印后，匠神之主迅速返回。'

  - time: 紧跟着金角巨兽分身便已经穿过空间漩涡了。
    event: 金角巨兽被扔进绝地空间漩涡
    description: '匠神之主将入侵者丢入通往绝地的空间漩涡中，给予其一线生机。'
  - time: 金角巨兽怒吼着双翼一振，巨大的羽翼如刀再次狠狠劈斩过来。
    event: 金角巨兽攻击魃剑尊者
    description: '金角巨兽使用其强大的翅膀进行攻击。'

  - time: 轰！
    event: 魃剑尊者被击飞
    description: '金角巨兽的攻击使魃剑尊者翻滚着倒飞。'

  - time: “我神体即使是42%，那也是有着六亿界主之力、长上千公里的强大神体的42%！是你的百万倍千万倍！而且我的劫甲更是巅峰至宝，就算宇宙之主都难达到极限值，即使你拥有顶级至宝神剑，即使你的秘法威力滔天，在劫甲下也得被削弱到万分之一……”
    event: 魃剑尊者意识到无法逃脱
    description: '魃剑尊者明白金角巨兽的计划，并且决定消耗其力量直至死亡。'

  - time: “我杀不死你，我耗死你。”“九虓河下，你逃都逃不走，唯有死这一条路！”金角巨兽仰头发出一声震天怒吼
    event: 金角巨兽宣布计划
    description: '金角巨兽表明其打算通过消耗战让魃剑尊者死亡。'

  - time: “快，逃。”“快。”策天尊者、羽黯领主也看明白了，顿时飞离出九虓河区域并且远远飞离开。
    event: 策天尊者和羽黯领主逃离
    description: '看到魃剑尊者的困境后，策天尊者和羽黯领主决定远离危险。'

  - time: “金角巨兽，放我一条生路。”魃剑尊者咬牙不甘心，还是传音道。
    event: 魃剑尊者请求投降
    description: '魃剑尊者在无望中尝试向金角巨兽求饶。'

  - time: 轰！
    event: 魃剑尊者的自爆
    description: '无法逃脱的魃剑尊者选择自爆炸毁自己以避免成为奴隶。'

  - time: “哗哗~~~”金浪翻滚，金角巨兽踏浪在宇宙星空中，神力传音浩浩荡荡：“策天尊者、羽黯领主，你们是否继续要与我为敌？”
    event: 金角巨兽向策略天和羽黯领主发问
    description: '金角巨兽询问远去的策天尊者和羽黯领主是否打算与其对抗。'

  - time: 足足耗费了近二十分钟
    event: 到达星空神山山顶
    description: '金角之主和旋灭之主带领罗峰花费近二十分钟到达星空神山的最顶部，那里有一座独立山峰。'
    
  - time: 不详
    event: 接见金角罗峰
    description: '始祖决定亲自接见刚回归联盟不久的金角罗峰，这一举动让罗峰感到意外和惶恐。'

# 距离开始 10万   # ============= 星空神山 星空巨兽联盟始祖 小宇宙 ==========================
- time: 100000年
  event: 罗峰与始祖的赌约期限
  description: '罗峰需要在10万纪元内完成击败始祖分身的任务。'
  internal_time:
  - time: 上亿年
    event: 罗峰研究金之兽神的八秘纹图
    description: '罗峰一直沉浸在对金之兽神八大秘纹图的研究中。'

  - time: 一千万年一千万年
    event: 时间流逝
    description: '时间哗哗而过，罗峰每经过一个千万年周期都去观摩金之兽神的八秘纹图并进行研究和创造。'

  - time: 一亿八千万年
    event: 罗峰领悟兽神之心
    description: '在经历了一亿八千万年的修炼后，罗峰忽然忘却了自己，仿佛变成了真正的兽神，并掌握了“兽神之心”。'

- time: 200000年
  event: 罗峰回到原宇宙, 达到宇宙之主 战力
  description: '罗峰知道星空巨兽联盟始祖有意将自己吸纳，但未提及具体时间。'

- time: 当时
  event: 坐山客与罗峰对话
  description: '坐山客询问罗峰是否得到了好处，并要求给予高等至宝近战兵器。'

- time: 第29个小时
  event: 繁光领主发现罗峰
  description: '繁光领主在原始星广袤森林中发现了飞行的罗峰，确认其为传说中的绝世天才罗峰。'

- time: 不详（原文提到约半个小时）
  event: 罗峰得到重宝仿紫辰天
