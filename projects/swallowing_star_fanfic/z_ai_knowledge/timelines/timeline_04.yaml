  description: '帕剌提因为没能追杀到罗峰等人而感到愤怒，认为自己运气不好遇到如此强大的人类界主队伍。'

- time: 到了第二天
  event: 队伍出发执行任务
  description: '不朽神灵泰沃带领队伍乘坐C9级宇宙飞船进入碎星带，准备展开第一次行动。'

- time: 第一天
  event: 在碎星带飞行
  description: '几乎都是主要人类族群和盟友族群势力范围。'

- time: 第二天
  event: 发现异族敌人
  description: '开始是强者稀疏区，后来渐渐发现不少异族强者。'

- time: 第二天，飞船中
  event: 检测到六股不朽神灵波动
  description: '队伍改变方向背离目标，以超高速飞行避开危险。'

- time: 不详具体时间
  event: 靠近异族界主小队
  description: '距离9284万公里的五名异族界主被发现，准备展开行动。'

- time: 近片刻后
  event: 准备攻击目标
  description: '宇宙飞船减速并停下，确定目标位置和详细信息。'

- time: 不足三分钟前
  event: 鳞甲生物偷袭人类小队
  description: '一群界主们迅速将那大量飘散在周围的战利品收起来，而罗峰则是装作环顾四周，忽然一瞪眼看着遥远处，传音急切喊道：“敌人！”'

- time: 远处
  event: 不朽鳞甲生物攻击人类小队
  description: '两名不朽鳞甲生物迅速闪电般前冲。20名界主鳞甲生物立即跟上。随着距离迫近，两名不朽鳞甲生物已经准备挥出那“不朽神力光球”了。'

- time: 不详
  event: 罗峰提醒小队成员有敌人逼近
  description: '“这火焰不朽神力气息……”原本只是表情郑重的毒药，忽然表情狰狞起来，嘶哑道，“是他们！是他们！！！”堪称整个队伍中最沉默的武者旋风在感应到那火焰不朽神力气息，也知道这是他们的生死仇敌。'

- time: 不详
  event: 双方小队交战
  description: '两支队伍几乎瞬间就交战了。“孩儿们，杀光他们，吃光他们。”精悍不朽鳞甲生物怪笑着下令。“是。”“是，大人。”一群界主鳞甲生物疯狂笑着，个个手持着战刀、弯刀等等，个个速度极快且很是敏捷，直接扑了过来。'
- time: 当虬嗜族不朽‘夫威撒’和同族雷克亚通讯时
  event: 虬嗜族不朽‘夫威撒’与雷克亚沟通计划报复人类小队。
  description: '当虬嗜族的“夫威撒”和他的同族“雷克亚”正在进行通信的时候，他们讨论如何对之前杀死他们兄弟的手下之一的人类队伍进行复仇。'

- time: 泰沃他们那支小队依旧在回归老巢途中
  event: 罗峰等人正返回他们的基地。
  description: '与此同时，罗峰所在的团队正沿着C9级宇宙飞船的路线返回他们的根据地，在此过程中泰沃指示队员狂舞检查战利品确保没有敌人留下暗手。'

- time: 泰沃吩咐时
  event: 分配战利品
  description: '在分配这次战斗获得的大量奖励物品时，泰沃提醒要小心敌方可能留下的“暗手”。'
- time: 两天多点
