#罗峰闯过原始通天山 距离开始2600年，将近三千年
- time: 5600年
  event: 出发去域外战场
  description: '罗峰决定出发前往域外战场'


- time: 数分钟后
  event: 看到36条固定空间通道
  description: '罗峰惊叹于眼前的36条固定空间通道，并了解到它们是通往人类疆域的36个分部。'

- time: 不详
  event: 浦浦卡什迎接罗峰
  description: '一名绿色皮肤男子迎接罗峰，自称是负责空间通道3号集散群的浦浦卡什，带领他前往9号分部的空间通道前。'

- time: 瞬间
  event: 通过固定空间通道
  description: '透过空间通道瞬间到达上亿光年外的地方，随后罗峰乘坐陨墨星号开始前往毋窿星域。'

- time: 半个月后
  event: 到达毋窿星域
  description: '巴巴塔告知罗峰正以50倍光速稳定前进，一个半月后即可抵达毋窿星域。'


- time: 近60年
  event: 罗峰在毋窿星域已经呆了近60年，差三个月就到60年了。
  description: '罗峰在毋窿星域内乱闯，不断找寻着银色甲壳碎片。'

- time: 21年
  event: 第一套将甲搜集完成。
  description: '罗峰用了21年时间搜集到了第一套将甲。'

- time: 后39年
  event: 第二套将甲搜集完成。
  description: '罗峰用了后39年时间搜集到第二套将甲。'

- time: 立刻出发
