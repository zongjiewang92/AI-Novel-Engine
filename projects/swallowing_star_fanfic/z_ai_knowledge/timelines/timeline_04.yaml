  description: '罗峰和上万名战士随不朽神灵命令进入空间通道，前往人类疆域之外的第七战场。'

- time: 到达026号兵营基地时
  event: 新兵欢迎会
  description: '罗峰等人到达026号兵营基地后，受到老兵们的欢迎，并被邀请加入精英小队。'


- time: 当初泰沃邀请罗峰二人加入这小队
  event: 加入小队
  description: '当时毒药就第一个跑过来，表明对罗峰二人的重视。'

- time: 虚空中飞船小心前进
