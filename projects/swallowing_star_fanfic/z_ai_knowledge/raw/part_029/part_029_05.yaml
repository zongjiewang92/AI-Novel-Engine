events:
- 名称: 虫族母巢试炼
  描述: 罗峰在天才战的第二座试炼塔中遇到虫族母巢，成功击败。
  时间线: 第一阶段之后进入第二阶段

- 名称: 天才战淘汰赛
  描述: 参与者们在虚拟宇宙中的1008个试炼空间内进行残酷比拼，排名不断变化。

dialogues:
- 主体: 罗峰
  客体: 巴巴塔
  对话内容: |
    "我问你，这母巢内部，有没有母皇？"
    "有！而且还没死。不过你放心，它现在不会对地球有任何威胁。"

- 主体: 虚拟宇宙的乾巫大陆一对年轻情侣
  客体: 街头屏幕
  对话内容: |
    "戎钧太酷了！"
    "看，虚拟宇宙公司官网，最新又推出了‘野人戎钧’的一段宣传视频。"

timeline:
- 时间点1: 罗峰与虫族母巢的战斗开始
- 时间点2: 天才战排名不断变化

mysteries:
- 内容: 虫族母皇如何被控制以避免威胁地球？
