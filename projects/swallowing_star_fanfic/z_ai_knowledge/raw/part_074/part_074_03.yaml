dialogues:
- speaker_id: rofei
  listener_id: zhengyanzunzhe
  content: "弟子即将离开人类疆域出去一趟。若是不出弟子所料，怕是会有一场腥风血雨！老师是弟子的老师，弟子怕给老师带来一些麻烦，这三件至宝也能帮助老师，万望老师别推却。"
- speaker_id: hundunchengzhu
  listener_id: rofei
  content: "你已不是弱者，什么决定都该你自己来做。只要你记住，你不单单代表你自己，还代表你的家人，你地球人一脉。记住这些，就够了。"

