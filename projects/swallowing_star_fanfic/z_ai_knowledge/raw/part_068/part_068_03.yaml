source:
  id: 第1025章不朽我为宇宙

entities:
- id: 罗峰
  type: Character
  name: 罗峰
  aliases: []
  description: >
    昆仑古国地球人，拥有多个分身和原核。
  attributes:
  - 实力强于混沌城主老师和坐山客
  - 意识被神秘力量引领到宇宙最神秘之地
  - 获得逆天天赋秘法“我为宇宙”
- id: 幽海分身
  type: Character
  name: 幽海分身
  aliases: []
  description: >
    罗峰的重要分身之一，生命基因层次刚过一万。
  attributes:
  - 生命基因层次达到完美极限
  - 身高九万多公里

- id: 混沌城主老师
  type: Character
  name: 混沌城主老师
  aliases: []
  description: >
    掌控一方时空的强者。
  attributes:
  - 对宇宙本身的力量毫无察觉

relationships:

events:
- id: 罗峰意识被引领到神秘之地
  type: Event
  description: >
    神秘力量将罗峰的意识引向宇宙最神秘的地方，传授逆天天赋秘法“我为宇宙”。
  timeline:
    start: 刚达到完美生命基因极限

- id: 原核蜕变
  type: Event
  description: >
    罗峰的原核在获得天赋秘法的同时发生明显变化，从多色变为混沌状态。

abilities:
- id: 我为宇宙
  type: Ability
  name: 我为宇宙
  description: >
    极端强大的逆天天赋秘法，能够凭空获得。
  attributes:
  - 威能极端强大

timeline:

mysteries:
- id: 神秘力量来源
  type: Mystery
  description: >
    究竟是什么神秘力量将罗峰意识引向宇宙最深处，并且令其原核发生蜕变？
