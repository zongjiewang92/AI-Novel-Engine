dialogues:
- speaker: "罗峰"
  content: "教官，刚才和总教官一起出去的银发黑袍武者，他怎么一个眼神，就让我们没有反抗能力？这是武者的什么能力？"

- speaker: "江年"
  content: "小子，和总教官一起走的那位，是精神念师！比我们武者数量还要稀少得多的精神念师。当然精神念师一般也是武者！不过却是武者当中最可怕的存在。"

