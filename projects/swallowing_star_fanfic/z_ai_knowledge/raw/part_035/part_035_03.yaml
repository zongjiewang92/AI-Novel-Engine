- 主体: 小纳可
  对象: 纳布
  关系类型: 儿子

events:
- id: 杀死神殿特使
  type: Event
  description: 罗峰杀死两位神殿特使。
- id: 决定离开燕岗城
  type: Event
  description: 罗峰决定帮助纳布父子逃离危机。

dialogues:
- 主体: 纳布
  对象: 罗峰
  内容: "我准备继续留在燕岗城，不过我想请峰大人将我的儿子带着离开燕岗城！"
- 主体: 小纳可
  对象: 父亲
  内容: "爹, 我不要离开爹！"

timeline:
- 时间点: 几天前
  描述: 淳羽家族族长、石风家族将军以及两位神殿特使被杀。
- 时间点: 当晚
  描述: 罗峰决定帮助纳布父子。

mysteries:
- 内容: 纳家是否能幸免于界主的追查？
