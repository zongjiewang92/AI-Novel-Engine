source:
  id: "宇宙的另一边"

entities:
- id: "罗峰"
  type: Character
  name: 罗峰
  aliases: []
  description: >
    主角，通过研究《飘血》秘典中的108文字来领悟空间本源法则。
  attributes:
    实力: 封侯前（宇宙层次）
    修炼进度: 初步了解第一套剑法的皮毛

- id: "巴巴塔"
  type: Character
  name: 巴巴塔
  aliases: []
  description: >
    罗峰的辅助智能，对空间本源法则的理解有帮助。
  attributes:
    实力: 辅助智能（宇宙层次）

- id: "练落"
  type: Character
  name: 练落
  aliases: []
  description: >
    曾经的天才战第一名，解析了108套剑法，并通过《飘血》秘典领悟空间本源法则。
  attributes:
    实力: 封侯（宇宙层次）

- id: "真衍王"
  type: Character
  name: 真衍王
  aliases: []
  description: >
    对罗峰的积分使用情况感到担忧，认为罗峰浪费了珍贵资源。
  attributes:
    实力: 不朽境（宇宙层次）

- id: "混沌城"
  type: Location
  name: 混沌城
  aliases: [ 三宝之城 ]
  description: >
    在混沌城内有初始宇宙的运转法则、52尊混沌碑以及混沌真灵等珍贵资源。

- id: "《幽影秘典》"
  type: Item
  name: 幽影秘典
  aliases: []
  description: 罗峰购买的一套基础秘法，用于提升实力。

- id: "《飘血》秘典"
  type: Item
  name: 飘血秘典
  aliases: []
  description: 练落创造并详细留下的修炼方法，可以加速领悟空间本源法则。

relationships:
- 主体: 罗峰
  客体: 巴巴塔
  关系类型: 辅助智能

events:
- 名称: 研究《飘血》秘典中的108文字
  参与者: [ 罗峰 ]
  描述: >
    罗峰花费超过半个月时间才初步理解第一套剑法的皮毛。

- 名称: 购买《幽影秘典》
  参与者: [ 罗峰 ]
  描述: >
    罗峰用完所有积分购买了一套基础秘法，用于提升实力。

dialogues:
- 主体: 巴巴塔
  客体: 罗峰
  内容: "假使从一开始, 就研究宇宙空间本质, 逐步逐步的研究, 或许一开始慢的多。可到了后期进步速度会越来越快。"

timeline:
- 时间节点: 研究《飘血》秘典中的108文字（超过半个月）
  描述: >
    罗峰花费时间领悟第一套剑法的皮毛。

mysteries:
- 内容: 第三宝混沌真灵
  描述: >
    混沌城第三宝是一种可以吸收提升灵魂契合宇宙空间能力的核心存在，罗峰发现了这个信息后决定去探索。
