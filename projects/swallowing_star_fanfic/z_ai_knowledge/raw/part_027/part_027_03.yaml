  attributes:
    目的: 推动恒星级人类的发展与竞争

- id: "乾巫拍卖会"
  type: Event
  name: 乾巫拍卖会
  aliases: []
  description: 拍卖会中争夺进入初始宇宙参悟名额。

locations:
- id: "乾巫宇宙国"
  type: Location
  name: 乾巫宇宙国
  aliases: []
  description: 宇宙的一部分，拥有众多星系。
  attributes:
    特点: 拥有众多恒星级天才

events:
- id: "巅峰天才战"
  type: Event
  name: 尖峰天才战
  aliases: [ "宇宙人类——巅峰天才战" ]
  description: 宇宙中所有恒星级人类参加的比赛。
  attributes:
    时间周期: 每五千年举办一次，一万年内两次（虚拟宇宙公司和巨斧斗武场各一次）
    奖励: 排名前1000的参赛者将获得奖金、进入初始宇宙参悟以及成为虚拟宇宙公司的核心成员
    参赛条件: 仅限恒星级人类

dialogues:
- id: "罗峰与洪"
  type: Dialogue
  content: |
    洪: "巅峰天才战？"
    罗峰: "整个宇宙所有宇宙国，亿万天才对战？"

- id: "巴巴塔建议"
  type: Dialogue
  content: |
    巴巴塔: "罗峰,机会不错,你得去试试。"

relationships:
- id: "罗峰和洪的关系"
  type: Relationship
  description: 罗峰是洪的弟弟。

mysteries:
- id: "前1000名参赛者的挑战性"
  type: Mystery
  content: |
    巴巴塔表示：要进入宇宙亿万天才总排名的前1000极其困难，尤其是对于罗峰这样的年轻恒星级选手。

