source:
  id: 第1231章交出宝物

entities:
- id: 坐山客
  type: Character
  name: 坐山客
  aliases: []
  description: 制造出至强至宝的存在，能够制造隐秘空间。
  attributes:
    实力: 宇宙最强者以上
    能力: 秘纹图流派研究, 传送隐秘空间

- id: 罗峰
  type: Character
  name: 罗峰
  aliases: []
  description: 正在参悟秘纹图的宇宙尊者。
  attributes:
    实力: 宇宙尊者
    能力: 秘法修炼, 分裂神力化身

- id: 隐秘空间
  type: Location
  name: 隐藏岛屿
  aliases: []
  description: 一个平静且安全的地方，可以参悟秘纹图。
  attributes:
    特点: 安静无危险, 可以传送进出

relationships:
- id: 罗峰与坐山客
  type: Teacher-Student
  name: 师徒关系
  description: 罗峰是坐山客的学生，从其学习秘纹图流派的研究方法。

events:
- id: 参悟秘纹图
  type: Event
  name: 研究秘纹图
  description: 在隐秘空间中参悟五大秘纹图。
  timeline:
    时间: 文章开始
    地点: 隐秘空间

- id: 制作神力化身
  type: Event
  name: 分裂出神力化身
  description: 罗峰分裂出一尊神力化身留在隐秘空间。
  timeline:
    时间: 文章中间
    地点: 隐秘空间

- id: 出发观看战斗
  type: Event
  name: 前往观察宇宙最强者交战
  description: 罗峰和坐山客前往观察宇宙最强者的战斗。
  timeline:
    时间: 文章结尾
    地点: 冰层大地

dialogues:
- id: 提醒罗峰
  type: Dialogue
  name: 坐山客提醒罗峰
  content: "别看了，该出去了。这岛屿很是宁静，又没有任何危险，你只要在这留下一个神力化身，即可慢慢参悟。"
  speaker: 坐山客

- id: 宇宙最强者战斗
  type: Dialogue
  name: 罗峰询问坐山客
  content: "宇宙最强者交手？"
  speaker: 罗峰

timeline:
- 时间点: 文章开始
  事件: 参悟秘纹图
- 时间点: 中间部分
  事件: 制作神力化身
- 时间点: 文章结尾
  事件: 出发观看战斗

mysteries:
- id: 宇宙最强者身份
  type: Mystery
  name: 战斗的宇宙最强者是谁？
  description: 罗峰猜测其中一方可能是巨斧创始者。
