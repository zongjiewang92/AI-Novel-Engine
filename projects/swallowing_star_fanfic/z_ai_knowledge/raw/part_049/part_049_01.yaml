dialogues:
- id: 蚩烛王与父亲对话
  type: Dialogue
  name: 蚩烛王与父亲对话
  content: "蚀火尊者：你这些岁月的确惹了不少乱子，也该好好潜心修炼。等你能够掌握那件至宝，尊者之下，你根本不惧他人。就算和那真衍，你都能一拼，毕竟实力才是根本……父亲并不能总庇护着你。"
  participants:
  - 蚩烛王
  - 蚀火尊者

- id: 罗峰与嗜血王对话
  type: Dialogue
  name: 罗峰与嗜血王对话
  content: "嗜血王：施展神国传送的一定是其中某个不朽神灵的‘不朽奴仆’。而且施展完神国传送，那不朽奴仆肯定会辛辛苦苦转移神国位置，这样神国坐标自然无用了。"
  participants:
  - 罗峰
  - 嗜血王

timeline:
- id: 蚩烛王进攻地球
