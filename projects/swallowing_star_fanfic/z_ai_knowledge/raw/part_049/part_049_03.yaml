  content: "孟牙星系和维里星系，彼此距离很遥远。就算乘坐陨墨星号飞船最短也得8天，而我们还是从乾巫宇宙国赶去... 你必须得请迪伦帮忙，透过神国传送。否则耗费在路途上最起码半年..."
  context: 罗峰需要决定前往哪个地方执行任务。

