dialogues:
- speaker: 徐欣
  content: 这才刚回来当然得家族聚会。
- speaker: 罗峰
  content: 法子，人太多。这才近500年，罗家男子就有数十万了。
- speaker: 徐欣
  content: 华夏国历史上像三国时期征战杀伐，整个华夏人口当时才多少点？可繁衍过千年，照样人口超过10亿。

timeline:
- 时间节点: 罗峰500年前从老家回来
- 时间节点: 家族聚会举行

mysteries:
- 未知信息: 控制虫族母巢中的那头母皇需要多久时间。
