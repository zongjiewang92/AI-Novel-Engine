source:
  id: 第1153章至宝库（本篇终章）

entities:
- id: 罗峰
  type: Character
  name: 罗峰
  aliases: 徒儿
  description: |
    主角，人类族群中的强者，拥有神国和众多强大装备，具备极高的战斗实力。
  attributes:
    实力: 宇宙最强者之一
    能力: 使用血影刀, 传送能力, 瞬移能力, 高级侦查技能

- id: 坐山客
  type: Character
  name: 坐山客
  aliases: 老师
  description: |
    罗峰的老师，实力强大，可以炼制至宝。
  attributes:
    实力: 宇宙最强者之一
    特性: 可以通过青石令牌传递信息

- id: 沉火之主分身
  type: Character
  name: 沉火之主分身
  aliases: []
  description: |
    沉火之主的一个分支，具有一定的战斗力。
  attributes:
    实力: 宇宙霸主

- id: 青石令牌
  type: Item
  name: 青石令牌
  aliases: []
  description: |
    坐山客炼制的传讯至宝。
  attributes:
    功能: 传递信息, 联系老师坐山客

relationships:
- 主体: 罗峰
  关系类型: 学徒
  客体: 坐山客

events:
- 名称: 罗峰前往坐山客住处
  时间线: 长期行动中
  描述: |
    罗峰通过青石令牌获取坐标，使用传送和瞬移技能抵达宇宙虚无之地的特定区域。
  地点: 宇宙一极偏僻疆域

- 名称: 坐山客提供至宝兑换服务
  时间线: 长期行动中
  描述: |
    罗峰带着从沉火之主分身处得到的装备，来到坐山客住处进行至宝兑换。
  地点: 宇宙虚无之地

dialogues:
- 主体: 坐山客
  内容: "哈哈，徒儿，我已知晓你在原始星中做的一切。不过，你为何和那星河之主硬拼？这一硬拼，不就吓住了各大势力么，以后想要令各方集体围杀你都难了。"
- 主体: 罗峰
  内容: "我没想到，而且我当时逃也没法逃。"

timeline:
- 时间点: 现在
  描述: 罗峰前往坐山客住处进行至宝兑换

mysteries:
- 内容: 坐山客的居所为何位于宇宙虚无之地？
