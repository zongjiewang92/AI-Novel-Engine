events:
- id: 神秘宝藏的发现与陨落
  type: Event
  description: 在倾峰界水域探索时，珈御之主发现了神秘光幕后的宝藏，并在尝试进入时突然死亡。
  timeline:
    时间: 第一宇宙时代晚期
    地点: 倾峰界水域底部洞穴

dialogues:
- 主体: 神眼族强者
  对象: 安永之主
  内容: "安永，你这次在内域，可有收获？"
  回应: "内域太危险，我也就在内域一些较为安全的地方逛逛，那些地方早就被搜遍了。什么收获都没有。"

- 主体: 神眼族强者
  对象: 安永之主
  内容: "还是在水域慢慢闯，危险小，偶尔也能得到宝物。"
  回应: ""

- 主体: 珈御之主
  对象: 安永之主
  内容: "珈御，你有收获？"
  回应: "小收获。"

mysteries:
- id: 神秘光幕
  type: Mystery
  description: 在水域中发现的多层神秘光幕后的宝藏，导致珈御之主瞬间陨落。
  解释: 未知
