dialogues:
- characters:
  - 罗峰
  - 紫濮之主
  text: |
    "你也敢在我面前出现？"
    "怎么不敢，这是宇宙舟，又不是你人类的疆域。即便是你人类的疆域，若是原始宇宙允许，我照样敢去闯。银河领主……怎么？你也要对我动手？你和我动手，便是和我紫月圣地为敌！"

