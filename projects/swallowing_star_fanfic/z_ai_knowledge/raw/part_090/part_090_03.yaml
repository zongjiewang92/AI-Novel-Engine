dialogues:
- speaker: 罗峰
  listener: 混沌城主
  content: |
    老师，我这羽翼宝物还欠缺最后一部件，也就是最后一对羽翼！而且我已经知晓……最后一对羽翼就在紫月圣地！
- speaker: 混沌城主
  listener: 罗峰
  content: |
    把握不大，也比没把握好。
    去吧，桀梵子遗留的宝藏，你都去取了好几次了。

