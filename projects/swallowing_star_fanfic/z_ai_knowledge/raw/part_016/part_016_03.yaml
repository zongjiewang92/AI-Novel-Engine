events:
- id: 炼功
  type: Event
  name: 练功
  description: 罗峰在重力室内锻炼，达到行星级三阶。
  timeline:
    时间点: 2060年1月12号上午

- id: 徐欣做饭
  type: Event
  name: 徐欣第一次尝试做菜
  description: 徐欣为罗峰准备饭菜。
  timeline:
    时间点: 2060年1月12号中午

dialogues:
- 主体: 罗峰
  对象: 巴巴塔
  内容: "念力修炼果真比武者修炼难啊，今天才跨入行星级三阶。"
  情境: 在重力室内锻炼后

- 主体: 徐欣
  对象: 罗峰
  内容: "我刚刚买了菜...这是我第一次做菜啊。"
  情境: 菜买回来，准备做饭

- 主体: 罗峰
  对象: 徐欣
  内容: "就算再难吃，我也得吃下去，还得做出兴奋表情，夸赞她！"
  情境: 准备品尝徐欣做的饭菜前的内心独白

timeline:
- 时间点: 2060年1月12号上午
  描述: 罗峰在重力室内锻炼达到行星级三阶念力

mysteries:
- 徐欣做的菜是否真的难吃，但从罗峰的反应来看，似乎并不如预期中的糟糕。
