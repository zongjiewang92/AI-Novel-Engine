relationships:
- id: 罗峰与巴巴塔
  type: Relationship
  name: 协作关系
  description: 巴巴塔作为助手，帮助罗峰更好地利用虚拟宇宙公司的资源。

events:
- id: 查看生活学习栏
  type: Event
  name: 查看生活和学习栏
  description: 罗峰查看虚拟宇宙公司提供的生活和学习资源。
  attributes:
    时间点: 文章开始

- id: 探索修炼任务
  type: Event
  name: 探索修炼任务
  description: 罗峰查看并思考关于挑战的五个级别难度的修炼任务。

dialogues:
- id: 生活学习栏评价
  type: Dialogue
  participants:
  - 罗峰
  - 巴巴塔
  content: |
    "竟然没有丝毫强迫。"罗峰露出笑容，"这个好，想去听课就去听，不想去就自己修炼。倒也人性化。"

- id: 安全环境讨论
  type: Dialogue
  participants:
  - 罗峰
  - 巴巴塔
  content: |
    "温室里的花朵看似美丽却经受不住风吹雨打。"
    "说的对，百炼成钢，你们地球普通人打了疫苗才能抵御一些传染病，都一个道理。不过罗峰，就跟地球人用疫苗一样，你一开始别弄太狠的，先从难度低点的开始试试，逐渐的提高难度。"

timeline:
- id: 第一阶段
  name: 查看和了解资源
  description: 罗峰查看虚拟宇宙公司提供的生活、学习以及修炼相关的信息。

mysteries:
- id: 通天桥幻境海不朽祭坛来历
  type: Mystery
  content: "怎么弄出来的？"
