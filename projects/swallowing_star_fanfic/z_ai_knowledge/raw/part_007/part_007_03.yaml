- 发言人: 陈谷
  内容: 罗峰，别太拼命，悠着点。
  对话时间: 不详

- 发言人: 高风
  内容: 那么拼命干什么, 让自己这么累。
  对话时间: 不详

- 发言人: 杨辉
  内容: 我找你的目的，想必你也知道了。你是扬州城极限会馆总负责人，那罗峰又住在明月小区，你应该对他很熟悉吧。
  对话时间: 不详

- 发言人: 邬通
  内容: 是的, 罗峰是我扬州城堪称最近十年来有数的天才人物, 过年后, 也就是, 刚刚19周岁。成为武者才半年多一点, 现如今, 他的身体素质是拳力10000公斤, 速度是128米每秒。
  对话时间: 不详

