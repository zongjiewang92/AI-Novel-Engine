events:
- 名称: 罗峰处理误伤事件
  时间: 文中
  地点: 晋国虚空军队驻地
  关系人:
  - 罗峰
  - 雪邕将军
  - 鹄后
  - 火琢午
  描述: 罗峰处理因误会而误伤的两名晋国虚空真神，并采取措施剥夺他们的一切军功和宝物，以示惩戒。

dialogues:
- 主体: 罗峰
  宾语: 雪邕将军
  对话内容: "你先问他们，他们为何到我这，对我下手。"
  描述: 罗峰指示雪邕将军询问两位虚空真神的原因。

- 主体: 火琢午
  宾语: 鹄后
  对话内容: "鹄后，你这次害苦我了。"
  描述: 火琢午因误伤罗峰而对鹄后表示愤怒和气愤。

timeline:
- 时间节点1: 文章开头
  关系人: 罗峰, 雪邕将军
  事件描述: 罗峰处理被两名虚空真神误伤的事件。

- 时间节点2: 文中
  关系人: 火琢午、鹄后
  事件描述: 火琢午和鹄后因误伤罗峰而接受惩罚，失去所有军功和宝物。

mysteries:
- 描述: 承木为何要刺杀罗峰？承木与紫月圣地宇宙的关系是什么？
