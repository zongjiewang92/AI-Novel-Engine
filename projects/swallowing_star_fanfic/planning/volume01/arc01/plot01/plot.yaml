##################################################################
id: plot01
title: 星空启程
goal: 用未来时间线制造悬念。
purpose:
  - 告诉读者主角未来一定会成功
  - 引出整部地球篇回忆
emotion:
  - 震撼
  - 向往
children:
  - id: chapter0001
    title: 十年准备
    goal: 主角准备第一次进入宇宙。
    children:
      - id: scene01
        goal: >
          飞船开始进入暗宇宙倒计时，
          展示未来科技。
      - id: scene02
        goal: >
          阿柒登场，
          建立俏皮话痨的人设。
      - id: scene03
        goal: >
          阿柒询问：
          "准备好了吗？"
      - id: scene04
        goal: >
          林玄回答：
          "准备了十年。"
      - id: scene05
        goal: >
          镜头切换，
          回到十年前。
