id: plot_01_01_02

title: 亿万年痛苦中的意识

goal:
- 展现金色力量真正开始运转后的恐怖变化。
- 描述金色核心对生命能量的吞噬过程，形成千米范围生命禁区。
- 描述林玄灵魂在无尽痛苦中逐渐恢复意识。
- 展现林玄凭借强大的意志，在死亡与疯狂之间守住最后的人格。
- 建立主角未来强大意志的根源，为后续修心体系埋下基础。

theme:
- 灵魂蜕变
- 意志极限
- 孤独
- 时间流逝
- 生命吞噬
- 新生代价

purpose:
- 展示金色力量并非简单复活，而是在进行未知层面的生命重构。
- 建立吞噬能力的第一次表现。
- 解释林玄为什么拥有远超普通人的意志。
- 塑造主角“不屈”的核心人格。
- 制造读者对于金球能力和复生代价的疑问。

opening_hook:
- 黑暗。
- 无尽的黑暗。
- 没有时间。
- 没有声音。
- 没有身体。
- 只有一种无法描述的痛苦。
- 林玄不知道自己沉睡了多久。
- 他甚至不知道自己是否还活着。
- 但是有一个念头一直存在：
- “我不能消失。”
- “我必须保持清醒。”

protagonist_state:

  physical_state:
  - 身体处于死亡后的重构阶段。
  - 骨骼开始被未知力量解析。
  - 血肉、细胞、基因正在重新构建。
  - 身体无法行动。
  - 意识无法控制身体。

  mental_state:
  - 林玄意识处于混乱状态。
  - 无法判断时间流逝。
  - 承受无法理解的灵魂撕裂痛苦。
  - 无数次接近意识消亡。
  - 依靠重复数字保持最后的人格。
  - 内心唯一执念： “我是林玄，我不能消失。”

key_scene:
- 金色力量从枯骨向外扩散。
- 周围生命开始失去生命气息。
- 一米范围内生命全部消亡。
- 十米、百米、千米范围形成死亡区域。
- 地表出现一个无法解释的生命禁区。
- 林玄在灵魂痛苦中第一次恢复自我意识。
- 数字成为他抵抗死亡的唯一武器。

climax:
- 金色力量覆盖范围达到千米。
- 曾经存在的森林、昆虫、地下生命全部消失。
- 一个巨大死域在地球表面形成。
- 林玄意识在无数次崩溃后重新凝聚。
- 他第一次听见自己的声音。
- “846297896……”
- “846297897……”
- “846297898……”
- 痛苦开始减弱。
- 一个已经死亡的人类，正在从无尽黑暗中重新抓回自己的意识。

knowledge_unlock:
- 金色力量拥有吞噬生命能量的能力。
- 复生并非简单恢复，而是一场未知生命重塑。
- 林玄的灵魂正在发生未知变化。
- 林玄拥有远超普通人的精神韧性。

ability_unlock:
- 初步激活生命吞噬能力。
- 初步激活生命解析能力。
- 灵魂强度开始提升。
- 主人格保护机制形成。

emotion_curve:
- 黑暗
- 恐惧
- 痛苦
- 疯狂边缘
- 坚持
- 清醒
- 新生希望

reader_question:
- 林玄到底经历了多久？
- 金色力量为什么需要吞噬生命？
- 这些生命能量去了哪里？
- 林玄为什么没有彻底疯狂？
- 数字为什么能够保护他的意识？
- 如果痛苦继续下去，林玄还能保持自己吗？

foreshadow:
- 金色光球真正能力。
- 灵魂本源强化。
- 主人格保护机制。
- 未来修心道路。
- 意志对于强者的重要性。
- 浑源生命层次对于灵魂的影响。

reader_emotion:
- 对主角痛苦经历的震撼。
- 对未知力量的恐惧。
- 对主角坚持的敬佩。
- 对未来成长的期待。

children:

# =====================================================
# Scene 01
# 金色吞噬开始
# =====================================================

- id: scene_01

  title: 第一米死亡领域

  goal:
  - 描述金色力量第一次主动吞噬生命。
  - 建立金色力量的危险性。
  - 让读者感受到复生并非没有代价。

  location:
  - 地球地下深处。
  - 林玄死亡遗骸所在区域。
  - 未来形成死域的核心位置。

  characters:
  - 林玄（意识沉睡状态）
  - 神秘金色力量

  events:
  - 金色光球内部释放未知能量。
  - 能量开始解析枯骨。
  - 骨骼中的生命信息被重新读取。
  - 周围泥土、微生物开始死亡。
  - 一米范围内生命全部失去生机。
  - 金色力量吸收这些生命信息。

  atmosphere:
  - 黑暗。
  - 寂静。
  - 冰冷。
  - 死亡。
  - 无声的变化。

  key_scene:
  - 原本安静存在地下数十年的微生物。
  - 在接触金色力量瞬间失去生命。
  - 没有爆炸。
  - 没有挣扎。
  - 仿佛生命本身被抽离。

  dialogue:
  - 无。

  emotional_focus:
  - 神秘。
  - 恐惧。
  - 未知。

  mystery:
  - 金色力量到底是什么？
  - 为什么需要吞噬生命？
  - 它是在复活林玄，还是创造新的生命？

  ending:
  - 第一米范围成为死亡区域。
  - 金色力量没有停止。
  - 它开始继续向外扩散。
  - 仿佛需要更多生命信息。
  - 仿佛这场重生才刚刚开始。

# =====================================================
# Scene 02
# 十年吞噬
# =====================================================

- id: scene_02

  title: 千米死域形成

  goal:
  - 描述十年时间跨度。
  - 展现生命吞噬范围不断扩大。
  - 建立地球上的神秘禁区。

  location:
  - 地球地下。
  - 地表森林。
  - 未来死域区域。

  characters:
  - 林玄意识。
  - 地球自然生命。

  events:
  - 金色力量范围扩大到十米。
  - 地下植物根系开始死亡。
  - 昆虫进入区域后坠落。
  - 小型动物靠近后失去生命。
  - 范围扩大到百米。
  - 范围扩大到千米。
  - 一个直径近千米的死亡区域形成。

  atmosphere:
  - 时间缓慢流逝。
  - 四季不断变化。
  - 世界不断变化。
  - 唯有死域保持寂静。
  - 生命远离这个地方。

  key_scene:
  - 一只飞鸟误入死域。
  - 它原本自由飞翔。
  - 下一刻身体失去力量。
  - 从天空坠落。
  - 化为灰烬。

  dialogue:
  - 无。

  emotional_focus:
  - 压迫感。
  - 诡异感。
  - 宇宙规则的冷漠。

  mystery:
  - 为什么这个区域没有任何生命？
  - 金色力量是否拥有自己的意识？
  - 如果继续扩大，会不会吞噬整个地球？

  ending:
  - 十年时间过去。
  - 地球无人知道地下发生了什么。
  - 一个千米范围的死亡区域静静存在。
  - 而死亡中心。
  - 一个新的生命正在慢慢形成。

# =====================================================
# Scene 03
# 灵魂无尽痛苦
# =====================================================

- id: scene_03

  title: 数字中的最后自我

  goal:
  - 展现林玄意识恢复过程。
  - 描述灵魂撕裂痛苦。
  - 建立主角强大意志来源。

  location:
  - 林玄意识空间。
  - 黑暗未知领域。

  characters:
  - 林玄意识。

  events:
  - 林玄第一次感受到痛苦。
  - 灵魂仿佛被撕裂。
  - 无数陌生信息冲击意识。
  - 林玄一次次失去意识。
  - 每次即将沉睡时重新醒来。
  - 开始用数字保持思考。

  atmosphere:
  - 无限黑暗。
  - 没有时间。
  - 没有空间。
  - 只有痛苦存在。
  - 意识如同风中残烛。

  key_scene:
  - 林玄不知道自己是谁。
  - 不知道过去多久。
  - 甚至不知道自己为什么坚持。
  - 但是本能重复数字。

  dialogue:
  - >
    846297896……
  - >
    846297897……
  - >
    不能睡。
  - >
    睡过去，我可能就不存在了。

  emotional_focus:
  - 意志。
  - 孤独。
  - 不屈。

  mystery:
  - 灵魂为什么会如此痛苦？
  - 那些陌生信息来自哪里？
  - 林玄正在经历什么层次的蜕变？

  ending:
  - 数字不断重复。
  - 时间失去意义。
  - 林玄不知道过去多久。
  - 但是他的意识没有消失。
  - 因为他还记得一句话：
  - “我是林玄。”

# =====================================================
# Scene 04
# 痛苦消退
# =====================================================

- id: scene_04

  title: 意识重新凝聚

  goal:
  - 描述林玄第一次重新拥有完整意识。
  - 为下一章身份确认做准备。

  location:
  - 林玄精神空间。

  characters:
  - 林玄意识。

  events:
  - 痛苦逐渐降低。
  - 灵魂撕裂感消失。
  - 林玄第一次感觉到疲惫。
  - 第一次产生完整思考。
  - 第一次意识到自己还存在。

  atmosphere:
  - 黑暗开始减少。
  - 寂静中出现微弱光芒。
  - 漫长折磨终于结束。

  key_scene:
  - 林玄意识中第一次出现完整念头：
  - “累。”
  - “真的太累了。”

  dialogue:
  - 我……还活着？
  - 还是说……
  - 这只是死亡前最后的幻觉？

  emotional_focus:
  - 解脱。
  - 疲惫。
  - 新生前的平静。

  mystery:
  - 林玄究竟经历了多少时间？
  - 复生是否已经完成？
  - 接下来等待他的是什么？

  ending:
  - 林玄陷入沉睡。
  - 金色力量仍然缓慢运转。
  - 千米死域静静存在。
  - 一个新的生命。
  - 正等待第一次真正醒来。
