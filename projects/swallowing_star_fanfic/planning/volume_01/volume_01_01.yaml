    - 现在确认：
        - 梦境中的未来真实存在。
    - 林玄重新规划人生。
    - 制定修炼路线：
      - '制定变强计划================='
      - '1. 突破 到 行星级'
      - '2. 尝试获取 木牙晶'
      - '3. 突破到恒星级并感悟领域甚至法则'
      - '4. 感悟法则，准备宇宙巅峰天才战'
        第一阶段：
        - 行星级突破。
        第二阶段：
        - 恒星级突破。
        第三阶段：
        - 法则感悟。
        第四阶段：
        - 进入宇宙。
    - 开始金手指修炼。
    - 利用金色灵魂球解析自身基因。
    - 研究自身特殊生命结构。
    - 发现：
        - 自己的复生与未知宇宙力量有关。
        - 解析自身血液，发现复活的详细过程，了解到自己金手指的能力。
          - 发现灵魂粒子深处，还有别的形态存在，自己不能理解，自己猜测 难道是 梦境中读者们评论的 灵魂真灵？自己意识仿佛承受了万亿年的灵魂撕裂正式这种存在的撕裂然后与金色小球的融合，这种融合过程让自己痛不欲生。当融合完成的时候，其中一个金球与骸骨融合，然后自己才复生的。
          - 如此说来，自己的另外3个金球，自己可以另外制造3个分身。就是不知道制造另外3个分身是否有别的限制，比如融合一个宇宙之主的基因物质，自己是不是会因为其庞大的记忆，直接让自己的人格被抹杀，成为一个盗版的宇宙之主？要想制造分身，看来要融合的遗传物质必须是自己意志承受能力之下的才稳妥。
          - 然后自己猜想，是否可以融合金角巨兽的基因物质，是否可以获取金角巨兽的天赋秘法“分身”？如过成功，自己岂不是可以还有12个分身？但是想到 真灵的撕裂过成，怕是及时融合成金角巨兽分身，怕是也不能使用“分身”天赋了，自己猜想感觉“分身”天赋，本质上还是对真灵的无痛拆分。
    - 开始关注：
        - 源星文明。
        - 界主传承。
        - 地球隐藏秘密。
