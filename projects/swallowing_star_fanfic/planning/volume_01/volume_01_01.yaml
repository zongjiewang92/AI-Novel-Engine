id: volume_01
title: 地球篇：死域复生
chapter_count: 120
stage: 第一篇
goal:
  # =====================================================
  # 人物成长
  # =====================================================
  - 主角林玄完成复生，建立唯一主人格，确认梦中《吞噬星空》世界可能是真实未来。
  - 建立主角林玄完成复生后的全新人格，并围绕"我是谁"展开整篇成长主线，最终完成唯一主人格的建立。
  - 从一个已经死亡的人类重新认识自己的存在，逐渐接受过去、接受现在、接受未知未来，完成第一阶段心境成长。
  - 建立第一阶段修心体系——知、容、行，完成真正意义上的人格成长，为未来修心体系奠定基础。
  # =====================================================
  # 能力体系
  # =====================================================
  - 建立金色灵魂球体系，完整建立吞噬、解析、固化三大核心能力，并揭示其巨大副作用，为整部长篇小说埋下伏笔。
  - 展现第一次主动吞噬、第一次解析、第一次能力成长以及第一次人格污染，建立吞噬能力既是机缘也是诅咒的核心设定。
  - 从个人复生开始，经历战神级、行星级、恒星级三个阶段，逐渐建立属于林玄自己的修炼体系。
  # =====================================================
  # 地球剧情
  # =====================================================
  - 进入人类文明社会，返回京都基地市，确认身份，加入华夏军方，并重新获得科学家身份。
  - 通过梦中的《吞噬星空》与现实不断互相印证，确认未来真实存在，并建立改变未来的坚定信念。
  - 进入长期修炼阶段，在不断战斗、修炼、成长中突破行星级、恒星级，并初步掌握火属性领域与法则方向。
  - 在地球篇中，林玄不会直接改变整个宇宙格局，而是利用自己对于未来的认知，结合自身能力与获得的机缘，逐步推动地球文明的发展。
  - 建立主角作为地球新晋顶尖强者的身份，并逐步介入地球文明的发展，布局地球未来。
  - 推动地球文明统一发展方向，建立人才培养体系、科技体系、生物体系、教育体系，为未来进入宇宙时代提前布局。
  # =====================================================
  # 宇宙伏笔
  # =====================================================
  - 获得第一份界主级传承，尝试解决吞噬能力带来的记忆污染问题，并与智能生命小柒正式建立联系。
  - 引出宇宙文明、源星文明、界主传承、小柒、机械族分身、火之法则等后续长篇主线。
  - 完成主角从地球武者到正式迈入宇宙修炼体系的过渡。
  - 以宇宙飞船离开地球、准备融合机械族分身作为第一篇结尾，与第二篇无缝衔接，并正式开启宇宙篇剧情。
timeline:
  # =====================================================
  # RR病毒时代
  # =====================================================
  - time: 公元2003年
    event: SARS病毒流感爆发
    description:
      - 全球连续出现几次病毒流感，从公元2003年开始。
  - time: 公元2009年
    event: H1N1型流感爆发
    description:
      - 随后的2009年，甲型H1N1型流感爆发。
  - time: 公元2013年
    event: R型病毒流感爆发
    description:
      - 在2013年，R型病毒流感开始传播，并演化出二十多个变种。
  - time: 公元2015年1月
    event: RR病毒出现
    description:
      - RR病毒正式出现，可通过体液、水流和空气传播。
  - time: 2015年9月至2021年3月
    event: 怪兽战争时期
    description:
      - 从2015年9月开始的怪兽战争持续到2021年3月。
      - 人类大量使用超高频激光炮击杀怪兽，最终建立基地市体系。
  # =====================================================
  # 林玄复生
  # =====================================================
  - time: 2016年
    event: 林玄死亡
    description:
      - 林玄死于怪兽战争初期。
      - 兽潮导致建筑坍塌，被永久掩埋于地下废墟。
  - time: 2028年
    event: 金光降临
    description:
      - 一道跨越时间与空间的神秘金光降临地球。
      - 金光进入林玄骸骨内部。
      - 林玄开始真正意义上的生命重构。
  - time: 2028年-2038年
    event: 死域形成
    description:
      - 金色灵魂球不断重塑身体。
      - 周围生命持续被吞噬，形成死域。
      - 林玄承受长达十年的灵魂撕裂。
      - 在清醒与昏迷之间不断循环，只能依靠数数维持意识。
  - time: 2038年6月8日
    event: 林玄恢复意识
    description:
      - 林玄终于完全恢复意识。
      - 经历漫长灵魂折磨后完成第一次人格稳定。
      - 开始重新认识自己。
  - time: 2038年7月
    event: 林玄冲出地面
    description:
      - 林玄完成肉身重塑。
      - 从地下一路向上挖掘。
      - 十余年后第一次重新见到阳光。
  - time: 2038年7月至8月
    event: 首次战斗
    description:
      - 熟悉新的身体。
      - 猎杀第一头怪兽。
      - 研究吞噬、解析、固化能力。
      - 思考梦中《吞噬星空》世界的真实性。
  - time: 2038年9月
    event: 拯救武者小队
    description:
      - 在兽群中救下武者小队。
      - 初次展露战神级实力。
      - 获得基础物资。
      - 跟随武者返回京都基地市。
  - time: 2038年9月下旬
    event: 进入京都基地市
    description:
      - 与官方取得联系。
      - 身份确认。
      - 确认梦中的《吞噬星空》并非幻想。
      - 制定未来成长计划。
  # =====================================================
  # 地球成长阶段
  # =====================================================
  - time: 2039年除夕
    event: 突破行星级
    description:
      - 晋升行星级。
      - 获得烈焰身。
      - 正式踏入宇宙修炼体系。
  - time: 2039年4月
    event: 一级兽潮
    description:
      - 林玄展露真正实力。
      - 获得军方全面认可。
      - 获得飞行器等重要资源。
  - time: 2039年5月
    event: 澳洲计划
    description:
      - 前往澳洲。
      - 执行第一阶段布局。
      - 获取大量木牙晶。
  - time: 2045年
    event: 十年修行
    description:
      - 吸收大量木牙晶。
      - 达到行星级九阶巅峰。
      - 成为地球第一强者。
      - 开始正式感悟法则。
  - time: 2045年
    event: 文明布局
    description:
      - 与洪、雷神等人论道修心。
      - 建立知、容、行修心体系。
      - 世界逐渐完成统一。
      - 整合科技、教育、资源体系。
      - 消灭兽皇。
      - 建立全球人才培养体系。
      - 保留荒野区作为未来试炼场。
      - 推行汉语作为统一语言，并持续完善文字体系。
  # =====================================================
  # 宇宙传承
  # =====================================================
  - time: 2047年1月
    event: 突破恒星级
    description:
      - 成功突破恒星级。
      - 完整总结自己的修心体系。
  - time: 2047年4月
    event: 太阳修行
    description:
      - 前往太阳附近修炼。
      - 感悟火之法则。
  - time: 2047年5月
    event: 初悟法则
    description:
      - 成功感悟第一丝火之法则。
  - time: 2047年8月
    event: 界主元烈传承
    description:
      - 进入源星界主元烈留下的传承空间。
      - 接受法则考验。
      - 要求十年内悟透一种法则本质。
  - time: 2047年12月
    event: 完成界主考核
    description:
      - 三个月内悟透一种法则本质。
      - 成功通过全部考核。
      - 获得界主传承与大量遗产。
      - 小柒正式认主。
  # =====================================================
  # 地球新时代
  # =====================================================
  - time: 2048年
    event: 地球新时代
    description:
      - 回归地球。
      - 全面改造地球文明。
      - 建立太阳系开发体系。
      - 地球定位为繁育与教育中心。
      - 火星定位为工业与资源生产基地。
      - 与巴巴塔展开合作。
      - 制定洪、雷神、贾谊等人的培养计划。
      - 制定罗峰培养计划。
      - 开发九号遗迹。
      - 建立太阳系预警防御体系。
      - 获得九十二点八亿吨玄铁原材料。
  - time: 2049年
    event: 分身计划
    description:
      - 启动机械族分身计划。
      - 尝试彻底解决吞噬能力带来的记忆污染。
      - 完成进入宇宙前的最终准备。
  - time: 2054年
    event: 分身计划执行 
    description: 
    - '使用宇宙飞船10倍光速，在暗宇宙中航行。'
    - 执行融合机械组不朽的分身创造计划。

children:
  # =====================================================
  # ARC 01
  # =====================================================
  - id: arc_01_01
    title: 开局谜团
    chapter_range: 1-8
    goal:
    - 采用倒叙方式制造巨大悬念。
    - 展示未来已经成长起来的林玄，引起读者对于主角身份、实力以及未来经历的好奇。
    - 埋下宇宙飞船、未知尸体、小柒、机械族分身等核心伏笔。
    - 建立整部小说神秘、未知、探索未来的基调。
    - 引出二十年前的故事，正式进入林玄复生主线。
    key_events:
    - 林玄站在宇宙飞船前，准备进入暗宇宙。
    - 小柒陪伴林玄，两人进行轻松交流。
    - 小柒说明此次计划成功率未知，并已经准备多种失败方案。
    - 林玄表示自己已经准备五年，此次计划只能成功不能失败。
    - 林玄展现远超普通强者的心境与气质。
    - 飞船内部出现一具胸口被掏空的未知生命尸体。
    - 林玄准备利用机械族尸体解决自身吞噬能力副作用。
    - 时间回到二十年前。
    - 正式进入林玄死亡与复生剧情。
  # =====================================================
  # ARC 02
  # =====================================================
  - id: arc_01_02
    title: 死域复生
    chapter_range: 9-18
    goal:
    - 描写林玄从死亡到复活的完整过程。
    - 建立死域设定。
    - 展现金色灵魂球的神秘力量。
    - 描写灵魂撕裂带来的巨大痛苦。
    - 建立林玄坚韧、不屈、追求自我的人格基础。
    - 灵魂撕裂中好像度过了亿万年，自己的意志可能达到了不朽级，具体是不朽封侯还是不朽封王 尚未可知。
    key_events:
    - 金光穿透时间与空间降临地球地下。
    - 金光进入林玄死亡多年的骸骨。
    - 骸骨开始重新生长。
    - 金色灵魂球开始吞噬周围生命能量。
    - 植物、昆虫、动物生命逐渐死亡。
    - 地下区域形成恐怖死域。
    - 死域范围不断扩大。
    - 地表出现异常现象。
    - 军方开始关注地下异常区域。
    - 林玄意识逐渐恢复。
    - 大量陌生生命记忆进入意识。
    - 植物记忆、昆虫记忆、动物记忆不断冲击灵魂。
    - 林玄陷入无限痛苦循环。
    - 通过不断数数保持自我存在。
    - 清醒、痛苦、昏迷不断循环。
    - 十年之后，灵魂终于完成稳定。
    - 林玄第一次真正意义上苏醒。
  # =====================================================
  # ARC 03
  # =====================================================
  - id: arc_01_03
    title: 我是谁
    chapter_range: 19-30
    goal:
    - 建立整部小说核心主题：我是谁。
    - 让林玄重新认识自己的过去、现在以及未来。
    - 建立唯一主人格。
    - 引入《吞噬星空》梦境设定。
    - 完成现实世界与未来世界第一次连接。
    key_events:
    - 林玄发现自己拥有大量陌生生命记忆。
    - 通过解析发现这些记忆并非自己的经历。
    - 认识到吞噬能力会带来生命信息污染。
    - 林玄开始怀疑自己是否还是原来的自己。
    - 回忆上一世科学家林玄的一生。
    - 回忆研究病毒、生命科学的经历。
    - 回忆RR病毒研究。
    - 回忆怪兽战争时期死亡。
    - 回忆死亡前最后的实验。
    - 想起曾经梦中的《吞噬星空》世界。
    - 开始整理梦中时间线。
    - 发现罗峰、洪、雷神等人物可能真实存在。
    - 将梦境与现实时间进行比对。
    - 初步确认未来世界真实存在。
    - 接受自己已经死亡并重新存在的事实。
    - 接受新的身体、新的能力、新的未来。
    - 完成人格第一次稳定。
  # =====================================================
  # ARC 04
  # =====================================================
  - id: arc_01_04
    title: 金球初现
    chapter_range: 31-42
    goal:
    - 建立金色灵魂球完整能力体系。
    - 展示主角第一次真正意义上的力量成长。
    - 完成破茧而出的重生。
    - 开启第一次战斗。
    - 展现吞噬能力的危险副作用。
    key_events:
    - 林玄开始观察自身身体结构。
    - 发现身体已经完全超越普通人类。
    - 在意识空间发现三个暗金色光球。
    - 第一次尝试接触金色光球。
    - 发现三个光球分别拥有不同能力。
    - 建立能力体系：
        - 吞噬：吸收生命能量。
        - 解析：分析生命结构。
        - 记忆：灵魂中会获取目标的记忆，如果无限制使用能力，会让自己人格分裂。
        - 固化：保存特殊能力与信息。
    - 林玄发现自身身体已经形成特殊生命结构。
    - 外部形成暗红色生命茧。
    - 林玄完成破茧重生。
    - 第一次感受到战神级身体力量。
    - 测试力量、速度、防御。
    - 发现自身达到战神级实力。
    - 使用蚕茧摸波制作简单衣物。
    - 离开地下死域。
    - 遭遇第一头怪兽。
    - 击杀铁毛野猪。
    - 第一次主动发动吞噬。
    - 获得怪兽生命信息。
    - 大量兽类记忆冲击人格。
    - 林玄险些迷失自我。
    - 意识到吞噬能力最大危险不是力量，而是记忆污染。
    - 开始寻找解决方法。
  # =====================================================
  # ARC 05
  # =====================================================
  - id: arc_01_05
    title: 战神归来
    chapter_range: 43-55
    goal:
    - 林玄正式离开地下死域，进入人类文明世界。
    - 熟悉战神级身体力量。
    - 深入研究金色灵魂球能力。
    - 建立吞噬能力限制机制。
    - 第一次接触现代武者体系。
    - 返回京都基地市，重新进入人类社会。
    key_events:
    - 林玄开始适应新的身体。
    - 测试力量、速度、精神念力。
    - 确认自身达到战神级实力。
    - 研究吞噬能力：
        - 普通生命能量可以提升身体。
        - 生命记忆会污染自身意识。
        - 高等级生命拥有更强的信息冲击。
    - 林玄制定吞噬规则。
    - 尽量避免直接吞噬智慧生命。
    - 开始研究如何分离生命信息与力量。
    - 林玄进入荒野区域。
    - 猎杀怪兽提升战斗经验。
    - 通过战斗熟悉身体能力。
    - 发现自己拥有远超普通战神的身体素质。
    - 林玄发现现代人类文明已经完全改变。
    - 确认当前时间为2038年。
    - 结合时间线推算：
        - RR病毒已经爆发。
        - 怪兽战争已经结束。
        - 罗峰已经出生。
        - 地球未来正在按照梦境发展。
    - 林玄确认：
        - 《吞噬星空》并非普通梦境。
        - 自己拥有改变未来的机会。
    - 林玄在兽群中救下武者小队。
    - 展现战神级实力。
    - 获得武者认可。
    - 获取基础物资。
    - 跟随武者小队返回京都基地市。
  # =====================================================
  # ARC 06
  # =====================================================
  - id: arc_01_06
    title: 重返文明
    chapter_range: 56-68
    goal:
    - 林玄重新进入人类文明。
    - 完成身份确认。
    - 与华夏高层建立联系。
    - 加入军方体系。
    - 开始利用未来信息布局地球发展。
    key_events:
    - 林玄进入京都基地市。
    - 与基地市管理人员接触。
    - 通过DNA检测确认身份。
    - 华夏高层震动。
    - 调查发现：
        - 林玄身份真实存在。
        - 二十年前死亡记录存在。
        - 死亡地点与当前死域区域一致。
    - 贾谊、朱喜等高层与林玄见面。
    - 林玄解释：
        - 自己进入位置区域，然后意识沉睡。
        - 近期才恢复。
    - 对于复生原因保持隐藏。
    - 林玄重新获得社会身份。
    - 恢复科学家身份。
    - 加入华夏军方。
    - 开始研究：
        - RR病毒。
        - 怪兽基因。
        - 人类进化方向。
    - 林玄建立未来规划：
        第一阶段：
        - 提升自身实力。
        第二阶段：
        - 推动地球文明发展。
        第三阶段：
        - 为宇宙时代准备人才。
  # =====================================================
  # ARC 07
  # =====================================================
  - id: arc_01_07
    title: 未来验证
    chapter_range: 69-80
    goal:
    - 完成梦境真实性验证。
    - 建立未来成长路线。
    - 开始正式修炼。
