id: volume_01
title: 地球篇：死域复生
chapter_count: 120
stage: 第一篇

goal:
- 建立主角林玄完成复生后的全新人格，并围绕“我是谁”展开整篇成长主线，建立唯一主人格，确认梦中《吞噬星空》世界可能是真实未来。
- 建立金色灵魂球体系、吞噬、解析、固化三大能力及其巨大副作用，为后续所有剧情埋下伏笔。第一次战斗。副作用方面从一个死亡的人类重新认识自己的存在，通过接受过去、接受现在、接受未知未来， 完成第一阶段心境成长。
- 进入人类文明社会，进入京都基地市。确认自己身份，加入军方。通过《吞噬星空》梦境记忆与现实互相印证，确认未来真实存在，并建立主角改变未来的信念。
- 进入一段修炼期，战斗，修炼，成长，突破行星级，建立主角第一阶段修心体系——知、容、行，完成真正意义上的人格成长。
- 建立主角作为地球新晋顶尖强者的身份，并逐步介入地球文明的发展，布局地球未来： 统一人类文明方向； 建立培养体系； 推动科技、生物、教育发展； 培养未来宇宙时代人才； 为地球进入宇宙文明做准备。。
- 引出宇宙文明、源星文明、界主传承、小柒、机械族分身等后续长篇主线。
- 完成主角从地球武者到正式迈入宇宙修炼体系的过渡。
- 以宇宙飞船离开地球、准备融合机械族分身作为第一篇结尾，与第二篇无缝衔接，尝试解决自身吞噬能力带来的记忆污染问题，。

