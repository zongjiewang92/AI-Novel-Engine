# =====================================================
# ARC 01
# =====================================================

- id: arc_01_01
  title: 开局谜团
  chapter_range: 1-8

  goal:
  - 采用倒叙方式制造巨大悬念。
  - 展示未来已经成长起来的林玄，引起读者好奇。
  - 埋下神秘尸体、未知敌人、小柒等核心伏笔。
  - 引出二十年前的故事。
  - 建立整部小说的神秘基调。

  key_events:
  - 林玄站在宇宙飞船前，准备进入暗宇宙。
  - 小柒陪伴在身边，两人进行轻松却暗藏深意的对话。
  - 林玄表现出远超普通强者的沉稳与自信。
  - 飞船内部出现一具胸口被掏空的未知生命尸体。
  - 小柒称此次计划成功率未知。已经做好所有退路准备，即使失败也不会影响地球。
  - 林玄表示已经准备了五年，只许成功不许失败。
  - 画面切换至二十年前，正式进入回忆。

