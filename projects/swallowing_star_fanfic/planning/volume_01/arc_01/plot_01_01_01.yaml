  - 因暗宇宙的无限黑暗产生压迫感。
  - 因林玄的平静产生强者气场。
  - 因金色光球产生强烈好奇。
  - 因机械族不朽尸体产生危险感。
  - 因火神源晶产生恐怖感。
  - 因五年航行产生历史厚重感。
  - 因小柒的出现产生亲切感。
  - 因林玄与小柒的默契产生人物关系兴趣。
  - 因林玄承认自己害怕失败而产生真实感。
