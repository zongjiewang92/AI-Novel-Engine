id: plot_01_01_01
title: 金光降临
goal:
- 描述林玄死亡后的世界。 在意识消散之后，地球地下深处， 一道未知金光跨越无法理解的空间距离降临。 金光进入一具沉睡多年的枯骨。 在无人知晓的黑暗地下， 一场超越人类文明理解范围的生命重构开始。 本章建立： 林玄死亡事实。 神秘金光悬念。 未知力量降临。 为后续十年吞噬、生命重塑、金色光球诞生埋下伏笔。
theme:
- 死亡
- 新生
- 神秘
- 未知
- 命运
purpose:
- 展示林玄死亡瞬间
- 建立前世终点
- 制造生命消失后的孤独感
- 引出金光复生事件
- 建立金色力量来源悬念
- 埋下四滴血液伏笔
- 埋下浑源力量伏笔
opening_hook:
- 黑暗。
- 无尽的黑暗。
- 没有声音。
- 没有光。
- 没有时间。
- 林玄最后的意识，
- 停留在建筑坍塌的那一瞬间。
- 巨大的轰鸣。
- 扭曲的钢筋。
- 飞溅的鲜血。
- 还有自己最后一个念头：
- "实验数据……不能毁掉……"
- 下一刻。
- 世界归于虚无。
protagonist_state:
  physical_state:
  - 身体死亡
  - 被建筑掩埋
  - 生命活动完全消失
  mental_state:
  - 意识消散
  - 灵魂进入沉寂
  - 无法感知外界
key_scene:
- 林玄死亡。
- 不是昏迷。
- 不是假死。
- 而是真正意义上的生命终结。
climax:
- 无尽黑暗中。
- 时间失去了意义。
- 突然。
- 一道无法描述的金色光芒出现。
- 它不是光。
- 或者说，
- 人类对于光的理解无法定义它。
- 它穿透星球外层空间。
- 穿透大气。
- 穿透岩石。
- 穿透数千米地下。
- 仿佛早已锁定目标。
- 降临在那具已经死亡多年的枯骨之上。
knowledge_unlock:
- 林玄已经死亡
- 林玄前世生命结束
- 地球地下存在未知力量
ability_unlock: []
emotion_curve:
- 平静
- 绝望
- 孤寂
- 黑暗
- 神秘
- 震撼
reader_question:
- 林玄真的死了吗？
- 死亡之后为什么还有后续？
- 金光来自哪里？
- 为什么选择林玄？
- 这是不是某个更高文明的实验？
- 这个力量是否来自宇宙？
foreshadow:
- 四滴金色血液
- 三颗暗金光球
- 第四颗金色光球
- 浑源力量
- 阿柒
- 罗峰未来
- 时间线变化
reader_emotion:
- 好奇
- 震撼
- 不安
- 期待

children:
# =====================================================
# Scene 01
# 宇宙飞船上的回忆
# =====================================================
- id: scene_01
  title: 二十年前的回忆
  goal:
  - 通过未来时间线开篇。 展示已经踏入宇宙的林玄。 引出回忆结构。
  - 让读者知道： 林玄未来已经成长到能够进入宇宙。 但不知道他经历了什么。
  location:
  - 宇宙飞船内部
  - 太阳系边缘
  - 即将进入暗宇宙
  characters:
  - 林玄
  - 小柒
  - 未知生命尸体
  events:
  - 林玄站在透明舷窗前。 望着外面的浩瀚星空。
  - 飞船开始准备进入光速。
  - 即将第一次进入暗宇宙。
  - 地球人类第一次真正踏入宇宙时代。
  atmosphere:
  - 宇宙浩瀚
  - 激动
  - 向往
  - 平静
  - 回忆
  key_scene:
  - 无数星辰映照在玻璃之外。 曾经的他。 只是一个死亡的人。 一个躺在地下的枯骨。 可如今。 他即将离开孕育自己的星球。 前往真正的宇宙。
  dialogue:
  - 小柒： "林玄，准备好了吗？"
  - 林玄： "准备好了。"
  emotional_focus:
  - 成就感
  - 感慨
  - 对过去的回望
  mystery:
  - 林玄经历了什么？
  - 小柒为什么一直陪伴他？
  - 地球发生了什么变化？
  - 他为什么会获得进入宇宙的资格？
  ending:
  - 林玄缓缓闭上眼睛。
  - 场景目光看向躺在地上的未知生命的尸体，尸体胸部有一个大洞，像是被人瞬间掏出了心脏。
  - 思绪回到二十年前。
  - 那一天。
  - 他还是一个已经死亡的人。
  - "那一年，我以为我的人生已经结束。"
  - "却没有想到。"
  - "真正的人生，才刚刚开始。"
# =====================================================
# Scene 02
# 林玄死亡
# =====================================================
- id: scene_02
  title: 死亡终点
  goal:
  - 展示林玄死亡。
  - 让读者明确：
  - 这不是普通穿越。
  - 主角经历了一次真正死亡。
  location:
  - 2020年
  - 城市废墟
  - 坍塌建筑内部
  events:
  - 林玄正在进行研究所转移。
  - RR病毒研究资料被紧急保护。
  - 怪兽袭击城市。
  - 部队进行撤离。
  - 建筑受到冲击。
  key_moment:
  - 林玄拖着残疾的左腿。
  - 抱着最后的实验资料。
  - 选择返回实验室。
  - 因为里面还有几十年的研究成果。
  emotional_focus:
  - 科学家的执着
  - 孤独的一生
  - 对生命的不甘
  ending:
  - 巨大的建筑倒塌。
  - 黑暗吞噬一切。
  - 林玄最后听见的声音：
  - 是钢铁断裂的声音。
# =====================================================
# Scene 03
# 地下万年孤寂
# =====================================================
- id: scene_03
  title: 地下枯骨
  goal:
  - 展现时间流逝。
  - 描述林玄死亡后的地下世界。
  - 建立岁月感。
  location:
  - 地球地下深处
  events:
  - 建筑废墟被时间掩埋
  - 地层不断变化
  - 岩石覆盖尸体
  - 人类文明变化
  atmosphere:
  - 春夏秋冬
  - 日月轮转
  - 地表文明不断变化
  - 地下深处只有一具枯骨
  key_description:
  - 白骨失去血肉
  - DNA逐渐损毁
  - 生命信息几乎消散
  mystery:
  - 按照宇宙生命规律。 这个生命早已应该彻底消失。
  - 但是…… 一丝无法解释的信息。 仍然残留。
# =====================================================
# Scene 04
# 金光降临
# =====================================================
- id: scene_04
  title: 来自未知的力量
  goal:
  - 第一次展示超越地球文明理解的力量。
  events:
  - 金色光芒出现
  - 穿越宇宙空间
  - 进入太阳系
  - 接近地球
  - 穿透岩层
  description_focus:
  - 金光没有速度概念。
  - 因为速度无法描述它。
  mystery:
  - 它来自哪里？
  - 它是否有意识？
  - 它是否一直寻找林玄？
  key_scene:
  - 如果有人能够看到这一幕。 会发现： 整个宇宙。 仿佛只是它经过的一条道路。
# =====================================================
# Scene 05
# 金光进入枯骨
# =====================================================
- id: scene_05
  title: 死亡中的生命波动
  goal:
  - 描述复生开始。 不解释原因。 保持神秘。
  events:
  - 金光接触枯骨
  - 骨骼产生变化
  - 微弱生命信息恢复
  - 细胞结构开始重建
  ability_hint:
  - 金光开始解析枯骨
  - 解析生命结构
  - 解析遗传信息
  - 解析死亡原因
  mystery:
  - 它不是治疗
  - 而是在重新创造
  key_scene:
  - 死亡多年的人类骨骼。
  - 第一次产生生命波动。
# =====================================================
# Scene 06
# 第一颗金色光球形成
# =====================================================
- id: scene_06
  title: 金色核心
  goal:
  - 埋下金色光球设定
  - 不解释全部功能
  - 只展示存在
  events:
  - 金光内部结构变化
  - 第一颗核心形成
  - 核心进入意识空间
  - 林玄灵魂开始受到影响
  description:
  - 那是一颗暗金色光球
  - 不大
  - 却仿佛包含无尽信息
  - 它缓慢旋转
  - 每一次旋转都像解析未知规则
  hidden:
  - 第四颗光球隐藏
  - 吞噬能力隐藏
  - 解析能力隐藏
  - 融合能力隐藏
  - 固化能力隐藏
  ending_hook:
  - 黑暗地下。
  - 一具死亡多年的枯骨。
  - 开始重新拥有生命。
  - 而此刻。
  - 没有人知道。
  - 一个已经死去的人类。
  - 正在成为一个新的存在。
