  foreshadow:
  - 金色光球不断吞噬附近微弱能量。
  - 金色光球偶尔出现林玄无法解释的异常波动。
  - 林玄对金色光球的态度既熟悉又谨慎。
  - 机械族不朽尸体胸口存在异常伤口。
  - 尸体虽然死亡漫长岁月，却没有出现普通尸体腐败现象。
  - 尸体的生命层次远超普通人类。
  - 火神源晶被最高等级能量封锁装置保存。
  - 林玄明确要求小柒绝不能让任何人接近火神源晶。
  - 飞船内部存在多个最高等级封锁区域。
  - 生命实验区域只有林玄本人拥有最高权限。
  - 五年前开始的计划拥有至少七套失败预案。
  - 小柒对其中部分预案表现出明显不愿提及的态度。
  - 林玄偶尔会检测自己的身体与灵魂。
  - 检测结果存在某个没有向任何人解释的异常。
  - 林玄曾经说过一句意味不明的话：
    "我已经死过一次了。"
  - 小柒听到这句话后没有反驳。
  - 林玄选择奇洛星并不是偶然。
  - 目的地附近存在虚拟宇宙界主级强者这一事实意味着林玄已经提前考虑了计划失控的可能。
  - 五年航行本身就是一种巨大的倒计时。
  - 真正的实验并没有在五年航行期间开始。
  - 五年只是为了等待林玄认为最合适的时间。
  - 这一计划与生命、灵魂、分身、记忆存在联系。
  - 林玄真正想改变的可能不是实力，而是自己的生命本质。

