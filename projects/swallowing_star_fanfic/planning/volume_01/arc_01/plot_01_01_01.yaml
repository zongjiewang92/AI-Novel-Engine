# =====================================================
# Plot 01
# 未来强者
# Chapter 001
# =====================================================

- id: plot_01_01_01
  title: 未来强者
  chapter_range: 1-2

  goal:
  - 以林玄已经成长为未来强者的状态作为全书真正开场。
  - 不从地球开始，不解释林玄如何变强，而是直接让读者面对一个已经拥有宇宙飞船、拥有智能生命、拥有强大资源与恐怖实验设备的林玄。
  - 建立未来宇宙时代的宏大背景。
  - 明确当前时间已经是二十年后的未来。
  - 明确林玄已经离开银河系，正在前往半人马星系。
  - 建立暗宇宙长期航行的枯燥、黑暗、孤独与压迫感。
  - 通过五年航行让读者意识到，这不是一次普通的宇宙旅行，而是一项准备了整整五年的巨大计划。
  - 通过飞船内部的三个核心物件制造强烈悬念：金色光球、机械族不朽尸体、火神源晶。
  - 正式引入小柒智能子体，并通过她与林玄的对话建立两人之间长期形成的默契。
  - 不解释金色光球真正的来历。
  - 不解释机械族不朽尸体真正的用途。
  - 不解释火神源晶为什么会被带上飞船。
  - 不解释林玄五年来究竟准备了什么。
  - 不解释林玄为什么必须前往奇洛星。
  - 让读者产生一个最核心的问题：一个已经如此强大的林玄，究竟准备了什么事情，为什么还需要如此谨慎？
  - 在章节结尾让小柒报告即将脱离暗宇宙，使故事从漫长的暗宇宙航行进入真正的目的地。
  - 为 Plot 02“五年计划”建立直接衔接。

  theme:
  - 未来强者。
  - 宇宙深处。
  - 暗宇宙航行。
  - 漫长等待。
  - 孤独。
  - 未知。
  - 强者的敬畏。
  - 科学家对生命本质的执着。
  - 生命与死亡。
  - 过去与未来。
  - 一个曾经死亡的人继续向未知前进。
  - 五年准备。
  - 最后的计划。
  - 强大之后依然存在无法解决的问题。

  purpose:
  - 用宏大的宇宙场景抓住读者。
  - 用林玄的平静制造强者气场。
  - 用飞船内部的神秘物品制造剧情悬念。
  - 用五年航行制造时间跨度与历史厚重感。
  - 让读者意识到故事真正开始的时候，林玄的人生已经走到了一个极其遥远的位置。
  - 让读者主动产生“二十年前到底发生了什么”的好奇。
  - 让读者主动产生“林玄到底经历了什么才变成现在这个样子”的好奇。
  - 让读者主动产生“金色光球到底是什么”的好奇。
  - 让读者主动产生“棺椁里的尸体到底是谁”的好奇。
  - 让读者主动产生“火神源晶为什么会在这里”的好奇。
  - 让小柒成为章节中的情绪缓冲点，避免整章只有压抑和宏大。
  - 用林玄与小柒的对话表现两人已经共同经历了漫长岁月。
  - 让读者感受到林玄并不是无敌，而是一个知道自己可能失败，因此提前准备了五年的强者。
  - 让“五年”成为整个未来线第一个核心谜团。
  - 让章节最后的减速与脱离暗宇宙成为一个小高潮。
  - 为下一章真正进入半人马星系、接近奇洛星做好准备。

  opening_hook:
  - 开篇直接进入一片没有尽头的黑暗。
  - 黑暗不是普通宇宙夜空，而是暗宇宙本身。
  - 这里没有熟悉的星辰，没有银河，没有太阳，没有地球。
  - 一艘银灰色宇宙飞船孤独地穿行在暗宇宙深处。
  - 飞船在暗宇宙中以20倍光速高速航行。
  - 船体周围的空间呈现出难以用普通人类视觉理解的变化。
  - 飞船已经在这样的黑暗中飞行了整整五年。
  - 飞船控制大厅内没有喧闹，只有设备运行的低沉声音。
  - 一个男人站在巨大的透明观景窗前。
  - 男人手中悬浮着一颗拳头大小的金色光球。
  - 金色光球忽明忽暗。
  - 光芒并不是简单地闪烁，而像是在呼吸。
  - 偶尔有附近的能量被它无声吞噬。
  - 观景窗之外是永远看不到尽头的黑暗。
  - 镜头缓缓后移。
  - 巨大的大厅深处，一具尸体静静躺在黑色棺椁之中。
  - 尸体胸口存在一个恐怖的贯穿伤口。
  - 仿佛曾经有人直接从他的胸膛中掏走了最重要的东西。
  - 尸体已经不知道死亡了多少岁月，却依旧没有腐烂。
  - 更远处，一个透明金属方盒安静悬浮。
  - 方盒内部封存着一枚半米左右的菱形火红色晶体。
  - 晶体内部仿佛存在一片燃烧的宇宙。
  - 仅仅是靠近它，空间都隐约出现扭曲。
  - 林玄看着远方，轻声说道：
    "五年了。"
  - "终于快到了。"

  protagonist_state:

    physical_state:
    - 林玄已经完成普通生命向强大武者的生命层次跃迁。
    - 肉身强度远超二十年前的自己。
    - 身体没有明显外伤。
    - 生命状态稳定。
    - 精神念力强大。
    - 能够通过精神念力感知飞船内部大量设备状态。
    - 能够感知金色光球的细微变化。
    - 能够在高速暗宇宙航行环境中保持稳定。
    - 已经习惯宇宙级别的危险。
    - 但身体与灵魂深处仍存在一个尚未真正解决的问题。
    - 这个问题是五年计划最核心的原因之一。
    - 林玄没有把这个问题告诉所有随行人员。
    - 甚至绝大部分人员都不知道真正实验内容。
    - 林玄自身也无法完全确定最终结果。

    mental_state:
    - 平静。
    - 克制。
    - 沉稳。
    - 孤独。
    - 对未知依旧保持敬畏。
    - 已经经历了漫长岁月与无数危险。
    - 不再因为宇宙的宏大而轻易震撼。
    - 但面对真正未知的生命问题时仍然保持谨慎。
    - 对五年前开始的计划存在极强执念。
    - 对失败存在真实的恐惧。
    - 他不是不害怕，而是已经习惯带着恐惧继续向前。
    - 对地球依旧存在深厚感情。
    - 对过去的人生存在复杂情绪。
    - 不愿意主动回忆二十年前发生的事情。
    - 内心深处依旧保留着曾经作为科学家的探索欲。
    - 他真正想解决的并不是单纯的实力问题。
    - 他想知道生命究竟能不能真正改变。
    - 他想知道自己究竟还能不能拥有另一种可能。
    - 这一计划成功，他的人生将发生巨大改变。让自己真正拥有成为顶尖强者的资本，拥有与未来“罗峰”一争高下的基本盘。
    - 这一计划失败，他可能失去现在拥有的一切。让现在的一切回归到那个小说描述的主线，一切就只能依靠“罗峰”了。

  key_scene:
  - 林玄站在观景窗前，手中托着金色光球。
  - 金色光球在他手中缓慢旋转。
  - 飞船以20倍光速穿越暗宇宙。
  - 巨大棺椁位于大厅中央。
  - 棺椁中的机械族不朽尸体没有任何生命气息。
  - 透明金属方盒中封存着恐怖的火神源晶。
  - 小柒智能子体负责整艘飞船的航行与监控。
  - 林玄已经在这艘飞船上独自度过漫长岁月。
  - 这是五年计划真正开始之前最后的十天。
  - 林玄确认目的地为半人马星系奇洛星附近。
  - 奇洛星附近存在虚拟宇宙系统覆盖。
  - 如果计划出现无法控制的意外，可以借助虚拟宇宙公司的力量降低损失。只要虚拟宇宙公司的强者出手，应该会降低计划造成的影响。
  - 林玄第一次明确告诉读者：
    "我已经准备了五年。"
  - 但他没有告诉读者究竟准备了什么。

  climax:
  - 小柒突然报告距离目的地已经进入最后阶段。
  - 飞船已经跨越超过十万光年级别的原始宇宙距离。
  - 林玄确认飞船能源、核心设备、机械族不朽尸体、金色光球与火神源晶全部正常。
  - 小柒开始进行最终航行倒计时。
  - 林玄最后一次检查最高权限区域。
  - 生命实验区域全部锁死。
  - 所有实验数据完成最高等级加密。
  - 林玄要求小柒删除所有没有必要的航行记录。
  - 小柒第一次表现出真正意义上的担忧。
  - 她问林玄：
    "如果这一次真的失败呢？"
  - 林玄沉默很久。
  - 最终回答：
    "那就说明，我还没有资格得到答案。"
  - 小柒没有继续追问。
  - 十天后，飞船开始进入减速程序。
  - 暗宇宙航行速度从20倍光速逐渐下降。
  - 船体周围空间开始发生剧烈变化。
  - 小柒正式发出警告：
    "准备脱离暗宇宙。"
  - "三十秒后，进入原始宇宙。"
  - 林玄抬头看向前方。
  - 他已经等待这一刻五年。
  - 五年的漫长黑暗即将结束。
  - 但真正危险的事情，才刚刚开始。

  knowledge_unlock:
  - 暗宇宙与原始宇宙属于不同的航行空间。
  - 暗宇宙航行可以大幅缩短跨越宇宙距离所需要的时间。
  - 暗宇宙与原始宇宙之间存在固定的距离换算关系。
  - 暗宇宙航行距离与原始宇宙实际距离的比例约为1:1008.6。
  - 暗宇宙中航行1光年，对应原始宇宙约1008.6光年的实际距离。
  - 林玄所在飞船当前以20倍光速在暗宇宙中航行。
  - 林玄已经连续航行约五年。
  - 五年时间对应暗宇宙约100光年的航行距离。
  - 对应原始宇宙约100860光年的实际距离。
  - 林玄当前距离地球已经达到十万光年左右。
  - 当前航线已经离开银河系，正在前往半人马星系。
  - 目的地附近存在奇洛星。
  - 奇洛星附近存在虚拟宇宙公司的D级驻点，应该存在界主级强者甚至不朽级强者。
  - 林玄特意选择这个区域作为计划地点。
  - 因为如果计划失控，可以借助虚拟宇宙公司体系的强者降低损失，只要驻点强者感应到大的波动，就会上报高层，应该会引来不朽封侯强者，这个实力应该足以控制现场。
  - 机械族不朽尸体被林玄作为重要实验材料带在飞船上。
  - 火神源晶拥有极其恐怖的爆发力量。
  - 火神源晶一旦爆炸，释放出的能量足以灭杀封侯级不朽。
  - 金色光球依旧是林玄最重要也最神秘的核心物品之一。
  - 小柒已经拥有智能生命级别的思维与人格表现。
  - 当前小柒出现在这艘飞船上的只是智能生命子体。
  - 真正的小柒并不在这艘空无一人的C级飞船上。
  - 这艘飞船真正执行的是林玄个人计划。
  - 另一艘飞船承担着地球文明正式进入宇宙的任务，林玄的本尊，以及小柒本体都在这个飞船上。
  - 两艘飞船同时出发，但执行的是完全不同的计划。

  ability_unlock:
  - 林玄能够控制C级宇宙飞船。
  - 林玄能够在暗宇宙中长期航行。
  - 林玄拥有强大的精神念力。
  - 林玄能够感知飞船内部能量变化。
  - 林玄能够控制金色光球。
  - 林玄能够判断高级生命材料的状态。
  - 小柒智能子体能够全面控制飞船。
  - 小柒能够实时计算暗宇宙航行数据。
  - 小柒能够分析飞船能源与结构状态。
  - 小柒拥有高级权限管理能力。
  - 小柒能够管理最高等级实验区域。
  - 小柒能够执行多重失败预案。
  - 林玄已经具备在宇宙深处独立执行高危险计划的能力。

  emotion_curve:
  - 黑暗：读者进入陌生而无边无际的暗宇宙。
  - 震撼：看到一艘能够以20倍光速航行的宇宙飞船。
  - 神秘：看到林玄手中的金色光球。
  - 压迫：看到棺椁中的机械族不朽尸体。
  - 恐惧：意识到火神源晶可能拥有毁灭封侯不朽的力量。
  - 孤独：感受到林玄已经在暗宇宙中独自飞行五年。
  - 温暖：小柒出现并与林玄进行自然交流。
  - 好奇：小柒明显不是普通人工智能。
  - 紧张：五年计划即将真正开始。
  - 悬念：林玄始终不愿说明计划内容。
  - 敬畏：林玄承认自己依旧害怕失败。
  - 爆发前夕：飞船即将脱离暗宇宙。
  - 期待：真正的目的地即将出现。
  - 不安：读者意识到五年的准备只是为了接下来的一次赌博。

