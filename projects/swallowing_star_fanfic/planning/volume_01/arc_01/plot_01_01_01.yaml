  - 因飞船即将脱离暗宇宙产生期待。
  - 最终形成强烈追读欲：
    "我必须知道五年前到底发生了什么。"

  children:

  # =====================================================
  # Scene 01
  # 地球启程
  # =====================================================
  - id: scene_01
    title: 地球启程

    goal:
    - 在正式进入未来宇宙之前，先回到地球，展示二十年后的地球文明已经发生的巨大变化。
    - 展示人类文明第一次正式准备接触宇宙文明的历史性时刻。
    - 建立第二艘C级宇宙飞船，以及随船近百人的地球智囊团。
    - 通过洪、雷神、贾谊与林玄的对话，建立地球最高层对这次宇宙行动的重视。
    - 强化林玄在地球文明中的核心地位。
    - 让读者知道，林玄并不是孤身一人走向宇宙，地球已经开始拥有真正意义上的宇宙行动能力。
    - 为后续“林玄真正的五年计划”制造信息差。
    - 让读者暂时认为这次前往宇宙的主要任务是接触宇宙文明、办理身份、建立商业合作。
    - 在读者尚未意识到的情况下，暗示林玄实际上还有另一艘飞船，以及另一项完全不同的计划。
    - 让这一场成为地球篇与宇宙篇之间的重要情感分界线。

    location:
    - 地球。
    - 人类联邦大型宇宙港。
    - 地球近地轨道范围内的超大型宇宙飞船停泊港。
    - C级宇宙飞船停泊区。
    - 巨型宇宙港内部拥有大量宇宙运输设施、能源设施和人员通道。
    - 停泊港周围存在大量来自地球各国、各大组织以及科研机构的工作人员。
    - 巨大的C级宇宙飞船停靠在最中央的高级宇宙舰船区域。

    characters:
    - 林玄。
    - 洪。
    - 雷神。
    - 贾谊。
    - 陈浩。
    - 地球智囊团成员。
    - 科研人员。
    - 工程人员。
    - 武者。
    - 后勤人员。
    - 安保人员。

    events:
    - 清晨，巨大的地球宇宙港已经进入最高等级运行状态。
    - 一艘巨大的C级宇宙飞船静静停泊在专用泊位上。
    - 飞船整体呈银灰色，舰体表面拥有复杂的能量回路与防御装置。
    - 飞船体积远远超过过去地球上的任何航空器。
    - 大量运输设备正在向飞船内部输送物资。
    - 各类科研设备、生命维持设备、能源模块以及宇宙环境适应装备正在进行最后检查。
    - 近百名经过严格筛选的人员已经完成登船。
    - 这些人员来自地球各个领域。
    - 有科研人员。
    - 有工程人员。
    - 有商业与经济方面的专家。
    - 有语言与文明研究人员。
    - 有宇宙环境研究人员。
    - 有武者。
    - 有负责安全与情报工作的人员。
    - 有负责与宇宙文明进行外交接触的人员。
    - 所有人都清楚，他们即将执行的是人类历史上从未完成过的任务。
    - 这是地球人类第一次真正意义上主动走出银河系范围，主动接触宇宙文明。
    - 巨大的停泊港内虽然人员众多，却没有往日的喧闹。
    - 所有人都在等待最后一道命令。
    - 飞船舱门前，陈浩穿着正式作战服，正在进行最后一次人员确认。
    - 陈浩确认所有人员已经登船。
    - 陈浩通过通讯系统向林玄汇报。
    - 林玄、洪、雷神、贾谊站在停泊区的观景平台上。
    - 四人共同看着远处的C级宇宙飞船。
    - 这艘飞船代表着地球人类第一次真正走向宇宙文明。
    - 陈浩来到四人面前。
    - 他立正行礼。
    - 陈浩向林玄汇报人员、物资、能源以及设备全部准备完成。
    - 林玄询问是否还有人员没有登船。
    - 陈浩回答全部完成。
    - 林玄询问备用物资是否已经确认。
    - 陈浩回答所有备用方案已经准备完成。
    - 林玄最后确认通讯系统以及紧急撤离系统。
    - 陈浩回答全部正常。
    - 林玄点头。
    - 洪站在一旁看着那艘巨大的C级宇宙飞船。
    - 洪的眼神中既有期待，也有明显的担忧。
    - 雷神同样没有平日里的轻松。
    - 贾谊则在思考这次行动对地球未来的影响。
    - 三人都清楚，这一次不是普通的宇宙旅行。
    - 一旦成功，人类文明将真正跨入宇宙文明时代。
    - 一旦失败，地球可能会第一次真正意识到宇宙文明之间的巨大差距。
    - 洪率先向林玄表达担忧。
    - 他提醒林玄，宇宙远比地球危险。
    - 即使他们已经掌握了大量来自宇宙的资料，但真正进入宇宙之后，任何资料都只能作为参考。
    - 雷神则提醒林玄不要因为已经掌握的力量而低估宇宙中的强者。
    - 贾谊则从文明角度提醒林玄，这一次行动必须谨慎。
    - 他们不是单纯去探索宇宙。
    - 他们代表的是整个人类文明。
    - 一旦处理不当，甚至可能给地球带来无法承受的灾难。
    - 林玄听完三人的话，没有立即回答。
    - 他抬头看向远处的宇宙飞船。
    - 那艘飞船承载着近百名地球人。
    - 他们即将第一次真正走向宇宙。
    - 林玄的目光平静。
    - 但在那双眼睛最深处，却隐藏着只有他自己知道的复杂情绪。
    - 因为真正的林玄很清楚。
    - 这艘飞船并不是他真正需要担心的事情。
    - 真正危险的计划，已经开始了五年。
    - 甚至在这艘飞船启程之前，另一艘飞船早已经离开了地球。
    - 那艘飞船上没有任何地球人员。
    - 没有外交团队。
    - 没有商业专家。
    - 没有智囊团。
    - 只有一具机械族不朽尸体、金色光球、小柒智能子体，以及一艘真正承载着林玄秘密计划的宇宙飞船。
    - 但这些事情，林玄没有告诉洪、雷神和贾谊。
    - 至少现在还不能说。
    - 洪最后拍了拍林玄的肩膀。
    - 他没有再说什么。
    - 因为他们都知道，林玄已经做出了决定。
    - 雷神笑着提醒林玄，如果在宇宙里遇到什么好东西，记得给地球留一点。
    - 林玄难得露出一丝笑意。
    - 贾谊则郑重提醒林玄，无论走到什么地方，都不要忘记地球。
    - 林玄看向三人。
    - 他告诉他们，真正应该保护好的是地球。
    - 他离开地球，是为了让人类拥有更大的未来。
    - 但地球不能因为他的离开而失去防线。
    - 洪、雷神和贾谊都明白了林玄的意思。
    - 他们没有继续劝阻。
    - 因为从这一刻开始，林玄已经不再只是属于他自己。
    - 他身后站着整个地球文明。
    - 远处，C级宇宙飞船开始启动。
    - 巨大的能量反应从舰体内部传来。
    - 停泊港开始进入发射程序。
    - 陈浩最后向林玄行礼。
    - “报告长官，一切人员物资准备就绪，已经完成登船，静待出发。”
    - 林玄点头。
    - “出发吧。”
    - 陈浩转身离去。
    - 巨大的舱门缓缓关闭。
    - 飞船开始脱离停泊平台。
    - 洪、雷神、贾谊三人站在原地。
    - 他们看着飞船逐渐升空。
    - 雷神忽然说道，这一次之后，人类可能真的不一样了。
    - 洪没有回答。
    - 他的目光一直停留在飞船上。
    - 林玄则转身离开。
    - 他没有回头。
    - 因为属于地球的这艘飞船已经按照计划开始执行任务。
    - 而属于他自己的真正旅程，也已经开始了。

    atmosphere:
    - 庄严。
    - 历史感。
    - 临别感。
    - 科技感。
    - 压抑。
    - 期待。
    - 人类文明迈入新时代的宏大感。
    - 强者之间克制而深沉的情感。
    - 暴风雨来临前的平静。

    key_scene:
    - 巨大的C级宇宙飞船停靠在地球最高等级宇宙港。
    - 近百名地球智囊团成员已经全部登船。
    - 陈浩向林玄进行最后一次任务汇报。
    - 洪、雷神、贾谊与林玄进行临别交谈。
    - 洪表达对宇宙未知危险的担忧。
    - 雷神提醒林玄不要轻视宇宙中的强者。
    - 贾谊提醒林玄，这一次行动代表整个地球文明。
    - 林玄告诉三人，让他们放心。
    - 林玄提醒洪、雷神、贾谊，无论自己在宇宙中做什么，他们必须保护好地球。
    - 三人郑重答应。
    - C级宇宙飞船启动。
    - 飞船缓缓升空。
    - 林玄看着飞船消失在地球上空。
    - 这一幕成为地球文明真正走向宇宙的历史性瞬间。
    - 但与此同时，读者不知道的是，真正的林玄早已经乘坐另一艘飞船进入了暗宇宙。

    dialogue:
    - 陈浩：“报告长官，一切人员物资准备就绪，已经完成登船，静待出发。”
    - 林玄：“人员全部确认了吗？”
    - 陈浩：“全部确认。”
    - 林玄：“物资呢？”
    - 陈浩：“生命维持系统、能源储备、科研设备、备用能源以及紧急撤离设备，全部按照最高标准准备完成。”
    - 林玄：“通讯系统？”
    - 陈浩：“已经完成最后测试。”
    - 林玄：“很好。”
    - 洪：“林玄。”
    - 林玄：“嗯？”
    - 洪：“这一次不一样。”
    - 洪：“以前我们看到的宇宙，终究只是资料里的宇宙。”
    - 洪：“真正走出去之后，你面对的可能是远远超出我们想象的危险。”
    - 雷神：“老洪说得没错。”
    - 雷神：“虽然我们现在已经知道宇宙文明的存在，也知道域外有大量强者，但知道和真正面对，是两回事。”
    - 雷神：“如果碰到那些真正的强者，别逞强。”
    - 林玄：“放心。”
    - 雷神：“你这句话，我怎么听着这么不靠谱？”
    - 林玄微微一笑。
    - 贾谊：“林玄，这次行动最重要的不是得到多少资源，也不是认识多少宇宙文明。”
    - 贾谊：“最重要的是安全。”
    - 贾谊：“我们需要让地球真正了解宇宙，而不是让地球因为宇宙而毁灭。”
    - 林玄：“我明白。”
    - 洪：“如果情况不对，就回来。”
    - 林玄沉默片刻。
    - 林玄：“你们放心就行。”
    - 林玄：“我既然敢让人类走出去，就有把握让他们回来。”
    - 雷神：“那地球呢？”
    - 林玄转头看向三人。
    - 林玄：“地球就交给你们了。”
    - 林玄：“无论我走到哪里，你们都要保护好地球。”
    - 洪：“放心。”
    - 雷神：“有我们在。”
    - 贾谊：“人类不会停在这里。”
    - 林玄：“那就好。”
    - 雷神：“等你回来，我们再一起喝酒。”
    - 林玄：“好。”
    - 洪：“一定要回来。”
    - 林玄看着洪。
    - 林玄：“一定。”

    emotional_focus:
    - 地球文明迈入宇宙时代的激动。
    - 洪、雷神、贾谊对林玄的担忧。
    - 林玄面对离别时的平静。
    - 强者之间无需多言的信任。
    - 林玄对地球深厚的责任感。
    - 人类文明第一次真正走向宇宙的历史感。
    - 表面平静之下隐藏着林玄真正计划的巨大危险。

    mystery:
    - 为什么林玄似乎早已经知道宇宙文明的存在？
    - 为什么林玄对这次宇宙行动表现得异常平静？
    - 林玄究竟掌握了多少宇宙信息？
    - 为什么林玄没有告诉洪、雷神、贾谊全部计划？
    - 除了这艘前往宇宙的C级飞船之外，是否还有另一艘飞船？
    - 林玄真正的目的究竟是什么？
    - 为什么这一次行动需要准备如此漫长的时间？
    - 林玄口中的“回来”究竟意味着什么？

    ending:
    - C级宇宙飞船缓缓脱离地球停泊港。
    - 巨大的舰体逐渐升入太空。
    - 地球越来越小。
    - 洪、雷神、贾谊三人站在停泊港边缘目送飞船离开。
    - 林玄站在原地，没有继续说话。
    - 他的目光越过飞船，落向更加遥远的星空。
    - 那里才是他真正要去的地方。
    - 林玄心中没有说出口的一句话是：
    - “你们看到的，只是人类第一次走向宇宙。”
    - “而我真正要走的路，才刚刚开始。”
    - 镜头逐渐拉远。
    - 地球停泊港越来越小。
    - 巨大的C级飞船消失在星空深处。
    - 视线穿越地球，穿越月球，穿越太阳系，继续往前，穿越银河系，落在10万光年外的另一搜C级飞船上，
    - 画面切断。
    - 转入另一片完全陌生的黑暗。
    - 第二艘C级宇宙飞船正在暗宇宙中以惊人的速度航行。
    - 这一次，没有地球。
    - 没有洪。
    - 没有雷神。
    - 没有智囊团。
    - 没有任何人类随行人员。
    - 只有林玄、小柒，以及飞船大厅里那些不能被任何人知道的秘密。
    - 正式进入 Scene 02：银河系边缘。


  # =====================================================
  # Scene 02
  # 暗宇宙深处
  # =====================================================

  - id: scene_02
    title: 暗宇宙深处

    goal:
    - 让读者第一眼感受到真正的宇宙尺度。
    - 建立暗宇宙黑暗、空旷、枯燥、孤独的核心氛围。
    - 明确林玄已经在暗宇宙中航行了五年。
    - 不解释林玄过去，只展示现在。

    location:
    - 暗宇宙深处。
    - 银河系之外。
    - 半人马星系方向。
    - C级宇宙飞船内部。
    - 距离地球约十万光年。

    characters:
    - 林玄。
    - 小柒智能子体。

    events:
    - 飞船以20倍光速持续航行。
    - 暗宇宙中没有普通宇宙星空。
    - 周围只有无尽黑暗。
    - 飞船像一粒尘埃一样穿行在无限空间。
    - 飞船已经连续航行五年。
    - 航行系统始终保持稳定。
    - 船体外部不断产生微弱空间波动。
    - 船舱内部保持安静。
    - 林玄独自站在巨大观景窗前。
    - 他已经很久没有说话。
    - 五年的漫长航行让时间失去了普通意义。
    - 飞船内的设备按照固定程序循环工作。
    - 只有偶尔的系统提示音打破沉默。

    atmosphere:
    - 黑暗。
    - 空旷。
    - 枯燥。
    - 孤独。
    - 深邃。
    - 压迫。
    - 安静。
    - 无边无际。

    key_scene:
    - 用大量环境描写表现暗宇宙的“空”。
    - 不要简单写成“周围一片漆黑”。
    - 要表现暗宇宙对于人类感官的剥夺。
    - 没有日夜。
    - 没有太阳。
    - 没有熟悉的星辰。
    - 没有方向感。
    - 没有时间流逝的直观感觉。
    - 让读者感受到如果没有飞船系统，人类甚至无法确认自己是否真的在移动。
    - 林玄已经习惯这种环境。
    - 但这种习惯本身反而体现了他的强大与孤独。

    dialogue:
    - 林玄：“五年了。”
    - 小柒：“准确来说，是五年零十四小时三十七分钟。”
    - 林玄：“你还真是一秒都不肯浪费。”
    - 小柒：“当然。”
    - 小柒：“我最大的爱好，就是纠正你的时间概念。”
    - 林玄没有回答。
    - 小柒：“你又开始发呆了。”
    - 林玄：“只是想起了一些事情。”
    - 小柒：“二十年前的？”
    - 林玄沉默。

    emotional_focus:
    - 孤独。
    - 平静。
    - 怀念。
    - 压迫。
    - 克制。

    mystery:
    - 林玄究竟为什么在暗宇宙中飞行五年？
    - 二十年前究竟发生了什么？
    - 他为什么已经习惯这种孤独？
    - 这艘飞船究竟要去哪里？

    ending:
    - 林玄低头看向手中的金色光球。
    - 金色光球突然微微震动。
    - 一缕极细的能量从附近设备中消失。
    - 林玄目光变得凝重。
    - 小柒停止说话。
    - 飞船大厅第一次出现异常的安静。
    - 林玄轻声说道：
      “它又开始了。”

  # =====================================================
  # Scene 03
  # 金色光球
  # =====================================================

  - id: scene_03
    title: 金色光球

    goal:
    - 正式展示金色光球。
    - 让读者意识到这是林玄最重要的神秘物品之一。
    - 暂时不解释金色光球的真正来源。
    - 展示它具有吞噬、吸收、变化等异常现象。
    - 让读者产生“这到底是什么”的强烈疑问。

    location:
    - C级飞船控制大厅。
    - 林玄身边。
    - 暗宇宙航行状态下。

    characters:
    - 林玄。
    - 小柒智能子体。

    events:
    - 林玄将金色光球托在掌心。
    - 光球表面出现细微金色纹路。
    - 周围微弱能量被缓慢吸入。
    - 光球表面出现一瞬间的暗淡。
    - 随后重新恢复明亮。
    - 林玄精神念力覆盖金色光球。
    - 他试图判断光球当前状态。
    - 小柒同步读取检测数据。
    - 检测结果依旧无法解释。
    - 林玄没有继续强行解析。
    - 他已经学会对这个东西保持克制。

    atmosphere:
    - 神秘。
    - 安静。
    - 危险。
    - 科技与未知交织。
    - 隐约诡异。

    key_scene:
    - 金色光球应该成为本章最重要的视觉符号之一。
    - 它不能表现得像普通能量核心。
    - 它应该给人一种“它自己正在观察世界”的感觉。
    - 它偶尔吞噬能量。
    - 但没有明确的能量输入结构。
    - 林玄无法完全理解它。
    - 这种“连林玄都无法理解”的感觉必须保留。

    dialogue:
    - 小柒：“它刚才又吸收了一点能量。”
    - 林玄：“多少？”
    - 小柒：“非常少。”
    - 林玄：“少到什么程度？”
    - 小柒：“如果把整艘飞船的能源比作一片海。”
    - 小柒：“它刚才喝了一滴水。”
    - 林玄：“但你还是紧张了。”
    - 小柒：“因为我不知道它为什么喝。”
    - 林玄：“我也不知道。”
    - 小柒：“你不害怕？”
    - 林玄看着掌心的金色光球。
    - “怕。”
    - “所以我才一直留着它。”

    emotional_focus:
    - 神秘。
    - 好奇。
    - 警惕。
    - 信任。
    - 不安。

    mystery:
    - 金色光球究竟是什么？
    - 它为什么能够吞噬能量？
    - 它是否拥有自己的意识？
    - 为什么林玄能够控制它？
    - 它与林玄之间究竟有什么关系？
    - 五年计划是否与金色光球有关？

    ending:
    - 金色光球突然停止旋转。
    - 表面出现一道极细的金色裂纹。
    - 林玄脸色第一次发生变化。
    - 小柒立即关闭所有非必要系统。
    - 林玄低声说道：
      “不用紧张。”
    - “它还没有真正开始。”
    - 小柒沉默。
    - 她显然知道林玄口中的“真正开始”意味着什么。

  # =====================================================
  # Scene 04
  # 不朽尸体
  # =====================================================

  - id: scene_04
    title: 棺椁中的尸体

    goal:
    - 展示机械族不朽尸体。
    - 建立宇宙强者层次的恐怖感。
    - 让读者意识到林玄已经拥有远超地球时代想象的资源。
    - 通过尸体胸口的恐怖伤口制造新的谜团。
    - 暗示尸体与五年计划存在直接关系。

    location:
    - 飞船核心大厅。
    - 最高等级生命实验区域外侧。
    - 黑色特殊材料打造的巨大棺椁。

    characters:
    - 林玄。
    - 小柒智能子体。
    - 机械族不朽尸体。

    events:
    - 镜头从林玄身边缓缓移动。
    - 巨大棺椁出现在大厅深处。
    - 棺椁表面布满复杂封锁符文与科技设备。
    - 棺椁内部躺着一具机械族不朽尸体。
    - 尸体外形与普通人类完全不同。
    - 身体由特殊金属构成。
    - 即使死亡多年，依旧保持完整。
    - 胸口存在一个巨大的贯穿伤口。
    - 伤口边缘存在恐怖能量残留。
    - 仿佛有什么力量直接穿透其身体。
    - 林玄站在棺椁前观察。
    - 小柒启动生命材料扫描。
    - 扫描结果显示尸体依旧具有极高研究价值。
    - 林玄没有让小柒打开棺椁。

    atmosphere:
    - 冰冷。
    - 压迫。
    - 恐怖。
    - 死寂。
    - 神秘。

    key_scene:
    - 尸体必须体现“不朽”这一生命层次的恐怖。
    - 即便已经死亡漫长岁月，身体依旧像一件完美的武器。
    - 普通生命根本无法理解这种生命层次。
    - 胸口伤口应该成为视觉焦点。
    - 不直接解释是谁造成的。
    - 甚至不要告诉读者尸体究竟是什么身份。
    - 只让读者知道：
      这是一具极其恐怖的生命尸体。

    dialogue:
    - 小柒：“它还是没有任何生命波动。”
    - 林玄：“正常。”
    - 小柒：“你确定它真的死了？”
    - 林玄：“至少以我们现在的检测手段，它已经死了。”
    - 小柒：“什么叫以我们现在的检测手段？”
    - 林玄没有回答。
    - 小柒：“你是不是还藏着什么？”
    - 林玄：“我只是比你谨慎一点。”
    - 小柒：“你这是在侮辱我的计算能力。”
    - 林玄：“我是在夸你。”
    - 小柒：“……”
    - 小柒：“我越来越觉得你不太会夸人。”

    emotional_focus:
    - 压迫。
    - 恐惧。
    - 神秘。
    - 轻微缓和。
    - 不安。

    mystery:
    - 这具尸体究竟是谁？
    - 它为什么会死亡？
    - 胸口的伤口是谁留下的？
    - 为什么林玄能够得到一具机械族不朽尸体？
    - 林玄为什么把它带到如此遥远的地方？
    - 这具尸体究竟是实验材料还是某种关键媒介？

    ending:
    - 林玄看了一眼尸体胸口。
    - 目光停留数秒。
    - 他轻声说道：
      “再等十天。”
    - “十天以后，你就会知道答案了。”
    - 棺椁重新进入最高等级封锁状态。

  # =====================================================
  # Scene 05
  # 火神源晶
  # =====================================================

  - id: scene_04
    title: 火神源晶

    goal:
    - 展示本章第二个真正危险的核心物品。
    - 通过火神源晶制造强烈的力量震撼。
    - 让读者意识到林玄不是普通宇宙冒险者。
    - 建立五年计划已经准备到极其夸张的程度。
    - 暗示火神源晶可能是计划失败后的最终手段。

    location:
    - 飞船核心能源区。
    - 最高等级封锁实验舱。
    - 透明金属方盒内部。

    characters:
    - 林玄。
    - 小柒智能子体。

    events:
    - 林玄来到透明金属方盒前。
    - 方盒内部悬浮着半米左右的菱形火红色晶体。
    - 晶体内部仿佛有岩浆流动。
    - 周围空间出现微弱扭曲。
    - 小柒自动提高能量隔离等级。
    - 林玄没有触碰方盒。
    - 小柒解释火神源晶的危险等级。
    - 一旦发生爆炸，将瞬间释放恐怖能量。
    - 即使封侯级不朽也可能被直接灭杀。
    - 林玄确认最终封锁状态。

    atmosphere:
    - 危险。
    - 炽热。
    - 压迫。
    - 恐怖。
    - 庄严。

    key_scene:
    - 火神源晶不能单纯写成“很强”。
    - 要通过空间变化、能量反应、设备警报表现其危险。
    - 飞船内部所有系统面对它都表现出最高等级警戒。
    - 林玄却表现得非常平静。
    - 这种反差体现林玄的强者气场。
    - 同时暗示他知道这个东西为什么必须存在。

    dialogue:
    - 小柒：“火神源晶状态正常。”
    - 林玄：“封锁等级？”
    - 小柒：“最高。”
    - 林玄：“保险？”
    - 小柒：“七重。”
    - 林玄：“还不够。”
    - 小柒：“我就知道你会这么说。”
    - 小柒：“已经追加到十二重。”
    - 林玄：“很好。”
    - 小柒：“你到底准备拿它做什么？”
    - 林玄：“希望永远用不到。”
    - 小柒沉默片刻。
    - “我也希望。”

    emotional_focus:
    - 恐怖。
    - 压迫。
    - 警惕。
    - 沉重。

    mystery:
    - 火神源晶为什么必须带上飞船？
    - 它是武器还是保险？
    - 五年计划是否存在必须使用火神源晶的情况？
    - 林玄究竟预想了多么严重的失败结果？

    ending:
    - 林玄转身离开。
    - 身后的火神源晶依旧静静悬浮。
    - 红色光芒照亮整个封闭舱室。
    - 小柒忽然说道：
      “你准备的东西，越来越像是准备去和整个宇宙同归于尽。”
    - 林玄停顿一下。
    - “放心。”
    - “我还没活够。”

  # =====================================================
  # Scene 06
  # 小柒智能子体
  # =====================================================

  - id: scene_06
    title: 小柒

    goal:
    - 正式强化小柒的人物形象。
    - 明确这里出现的是小柒智能子体。
    - 通过对话表现小柒已经拥有成熟人格。
    - 让小柒成为林玄漫长宇宙旅程中的唯一情绪伙伴。
    - 暗示小柒真正的生命来源远比普通人工智能复杂。

    location:
    - 飞船控制大厅。
    - 林玄身边。
    - 暗宇宙航行状态。

    characters:
    - 林玄。
    - 小柒智能子体。

    events:
    - 小柒以全息投影形式出现。
    - 她可以自由改变自己的外貌与姿态。
    - 她不像传统人工智能一样机械。
    - 她会主动吐槽林玄。
    - 她会观察林玄的情绪。
    - 她会主动询问林玄过去的事情。
    - 林玄偶尔会嫌她话多。
    - 小柒却完全不在意。
    - 她会主动报告航行数据。
    - 同时不断加入没有必要的个人评价。
    - 这种反差让飞船中的气氛明显轻松下来。

    atmosphere:
    - 温暖。
    - 轻松。
    - 俏皮。
    - 亲切。
    - 隐约孤独。

    key_scene:
    - 小柒不能写成普通人工智能助手。
    - 她应该拥有明显的人格。
    - 她会故意打断林玄。
    - 她会吐槽。
    - 她会撒娇。
    - 她会担心林玄。
    - 关键时刻却绝对冷静。
    - 她可以在一秒钟内从“话痨女孩”切换成最高级智能生命。

    dialogue:
    - 小柒：“还有十天。”
    - 林玄：“嗯。”
    - 小柒：“你不激动？”
    - 林玄：“激动什么？”
    - 小柒：“终于要结束这五年的无聊生活了。”
    - 林玄：“你觉得无聊？”
    - 小柒：“当然。”
    - 小柒：“这五年我每天最大的娱乐就是统计你一天说了多少句话。”
    - 林玄：“多少？”
    - 小柒：“平均每天三十七句。”
    - 林玄：“这么少？”
    - 小柒：“其中还有二十句是‘嗯’。”
    - 林玄：“……”
    - 小柒：“所以我怀疑你根本不是人类。”
    - 林玄：“那你是什么？”
    - 小柒：“我是生命。”
    - 林玄看了她一眼。
    - 小柒认真说道：
      “我本来就是。”
    - 林玄没有纠正她。

    emotional_focus:
    - 温暖。
    - 轻松。
    - 伙伴感。
    - 信任。
    - 隐约神秘。

    mystery:
    - 小柒为什么如此像真正的人类？
    - 她为什么坚持自己是生命？
    - 她真正的本体在哪里？
    - 智能子体与真正小柒之间是什么关系？
    - 她为什么能够如此了解林玄？
    - 她为什么愿意陪林玄执行这样危险的计划？

    ending:
    - 小柒突然收起笑容。
    - 她看向林玄。
    - “林玄。”
    - 林玄：“嗯？”
    - “如果这次失败，你会怎么办？”
    - 林玄没有立即回答。
    - 飞船继续在黑暗中高速前进。

  # =====================================================
  # Scene 07
  # 五年
  # =====================================================

  - id: scene_07
    title: 五年准备

    goal:
    - 正式将“五年”提升为本章最大的剧情悬念。
    - 让读者知道五年不是简单的旅行时间。
    - 展示林玄为这次计划准备了大量资源。
    - 不揭开计划内容，只揭开部分关键词。
    - 让读者对下一章产生强烈期待。

    location:
    - 飞船核心控制大厅。
    - 最高等级权限界面。
    - 暗宇宙航道。

    characters:
    - 林玄。
    - 小柒智能子体。

    events:
    - 小柒打开五年计划档案。
    - 屏幕出现大量加密文件。
    - 大量资料被最高等级权限锁定。
    - 文件关键词依次出现。
    - 生命。
    - 灵魂。
    - 分身。
    - 记忆。
    - 基因。
    - 融合。
    - 失败预案。
    - 林玄只查看其中一部分。
    - 小柒提醒林玄实验风险。
    - 林玄关闭所有文件。
    - 他不允许继续讨论实验细节。

    atmosphere:
    - 压迫。
    - 神秘。
    - 庄严。
    - 宿命。
    - 紧张。

    key_scene:
    - 通过文件关键词制造悬念。
    - 不解释关键词之间的关系。
    - 不直接告诉读者金色光球、机械族不朽、火神源晶分别对应什么。
    - 让读者自己建立联系。
    - 林玄的态度必须非常认真。
    - 这是他五年来真正等待的东西。

    dialogue:
    - 小柒：“准备了五年。”
    - 小柒：“你真的准备好了吗？”
    - 林玄：“没有。”
    - 小柒明显一愣。
    - 林玄：“如果我真的准备好了，就说明我已经知道结果。”
    - 小柒：“那你为什么还要做？”
    - 林玄：“因为不知道。”
    - “所以才值得做。”
    - 小柒沉默。
    - 她看着林玄。
    - “如果失败呢？”
    - 林玄：“那就失败。”
    - 小柒：“你倒是看得开。”
    - 林玄：“不是看得开。”
    - “只是已经没有更好的选择。”

    emotional_focus:
    - 紧张。
    - 沉重。
    - 坚定。
    - 悲壮。
    - 宿命。

    mystery:
    - 五年计划究竟是什么？
    - 为什么需要生命与灵魂资料？
    - 为什么需要分身？
    - 为什么需要记忆？
    - 为什么需要机械族不朽尸体？
    - 为什么需要金色光球？
    - 为什么需要火神源晶？
    - 林玄究竟想改变自己的什么？

    ending:
    - 小柒关闭所有文件。
    - 飞船重新恢复安静。
    - 航行距离再次刷新。
    - 距离目的地只剩最后十天。
    - 林玄看着屏幕上的“10天”。
    - 五年的准备终于进入最后倒计时。

  # =====================================================
  # Scene 08
  # 奇洛星
  # =====================================================

  - id: scene_08
    title: 奇洛星坐标

    goal:
    - 第一次明确告诉读者目的地。
    - 建立半人马星系与奇洛星的概念。
    - 解释林玄为什么选择这里。
    - 展示林玄做事谨慎、有备用方案。
    - 强化计划失败的危险程度。

    location:
    - 暗宇宙航行控制大厅。
    - 半人马星系方向。
    - 奇洛星附近航线。

    characters:
    - 林玄。
    - 小柒智能子体。

    events:
    - 小柒调出目的地坐标。
    - 坐标指向半人马星系。
    - 目标位置锁定奇洛星附近区域。
    - 林玄确认航线。
    - 小柒展示虚拟宇宙覆盖信息。
    - 奇洛星附近存在虚拟宇宙界主级强者。
    - 这意味着如果计划出现严重意外，可以第一时间接入虚拟宇宙体系。
    - 林玄确认这是自己选择这里的核心原因之一。
    - 小柒询问是否真的需要把安全距离控制到这种程度。
    - 林玄回答必须如此。

    atmosphere:
    - 理性。
    - 冷静。
    - 紧张。
    - 谨慎。

    key_scene:
    - 展示林玄不是莽夫。
    - 他已经把计划失败后的情况考虑到极限。
    - 甚至选择目的地时，都考虑到了虚拟宇宙的保护力量。
    - 这种谨慎必须让读者感受到：
      “这次计划真的非常危险。”

    dialogue:
    - 小柒：“奇洛星附近。”
    - 林玄：“确认。”
    - 小柒：“这里距离主要文明区域并不近。”
    - 林玄：“所以才安全。”
    - 小柒：“但附近存在界主级强者。”
    - 林玄：“这也是我选择这里的原因。”
    - 小柒：“你是在给自己准备退路。”
    - 林玄：“不。”
    - “是在给所有人准备退路。”
    - 小柒沉默。

    emotional_focus:
    - 谨慎。
    - 理智。
    - 压迫。
    - 责任感。

    mystery:
    - 为什么这个计划必须在奇洛星附近进行？
    - 为什么需要虚拟宇宙作为保险？
    - 计划到底会产生什么级别的风险？
    - 如果失败，究竟会发生什么？

    ending:
    - 小柒关闭星图。
    - “十天。”
    - “十天之后，我们就到了。”
    - 林玄：“嗯。”
    - 他再次看向手中的金色光球。
    - 光球安静了下来。

  # =====================================================
  # Scene 09
  # 最后的十天
  # =====================================================

  - id: scene_09
    title: 最后的十天

    goal:
    - 让章节进入最后阶段。
    - 用时间倒计时强化紧张感。
    - 展示林玄对所有物资和设备进行最后检查。
    - 让读者感觉真正的剧情马上开始。
    - 为最终脱离暗宇宙做准备。

    location:
    - C级飞船内部。
    - 核心控制大厅。
    - 生命实验区域。
    - 武器与能源区域。

    characters:
    - 林玄。
    - 小柒智能子体。

    events:
    - 林玄依次检查飞船状态。
    - 检查生命实验区域。
    - 检查机械族不朽尸体。
    - 检查金色光球。
    - 检查火神源晶。
    - 检查备用能源。
    - 检查虚拟宇宙连接权限。
    - 检查所有紧急撤离方案。
    - 小柒将七套失败预案全部重新验证。
    - 所有系统均显示正常。
    - 林玄却依旧没有放松。
    - 小柒询问他是否还有遗漏。
    - 林玄回答：
      “有。”
    - 小柒追问。
    - 林玄没有回答。

    atmosphere:
    - 紧张。
    - 安静。
    - 压迫。
    - 倒计时感。
    - 宿命感。

    key_scene:
    - 林玄检查每一样东西。
    - 每一个检查动作都要让读者意识到它的重要性。
    - 但不要解释这些东西最终会怎么使用。
    - 让读者产生“所有东西拼起来以后，一定会发生一件非常恐怖的事情”的感觉。

    dialogue:
    - 小柒：“所有系统正常。”
    - 林玄：“很好。”
    - 小柒：“所有预案正常。”
    - 林玄：“很好。”
    - 小柒：“所有实验材料正常。”
    - 林玄：“很好。”
    - 小柒：“那你为什么还在检查？”
    - 林玄：“因为我害怕。”
    - 小柒安静下来。
    - 林玄：“真正危险的计划，不允许存在‘应该没问题’。”
    - 小柒：“你什么时候变得这么啰嗦了？”
    - 林玄：“跟你学的。”

    emotional_focus:
    - 紧张。
    - 温暖。
    - 压迫。
    - 坚定。

    mystery:
    - 林玄最后遗漏的究竟是什么？
    - 为什么所有准备都完成后，他依旧不放心？
    - 计划究竟需要多大的代价？

    ending:
    - 小柒突然报告。
    - “最后十天。”
    - 林玄抬头。
    - “开始最终倒计时。”
    - 飞船继续高速穿越暗宇宙。

  # =====================================================
  # Scene 09
  # 脱离暗宇宙
  # =====================================================

  - id: scene_09
    title: 重返原始宇宙

    goal:
    - 完成本章最终高潮。
    - 结束五年的暗宇宙航行。
    - 让读者重新看到真正的宇宙星空。
    - 通过强烈的视觉变化制造章节结束时的爽感。
    - 正式进入下一阶段剧情。
    - 暗示真正的计划现在才开始。

    location:
    - 暗宇宙出口。
    - 半人马星系附近。
    - 奇洛星附近原始宇宙空间。

    characters:
    - 林玄。
    - 小柒智能子体。

    events:
    - 十天时间快速过去。
    - 飞船开始进入减速程序。
    - 20倍光速逐渐降低。
    - 暗宇宙空间开始出现变化。
    - 飞船周围的空间波动越来越剧烈。
    - 小柒关闭部分暗宇宙航行系统。
    - 林玄站到控制大厅中央。
    - 所有最高等级设备进入待机。
    - 火神源晶封锁等级提升。
    - 机械族不朽尸体重新进入绝对封锁。
    - 金色光球被林玄收回。
    - 小柒开始最后倒计时。
    - 林玄没有说话。
    - 他只是看着前方。
    - 暗宇宙黑暗开始出现一道微弱光芒。
    - 光芒越来越强。
    - 原始宇宙即将重新出现。

    atmosphere:
    - 紧张。
    - 壮阔。
    - 期待。
    - 压迫。
    - 神圣。
    - 爆发前夕。

    key_scene:
    - 暗宇宙的黑暗必须与原始宇宙的星空形成强烈对比。
    - 五年的黑暗之后，第一缕星光应该具有视觉冲击。
    - 林玄看到星光时不应该像第一次看到宇宙那样震撼。
    - 他应该表现得非常平静。
    - 因为真正让他紧张的不是宇宙，而是即将开始的计划。
    - 这一点可以形成强烈反差：
      五年前他期待进入暗宇宙。
      五年后他终于抵达目的地，却第一次真正紧张。

    dialogue:
    - 小柒：“林玄。”
    - 林玄：“嗯。”
    - 小柒：“准备好了吗？”
    - 林玄沉默几秒。
    - “开始吧。”
    - 小柒：“暗宇宙航行速度下降。”
    - “十五倍光速。”
    - “十倍光速。”
    - “五倍光速。”
    - “暗宇宙出口确认。”
    - “三。”
    - “二。”
    - “一。”
    - “脱离暗宇宙。”

    emotional_focus:
    - 紧张。
    - 期待。
    - 震撼。
    - 宿命。
    - 爆发前夕。

    mystery:
    - 奇洛星附近究竟是什么样？
    - 林玄接下来究竟准备做什么？
    - 五年的准备能否成功？
    - 金色光球究竟会发挥什么作用？
    - 机械族不朽尸体究竟会被如何使用？
    - 火神源晶最终是否会被启动？
    - 林玄的生命究竟会发生什么变化？

    ending:
    - 飞船猛然冲出暗宇宙。
    - 原始宇宙星空重新出现在观景窗外。
    - 无数星辰瞬间充满整个视野。
    - 林玄看着眼前熟悉而又陌生的星空。
    - 小柒报告：
      “原始宇宙坐标确认。”
    - “当前位置：半人马星系外围。”
    - “距离奇洛星，预计剩余航行时间……”
    - 小柒停顿了一瞬。
    - 林玄问：
      “多久？”
    - 小柒回答：
      “三小时十七分钟。”
    - 林玄没有说话。
    - 他低头看向掌心。
    - 金色光球安静地悬浮在那里。
    - 远处，半人马星系庞大的星海缓缓展开。
    - 林玄望着那片星空。
    - 五年的准备。
    - 五年的等待。
    - 五年的孤独。
    - 终于到了最后一步。
    - 他轻声说道：
      “小柒。”
    - “我在。”
    - “通知所有系统。”
    - “计划，正式开始。”
    - 画面结束。
    - Chapter 001 完。