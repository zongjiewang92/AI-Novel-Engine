  - 他为什么已经能够在宇宙深处独自行走？
  - 林玄究竟经历了什么？
  - 他为什么已经强大到这种程度，却依旧如此谨慎？
  - 林玄手中的金色光球究竟是什么？
  - 金色光球为什么会吞噬周围的能量？
  - 棺椁中的机械族不朽究竟是谁？
  - 这具尸体为什么会被林玄带在飞船上？
  - 尸体胸口的恐怖伤口是谁造成的？
  - 那颗火红色晶体究竟是什么？
  - 为什么林玄会携带一颗能够灭杀封侯不朽的火神源晶？
  - 五年前林玄究竟开始准备了什么？
  - 为什么一个已经如此强大的林玄还需要准备五年？
  - 为什么目的地必须选择奇洛星附近？
  - 为什么需要虚拟宇宙界主级强者作为最后的安全保障？
  - 林玄究竟想从自己身上得到什么答案？
  - 小柒为什么拥有如此明显的人格？
  - 为什么这里只是小柒的智能子体？
