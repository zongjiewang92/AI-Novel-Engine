# =====================================================
# Plot 03
# 沉睡的不朽生命
# Chapter 003-004
# =====================================================

- id: plot_01_01_03
  title: 沉睡的不朽生命
  chapter_range: 3-4

  goal:
  - 正式揭开林玄此次五年计划真正要使用的实验载体。
  - 第一次完整展示一具不朽级机械族生命的遗骸。
  - 通过不朽级生命遗骸的存在感，让读者直观感受到宇宙强者与普通生命之间近乎无法理解的差距。
  - 解释林玄为什么选择机械族生命作为自己的第一个分身载体。
  - 展示机械族生命与普通血肉生命完全不同的生命结构。
  - 建立金色光球吞噬、解析、融合、固化四种核心能力的基本逻辑。
  - 明确金色光球并不是一个完全受林玄控制的工具。
  - 第一次真正提出“人格污染”这一致命风险。
  - 让读者意识到，林玄真正害怕的并不是分身死亡，而是分身活下来之后变成另一个人。
  - 通过多重隔离措施，证明林玄早已经将最坏情况考虑进去。
  - 为后续金色光球正式吞噬不朽机械族生命建立心理与剧情基础。

  theme:
  - 不朽的生命也会死亡。
  - 强大的身体并不代表真正的自我。
  - 记忆是否等于人格。
  - 身体可以继承，意识却未必能够继承。
  - 创造生命与复活生命只有一线之隔。
  - 对未知力量的敬畏。
  - 真正的强者不是没有恐惧，而是在恐惧存在的情况下依旧敢于前进。

  purpose:
  - 让读者第一次真正看到林玄未来分身的“身体”。
  - 建立不朽级机械族生命的神秘感与压迫感。
  - 让林玄选择机械族作为分身载体具有充分合理性。
  - 进一步强化金色光球作为金手指的强大与危险。
  - 将本章从单纯的“实验准备”升级为“生命本质实验”。
  - 为后续人格冲突、意识融合、灵魂自陨等剧情埋下根基。
  - 让读者开始真正担心林玄会不会因为自己的金手指而失去自己。

  opening_hook:
  - 实验飞船内部陷入绝对安静。
  - 小柒关闭最后一组非必要系统。
  - 一道隐藏在飞船最深处的巨大封锁舱缓缓开启。
  - 舱门开启的瞬间，没有任何耀眼光芒，只有一股沉重到令人窒息的气息从其中缓缓扩散。
  - 一具庞大的机械生命遗骸静静躺在实验舱中央。
  - 它没有呼吸，没有心跳，没有生命波动。
  - 但仅仅是看着它，林玄便本能地产生一种危险感。
  - 这不是普通的尸体。
  - 这是一个曾经真正拥有不朽生命层次的存在。
  - 林玄站在实验舱外，没有立即靠近。
  - 五年的准备，在这一刻终于拥有了真正的实体。

  protagonist_state:
    physical_state:
    - 林玄本尊依旧位于地球。
    - 当前实验区域只有林玄的实验意识投影、金色光球以及小柒的智能子体。
    - 金色光球已经从本尊识海中独立分离。
    - 实验期间林玄与本尊保持严格隔离。
    - 当前实验不会直接影响地球本尊。
    - 林玄身体状态稳定，没有任何明显异常。
    mental_state:
    - 极度冷静。
    - 高度集中。
    - 对不朽级生命存在本能敬畏。
    - 对实验结果存在期待。
    - 对金色光球存在无法消除的不确定感。
    - 对人格污染存在深层恐惧。
    - 已经接受实验可能失败甚至可能改变自己的最坏结果。
    - 不允许自己的情绪影响实验判断。
    - 越接近实验核心，反而越冷静。

  key_scene:
  - 实验舱开启，不朽级机械族尸体第一次完整出现。
  - 林玄观察尸体的外部结构与生命核心。
  - 小柒报告尸体虽然死亡，但部分核心结构仍然保持完整。
  - 林玄确认这具尸体没有被彻底摧毁。
  - 林玄解释机械族生命与血肉生命最大的不同。
  - 林玄确认这具不朽尸体是目前最适合金色光球尝试融合的载体。
  - 林玄没有立刻进行吞噬，而是再次确认所有隔离措施。
  - 火神源晶进入最高等级待机状态。
  - 小柒智能子体进入伪装状态。
  - 所有通讯接口与本尊彻底隔离。
  - 林玄最终决定开始第一次接触。

  climax:
  - 金色光球第一次缓缓靠近不朽机械族尸体。
  - 金色光球接触尸体的瞬间，整个实验舱出现异常能量波动。
  - 原本沉寂的不朽机械族尸体突然出现短暂的生命反应。
  - 大量复杂的生命信息被金色光球瞬间捕获。
  - 林玄通过金色光球感受到大量完全陌生的生命信息。
  - 那些信息并不是单纯的数据。
  - 其中夹杂着模糊的记忆碎片、战斗痕迹、意识残响以及某种无法理解的生命本能。
  - 林玄第一次真正意识到：金色光球吞噬的可能不仅仅是身体。
  - 它甚至可能连生命曾经存在过的“痕迹”都一起吞噬。
  - 一瞬间，林玄产生一种极其陌生的错觉。
  - 仿佛有另一个意识正在通过金色光球注视着他。
  - 林玄立即中断融合。
  - 实验舱重新恢复死寂。
  - 林玄第一次确认：人格污染不是理论上的风险。
  - 那个已经死亡的不朽机械族生命，或许并没有真正“死干净”。

  knowledge_unlock:
  - 不朽级机械族生命的生命结构远比地球生命复杂。
  - 机械族并不是简单的机械机器，而是真正意义上的宇宙生命。
  - 不朽级机械族的身体本身就是高度复杂的生命系统。
  - 即使生命死亡，其部分核心结构仍可能长期保存。
  - 机械族生命拥有意识、记忆以及独立人格。
  - 金色光球吞噬生命时，可能同时接触生命结构与生命信息。
  - 记忆与生命结构之间可能存在某种未知联系。
  - 金色光球真正融合的对象可能远不止“身体”。
  - 人格污染并不是林玄的理论推测，而是已经出现了现实迹象。

  ability_unlock:
  - 金色光球能够主动吞噬机械族生命结构。
  - 金色光球能够解析不朽级生命结构。
  - 金色光球能够从生命结构中获取大量信息。
  - 金色光球能够尝试将不同生命结构进行融合。
  - 金色光球能够将融合后的生命结构进行固化。
  - 林玄能够通过意志主动中断融合过程。
  - 小柒智能子体能够对实验环境进行多层隔离。
  - 小柒能够监控金色光球与实验体之间的异常信息交换。
  - 火神源晶能够作为最终毁灭保险。

  emotion_curve:
  - 神秘。
  - 震撼。
  - 敬畏。
  - 好奇。
  - 压迫。
  - 紧张。
  - 恐惧。
  - 清醒。
  - 决绝。
  - 悬念。

  reader_question:
  - 这具机械族尸体究竟是什么层次的生命？
  - 它生前究竟有多强？
  - 为什么一个已经死亡的不朽生命依旧能够让林玄如此谨慎？
  - 金色光球究竟是什么？
  - 金色光球吞噬的到底是身体还是生命本身？
  - 为什么林玄如此害怕人格污染？
  - 如果机械族原本的意识还残留着怎么办？
  - 融合之后究竟会诞生林玄，还是诞生一个新的生命？
  - 如果诞生的是新的意识，林玄是否会被自己的分身取代？
  - 火神源晶最终究竟会不会被启动？

  foreshadow:
  - 金色光球。
  - 机械族不朽尸体。
  - 火神源晶。
  - 小柒智能子体。
  - 人格污染。
  - 生命记忆。
  - 灵魂与真灵。
  - 本尊与分身之间的意识连接。
  - 林玄未来的灵魂自陨秘法。
  - 金色光球真正的来源。

  reader_emotion:
  - 开始时被不朽级尸体的宏大与神秘吸引。
  - 中段产生对宇宙生命层次的震撼。
  - 随着金色光球接触尸体，开始产生危险预感。
  - 得知金色光球可能吞噬记忆后产生真正的不安。
  - 最终产生强烈悬念：林玄究竟还能不能成为“自己”。
  - 让读者从单纯期待分身变成担心分身真的成功。

  children:

  # =====================================================
  # Scene 01
  # 沉睡的巨物
  # =====================================================

  - id: scene_01
    title: 沉睡的巨物

    goal:
    - 第一次正式展示不朽级机械族尸体。
    - 用视觉与气势让读者意识到这不是普通的尸体。
    - 建立不朽级生命的神秘感与压迫感。
    - 让林玄面对自己未来分身的载体。

    location:
    - 实验飞船最深层。
    - 最高等级生命实验舱。
    - 多重能量隔离区。
    - 独立于飞船主系统之外的封闭实验区域。

    characters:
    - 林玄。
    - 小柒智能子体。

    events:
    - 实验舱外层封锁逐层解除。
    - 巨大的机械锁缓缓打开。
    - 实验舱内部没有灯光。
    - 小柒启动最低等级照明。
    - 一具庞大的机械生命遗骸逐渐显露。
    - 林玄第一次完整看到这具不朽级机械族尸体。
    - 尸体体型巨大，但并不是简单意义上的巨大机器。
    - 身体由大量无法理解的特殊金属生命结构组成。
    - 身体表面存在大量曾经经历过战斗留下的痕迹。
    - 部分区域已经严重破损。
    - 但最核心的位置依旧保持完整。
    - 林玄通过扫描确认其生命核心已经停止运转。
    - 尸体没有生命波动，却仍然给人一种无法忽视的压迫感。

    atmosphere:
    - 黑暗。
    - 寂静。
    - 冰冷。
    - 庄严。
    - 压迫。
    - 神秘。

    key_scene:
    - 林玄站在巨大的实验舱前。
    - 与这具不朽尸体相比，林玄显得极其渺小。
    - 他没有因为对方已经死亡而轻视。
    - 相反，他表现得异常谨慎。
    - 他知道站在自己面前的不是一堆废铁。
    - 而是一具曾经拥有不朽生命层次的宇宙生命遗骸。

    dialogue:
    - 小柒：“实验体确认，不朽级机械族生命。”
    - 林玄：“生命核心？”
    - 小柒：“已经停止。”
    - 林玄：“意识？”
    - 小柒：“无法确认。”
    - 林玄沉默片刻：“再检查一次。”
    - 小柒：“已经完成三次完整扫描。”
    - 林玄：“再来一次。”

    emotional_focus:
    - 敬畏。
    - 谨慎。
    - 震撼。

    mystery:
    - 这具不朽级机械族究竟是谁？
    - 它生前经历过什么？
    - 为什么尸体能够保存到现在？
    - 它的意识真的已经彻底消失了吗？

    ending:
    - 小柒完成第四次扫描。
    - 所有结果与前三次完全一致。
    - 没有生命波动。
    - 没有明显意识反应。
    - 林玄却没有因此放松。
    - 他看着尸体核心位置。
    - “没有反应，不代表什么都没有。”
    - 实验舱门缓缓关闭。
    - 林玄准备进入下一阶段。

  # =====================================================
  # Scene 02
  # 不朽的遗骸
  # =====================================================

  - id: scene_02
    title: 不朽的遗骸

    goal:
    - 进一步展示不朽级机械族生命的强大。
    - 让读者理解机械族不是普通机器。
    - 建立机械族身体作为分身载体的合理性。

    location:
    - 生命实验舱。
    - 不朽尸体观察平台。

    characters:
    - 林玄。
    - 小柒智能子体。

    events:
    - 小柒调出实验体结构扫描图。
    - 机械族身体内部出现大量复杂结构。
    - 这些结构并不是普通机械零件。
    - 每一个核心结构都具有独立的生命特征。
    - 不同区域之间存在高度复杂的信息传递体系。
    - 林玄对比地球生命结构。
    - 最终发现两者几乎没有可比性。
    - 林玄确认机械族身体非常适合作为新生命载体。
    - 即使原本生命已经死亡，身体仍然拥有巨大的成长潜力。

    atmosphere:
    - 科技感。
    - 神秘。
    - 宏大。
    - 严肃。

    key_scene:
    - 林玄看到完整结构图。
    - 屏幕上的结构不断展开。
    - 一个又一个复杂生命节点出现。
    - 最终形成一幅庞大到近乎不可思议的生命结构图。
    - 林玄第一次真正理解“不朽”二字的重量。

    dialogue:
    - 小柒：“这不是机器。”
    - 林玄：“我知道。”
    - 小柒：“它更接近一种……完全不同于血肉生命的生命体系。”
    - 林玄：“所以它才适合成为我的身体。”
    - 小柒：“前提是你能控制融合结果。”
    - 林玄：“这才是问题。”

    emotional_focus:
    - 震撼。
    - 理解。
    - 谨慎。

    mystery:
    - 机械族究竟如何成为真正的生命？
    - 不朽级生命的核心到底是什么？
    - 金色光球能否真正解析这种生命？

    ending:
    - 林玄关闭普通扫描。
    - “开始核心结构分析。”
    - 小柒停顿片刻。
    - “确认。”
    - 实验舱内所有设备同时启动。

  # =====================================================
  # Scene 03
  # 为什么是机械族
  # =====================================================

  - id: scene_03
    title: 为什么是机械族

    goal:
    - 解释林玄为什么没有选择普通血肉生命。
    - 建立机械族分身的优势。
    - 让选择不朽机械族作为载体成为必然结果。

    location:
    - 实验数据中心。
    - 生命结构分析区。

    characters:
    - 林玄。
    - 小柒智能子体。

    events:
    - 林玄调出过去五年的实验数据。
    - 多种生命载体方案被快速排除。
    - 普通血肉生命无法承受金色光球的融合过程。
    - 普通生命身体结构无法承载目标层次的力量。
    - 过强的生命又会带来更大的失控风险。
    - 机械族身体拥有高度完整的生命结构。
    - 同时能够承载庞大的能量与法则力量。
    - 不朽级机械族身体更是天然拥有极高的生命层次。
    - 最终机械族成为最合理的实验对象。

    atmosphere:
    - 理性。
    - 冷静。
    - 科学。
    - 压迫。

    key_scene:
    - 林玄看着被删除的一个个实验方案。
    - 最终屏幕上只剩下一项。
    - “不朽级机械族生命载体。”
    - 林玄没有说话。
    - 因为这已经不是选择。
    - 而是五年筛选之后唯一留下的答案。

    dialogue:
    - 小柒：“所以从五年前开始，你就已经决定使用机械族？”
    - 林玄：“不是决定。”
    - 小柒：“那是什么？”
    - 林玄：“筛选到最后，只剩下它。”

    emotional_focus:
    - 理性。
    - 决断。
    - 压迫。

    mystery:
    - 五年前林玄到底做了多少实验？
    - 为什么其他方案全部失败？
    - 金色光球究竟需要什么样的生命载体？

    ending:
    - 林玄关闭全部历史实验记录。
    - 目光重新落在不朽机械族尸体上。
    - “开始最终实验。”

  # =====================================================
  # Scene 04
  # 金色光球
  # =====================================================

  - id: scene_04
    title: 金色光球

    goal:
    - 正式展示金色光球。
    - 回顾金色光球伴随林玄重生的神秘背景。
    - 建立吞噬、解析、融合、固化四项核心能力。
    - 强调林玄对金色光球依旧缺乏真正理解。

    location:
    - 实验舱。
    - 不朽机械族尸体前。

    characters:
    - 林玄。
    - 小柒智能子体。
    - 金色光球。

    events:
    - 林玄让金色光球从独立容器中浮起。
    - 金色光球安静悬浮。
    - 小柒开始记录所有能量变化。
    - 林玄回忆金色光球伴随自己死亡与重生的过程。
    - 林玄确认目前已经掌握四项能力。
    - 吞噬。
    - 解析。
    - 融合。
    - 固化。
    - 但四项能力究竟遵循什么规则，林玄仍然无法完全解释。
    - 过去的实验只能证明它能够处理低层次生命结构。
    - 这一次面对的是不朽级机械族生命。
    - 林玄第一次真正无法预测结果。

    atmosphere:
    - 神秘。
    - 安静。
    - 压迫。
    - 危险。

    key_scene:
    - 金色光球缓缓悬浮在林玄面前。
    - 它看起来普通而安静。
    - 但林玄知道，这个小小的东西可能是自己最大的机缘。
    - 同样，也可能是自己最大的危险。

    dialogue:
    - 林玄：“五年。”
    - 小柒：“嗯。”
    - 林玄：“我准备了五年，却依旧不知道它真正是什么。”
    - 小柒：“你后悔过吗？”
    - 林玄：“没有。”
    - 小柒：“害怕吗？”
    - 林玄沉默片刻。
    - “怕。”
    - “但怕，不代表不做。”

    emotional_focus:
    - 神秘。
    - 敬畏。
    - 坚定。

    mystery:
    - 金色光球来自哪里？
    - 它为什么会选择林玄？
    - 它真正的能力究竟有多强？
    - 它是否存在自己的意志？

    ending:
    - 金色光球缓缓移动。
    - 最终停在不朽机械族尸体前。
    - 林玄抬起头。
    - “开始第一次接触。”

  # =====================================================
  # Scene 05
  # 第一次接触
  # =====================================================

  - id: scene_05
    title: 第一次接触

    goal:
    - 让金色光球第一次正式接触不朽级机械族尸体。
    - 展示金色光球吞噬能力。
    - 制造第一次真正的实验危机。

    location:
    - 绝对封闭实验舱。

    characters:
    - 林玄。
    - 小柒智能子体。
    - 金色光球。
    - 不朽机械族尸体。

    events:
    - 所有实验舱进入最高等级封锁。
    - 火神源晶进入待命状态。
    - 小柒切断所有外部通讯。
    - 林玄确认本尊无法感知实验现场。
    - 金色光球缓缓靠近机械族尸体。
    - 光球与机械族身体接触。
    - 实验舱瞬间出现异常能量波动。
    - 尸体内部大量结构同时出现反应。
    - 金色光球表面出现大量金色纹路。
    - 林玄通过精神联系感知到庞大的生命信息。

    atmosphere:
    - 极度紧张。
    - 压迫。
    - 危险。
    - 神秘。

    key_scene:
    - 金色光球接触尸体的一瞬间。
    - 原本已经死去的不朽机械族身体突然产生了一瞬间的反应。
    - 并不是复活。
    - 而像是某种沉睡了无数年的生命结构被重新触碰。
    - 林玄瞬间警觉。

    dialogue:
    - 小柒：“能量波动异常！”
    - 林玄：“记录。”
    - 小柒：“实验体核心出现微弱响应。”
    - 林玄：“不要干预。”
    - 小柒：“主人，建议停止。”
    - 林玄：“继续。”
    - 小柒：“确认继续。”
    - 林玄：“我需要知道它到底能吞噬什么。”

    emotional_focus:
    - 紧张。
    - 好奇。
    - 危险感。

    mystery:
    - 尸体为什么会产生反应？
    - 金色光球究竟吞噬了什么？
    - 不朽机械族是否真的已经死亡？

    ending:
    - 大量陌生信息突然涌入。
    - 林玄脸色第一次发生变化。
    - 他感受到了一道完全陌生的意识残响。
    - “停。”
    - 金色光球瞬间停止。

  # =====================================================
  # Scene 06
  # 不属于自己的记忆
  # =====================================================

  - id: scene_06
    title: 不属于自己的记忆

    goal:
    - 正式建立人格污染风险。
    - 让林玄第一次感受到不属于自己的记忆。
    - 将本章从实验爽感转化为生命层面的恐惧。

    location:
    - 实验舱。
    - 金色光球融合区域。

    characters:
    - 林玄。
    - 小柒智能子体。

    events:
    - 金色光球停止吞噬。
    - 林玄开始分析刚才接触到的信息。
    - 其中出现陌生战场。
    - 陌生星空。
    - 陌生生命。
    - 陌生语言。
    - 陌生情绪。
    - 林玄确认这些信息并不属于自己。
    - 这些信息来自不朽机械族。
    - 林玄意识到金色光球可能正在接触对方残留的生命信息。
    - 林玄第一次真正意识到融合可能会影响人格。

    atmosphere:
    - 阴冷。
    - 恐怖。
    - 神秘。
    - 压迫。

    key_scene:
    - 林玄闭上眼。
    - 一个陌生视角出现在他的意识中。
    - 他看到一片完全陌生的宇宙。
    - 那不是记忆影像。
    - 而是一种真正“活过”的感觉。
    - 林玄立刻切断精神连接。

    dialogue:
    - 林玄：“刚才的数据。”
    - 小柒：“已经保存。”
    - 林玄：“删除了吗？”
    - 小柒：“没有。”
    - 林玄：“为什么？”
    - 小柒：“因为你刚才命令我完整记录。”
    - 林玄沉默。
    - “很好。”
    - “永远不要擅自删除任何实验数据。”

    emotional_focus:
    - 恐惧。
    - 清醒。
    - 警惕。

    mystery:
    - 这些记忆来自哪里？
    - 不朽机械族是否还残留意识？
    - 金色光球究竟会不会把这些东西带入新生命？
    - 如果融合继续，谁会成为最后的主人格？

    ending:
    - 林玄重新看向尸体。
    - 第一次感觉眼前这个“死人”并没有真正死去。
    - 他缓缓说道：
    - “看来……最麻烦的问题出现了。”

  # =====================================================
  # Scene 07
  # 人格污染
  # =====================================================

  - id: scene_07
    title: 人格污染

    goal:
    - 明确解释人格污染的真正危险。
    - 让读者理解为什么林玄宁愿花五年准备，也不愿直接实验。
    - 强化林玄对“自我”的重视。

    location:
    - 实验数据中心。

    characters:
    - 林玄。
    - 小柒智能子体。

    events:
    - 小柒建立人格融合风险模型。
    - 林玄重新审视吞噬、解析、融合、固化四个阶段。
    - 吞噬意味着获取。
    - 解析意味着理解。
    - 融合意味着重构。
    - 固化意味着最终形成新的生命结构。
    - 最大风险发生在融合阶段。
    - 如果机械族原始人格残留。
    - 那么固化后的生命可能出现双重人格。
    - 也可能产生人格覆盖。
    - 甚至可能出现一个林玄无法控制的新生命。

    atmosphere:
    - 理性。
    - 压迫。
    - 阴沉。

    key_scene:
    - 林玄看着风险模型。
    - 最终删除“实验成功”的字样。
    - 改成：
      “实验结果未知。”

    dialogue:
    - 小柒：“如果原始人格残留呢？”
    - 林玄：“杀掉。”
    - 小柒：“如果它就是你呢？”
    - 林玄沉默。
    - 小柒没有继续说。
    - 林玄最终回答：
    - “那就证明……它不是我。”
    - “我必须保证，最后留下来的那个人是我。”

    emotional_focus:
    - 冷静。
    - 坚定。
    - 恐惧。

    mystery:
    - 林玄如何证明自己才是真正的自己？
    - 记忆是否能够证明人格？
    - 如果两个意识都认为自己是林玄，谁才是真正的林玄？

    ending:
    - 火神源晶状态出现在屏幕中央。
    - “最终毁灭权限：林玄本人。”
    - 林玄确认。

  # =====================================================
  # Scene 08
  # 最后一层保险
  # =====================================================

  - id: scene_08
    title: 最后一层保险

    goal:
    - 正式展示火神源晶。
    - 解释小柒智能子体的真正任务。
    - 完成实验安全体系闭环。
