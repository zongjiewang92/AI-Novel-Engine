    - 决绝。
    - 严肃。

    key_scene:
    - 林玄亲自确认火神源晶启动条件。
    - 他知道这意味着自己未来的分身可能被自己亲手毁掉。
    - 但他依旧没有修改任何条件。

    dialogue:
    - 小柒：“如果检测到人格异常，我会直接启动火神源晶。”
    - 林玄：“不用等我。”
    - 小柒：“包括你无法确认的时候？”
    - 林玄：“包括。”
    - 小柒：“如果那真的是你呢？”
    - 林玄看着她。
    - “如果你都无法判断，那它就不值得留下。”

    emotional_focus:
    - 决绝。
    - 冷酷。
    - 守护。

    mystery:
    - 林玄真的能够亲手毁掉自己的分身吗？
    - 小柒最终会不会执行这个命令？
    - 如果真正的林玄也无法判断自己是谁呢？

    ending:
    - 火神源晶重新进入待机。
    - 红色警示灯逐渐熄灭。
    - 实验舱恢复安静。

