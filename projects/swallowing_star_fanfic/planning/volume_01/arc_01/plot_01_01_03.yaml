    - 她不会以智能生命身份直接参与实验。
    - 一旦检测到人格污染超过阈值。
    - 小柒拥有最高级别毁灭权限。
    - 实验体将被立即销毁。
    - 林玄确认这一权限。
    - 林玄甚至允许小柒在自己无法判断的时候直接执行。

    atmosphere:
