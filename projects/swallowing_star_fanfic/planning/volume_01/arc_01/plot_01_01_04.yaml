    - 林玄：“那就让我自己决定，谁留下。”
    - 小柒沉默。
    - 林玄关闭最后一道实验权限。
    - “准备下一阶段。”

    emotional_focus:
    - 压迫。
    - 坚定。
    - 安心。
    - 悬念。

    mystery:
    - 下一次实验中真正苏醒的究竟会是谁？
    - 灵魂自陨是否真的能够杀死另一个人格？
    - 金色光球会不会出现林玄无法控制的变化？
    - 不朽级机械族生命被吞噬后究竟会发生什么？

    ending:
    - 地球上的实验室重新陷入寂静。
    - 林玄最后看了一眼自己的实验记录。
    - 四年的时间。
    - 无数次金色光球毁灭。
    - 无数次灵魂撕裂。
    - 无数次重新生成。
    - 所有痛苦最终凝聚成一个能力。
    - 灵魂自陨。
    - 林玄关闭记录。
    - 远在一百亿光年之外。
    - 另一艘飞船中，金色光球已经悬浮在那具生命遗骸之前。
    - 两条剧情线在这一刻正式汇合。
    - 林玄低声说道：
      “开始。”
    - 下一阶段剧情开启。