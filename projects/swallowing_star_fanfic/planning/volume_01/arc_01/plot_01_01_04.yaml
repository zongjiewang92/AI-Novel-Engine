# =====================================================
# Plot 04
# 灵魂自陨
# Chapter 005-006
# =====================================================

- id: plot_01_01_04
  title: 灵魂自陨
  chapter_range: 5-6

  goal:
  - 揭示五年计划中真正隐藏的第二条生命保险。
  - 展示林玄过去四年对金色光球、灵魂以及“真灵”的长期研究。
  - 正式引入元烈传授给林玄的灵魂秘术。
  - 展示林玄如何利用金色光球反复自陨与重生来修炼意志。
  - 让读者理解林玄为什么敢于进行机械族分身实验。
  - 建立“灵魂自陨”作为最终人格保险的核心能力。
  - 让金色光球第一次展现出真正恐怖的一面。
  - 通过长期、重复、极端的灵魂痛苦，让林玄的意志发生质变。
  - 建立“肉身可以毁灭，意识可以死亡，但真灵未必等于意识”的核心悬念。
  - 为后续机械族分身人格危机提供最终解决方案。

  theme:
  - 真正的自我究竟存在于意识、灵魂还是更深层的真灵之中。
  - 死亡究竟意味着终结，还是意味着重新选择。
  - 如果能够主动选择死亡，死亡是否还值得恐惧。
  - 强大的意志不是天生拥有，而是在一次次接近崩溃之后磨炼出来的。
  - 金色光球既是林玄最大的依仗，也是他最无法完全理解的未知。
  - 真正的强者不是没有恐惧，而是即使知道恐惧依然选择向前。

  purpose:
  - 给金色光球建立明确的代价体系，避免金手指成为无条件外挂。
  - 让林玄未来面对人格污染时拥有可信的反制手段。
  - 解释林玄为什么能够在极端情况下主动舍弃实验体中的意识。
  - 让林玄的意志达到远超自身生命层次的程度。
  - 为后续机械族分身实验建立最后一道保险。
  - 将“我是谁”从人格问题提升到灵魂与真灵层面的哲学问题。
  - 埋下金色光球真正来源仍然未知的长期伏笔。

  opening_hook:
  - 时间回到四年前。
  - 地球某处绝密实验室内，林玄独自盘坐在实验区域中央。
  - 他的面前悬浮着两颗金色光球。
  - 其中一颗正在高速震颤。
  - 林玄没有阻止。
  - 下一瞬间，金色光球彻底崩碎。
  - 几乎同时，林玄身体微微一震。
  - 没有伤口，没有鲜血，没有任何肉身损伤。
  - 可他的意识却像被整个宇宙从中间撕开。
  - 那一刻，林玄第一次真正理解什么叫做“灵魂疼痛”。
  - 他没有惨叫。
  - 只是死死咬住牙齿，等待那种痛苦过去。
  - 然后说出一句：“记录。”
  - “从这一刻开始，所有变化，一个都不要遗漏。”

  protagonist_state:

    physical_state:
    - 肉身没有明显损伤。
    - 身体生命体征基本稳定。
    - 识海受到巨大冲击。
    - 灵魂本源出现剧烈震荡。
    - 每一次金色光球自陨都会造成持续性的灵魂撕裂痛苦。
    - 金色光球重新生成之前，林玄几乎无法进行正常修炼与行动。
    - 每次重新生成周期接近一个月。
    - 随着实验次数增加，林玄逐渐适应极限痛苦。
    - 肉身恢复能力并不是这一阶段真正的关键，真正被磨炼的是意识与意志。

    mental_state:
    - 极度理智。
    - 疲惫。
    - 痛苦。
    - 对未知保持警惕。
    - 对死亡第一次产生真正意义上的理解。
    - 在长期痛苦中逐渐变得平静。
    - 不再本能排斥死亡。
    - 开始将死亡视为一种可以被研究、被控制、甚至被主动选择的状态。
    - 对金色光球越来越警惕。
    - 最终形成一种近乎冷酷的实验者心态。

  key_scene:
  - 林玄第一次主动尝试让金色光球脱离本尊。
  - 金色光球脱离的瞬间，灵魂撕裂般的痛苦爆发。
  - 林玄发现肉身无法解释这种痛苦。
  - 他开始怀疑金色光球与自己的真灵之间存在直接联系。
  - 林玄利用实验手段成功击碎金色光球。
  - 金色光球内部结构第一次真正暴露在他的观察之下。
  - 林玄发现所谓金色光球并不是单纯能量体。
  - 在极其微小的内部结构中存在特殊的灵魂光点。
  - 这些光点与林玄本尊的灵魂存在某种无法直接切断的联系。
  - 林玄结合自己掌握的灵魂知识，以及元烈留下的灵魂秘术，开始建立自己的“真灵模型”。
  - 他发现普通灵魂秘术无法直接解决金色光球的问题。
  - 他开始尝试将灵魂秘术与金色光球机制结合。
  - 四年时间里，经历无数次失败。
  - 每一次失败都伴随着金色光球的毁灭。
  - 每一次毁灭之后，新的金色光球又从本尊中重新诞生。
  - 林玄终于确认：金色光球并不是简单的“分身”。
  - 它更像是与自己最深层生命本质绑定的一部分。
  - 最终，林玄创造出属于自己的灵魂自陨秘法。

  climax:
  - 林玄完成最后一次实验。
  - 金色光球再次从本尊中分离。
  - 他没有像过去一样观察它自然崩溃。
  - 而是主动寻找金色光球与本尊之间最深层的联系。
  - 林玄按照自己四年来建立的灵魂模型，将意识主动沉入那条联系之中。
  - 他第一次真正触碰到自己所谓的“真灵”。
  - 那一瞬间，林玄感受到一种无法描述的存在。
  - 它不像意识。
  - 不像记忆。
  - 也不像普通意义上的灵魂。
  - 却又与自己存在无法割舍的联系。
  - 林玄没有试图继续解析。
  - 因为他知道自己现在还没有资格。
  - 他只是按照秘法主动切断与实验体之间的意识联系。
  - 金色光球彻底崩碎。
  - 林玄的意识瞬间陷入一片绝对死寂。
  - 那一瞬间，他第一次真正体验到“自己死亡”的感觉。
  - 没有思考。
  - 没有感知。
  - 没有时间。
  - 仿佛整个世界从自己身上被彻底剥离。
  - 可就在意识即将彻底沉寂之前，一点金光重新出现。
  - 第四颗金色光球重新从本尊中生成。
  - 林玄重新恢复意识。
  - 他没有立即说话。
  - 只是静静坐在那里。
  - 足足过了很久。
  - 林玄才低声说道：
    “原来……死亡也可以被自己掌控。”
  - 随后他看向重新出现的金色光球。
  - “那么以后，如果你里面出现的不是我……”
  - “我会亲手把它杀掉。”
  - 这一刻，灵魂自陨秘法真正完成。

  knowledge_unlock:
  - 金色光球并非普通能量体。
  - 金色光球与林玄本尊存在极深层次的生命联系。
  - 金色光球内部存在极其微小的特殊灵魂光点。
  - 林玄将这些特殊灵魂光点暂时命名为“真灵”。
  - 真灵与普通意识、记忆并不完全等同。
  - 金色光球损毁并不代表林玄真正死亡。
  - 金色光球可以在本尊中重新生成。
  - 金色光球的重新生成存在明显的时间间隔。
  - 每次金色光球毁灭都会给林玄带来极其恐怖的灵魂痛苦。
  - 元烈留下的灵魂秘术最高可以修炼到封王无敌层次。
  - 这套灵魂秘术原本来自宇宙星河银行高层强者创造的体系。
  - 元烈为了未来的生死机缘付出了巨大代价兑换到前七层。
  - 即使以宇宙中极其罕见的天才资质，也很难修炼到最高层次。
  - 灵魂秘术真正重要的作用不仅仅是增强灵魂，而是通过主动承受灵魂泯灭之痛，再进行灵魂凝练，从而磨炼意志。
  - 林玄发现自己的金色光球自陨过程，恰好能够形成一种极端的意志磨炼环境。
  - 林玄最终将元烈的灵魂秘术与金色光球机制结合，创造出属于自己的道路。
  - 林玄对真灵的理解仍然极其有限。
  - 金色光球真正的来源依旧是未知。

  ability_unlock:
  - 主动从本尊中分裂金色光球。
  - 主动控制金色光球脱离本尊。
  - 主动击碎金色光球。
  - 观察金色光球内部结构。
  - 感知金色光球与本尊之间的灵魂联系。
  - 初步感知真灵层面的存在。
  - 修炼元烈留下的灵魂秘术。
  - 利用灵魂泯灭痛苦磨炼自身意志。
  - 主动切断实验体与本尊之间的意识联系。
  - 主动施展灵魂自陨。
  - 在极端情况下主动放弃实验体意识。
  - 等待新的金色光球重新从本尊生成。
  - 通过长期极限痛苦，将自身意志提升到远超普通不朽生命的层次。
  - 为未来人格污染准备最终保险。

  emotion_curve:
  - 平静。
  - 好奇。
  - 意外。
  - 剧痛。
  - 恐惧。
  - 疯狂。
  - 麻木。
  - 坚持。
  - 悟道。
  - 平静。
  - 决绝。
  - 强大。

  reader_question:
  - 金色光球到底是什么？
  - 为什么它能够从林玄本尊中重新诞生？
  - 林玄看到的真灵究竟是什么？
  - 真灵是不是生命真正意义上的核心？
  - 如果意识死亡，真灵还存在吗？
  - 金色光球自陨之后重新出现的究竟是不是同一个金色光球？
  - 如果林玄能够杀死实验体中的自己，那么真正的自己究竟在哪里？
  - 林玄为什么愿意一次次承受这种令人绝望的痛苦？
  - 元烈得到的灵魂秘术究竟来自什么层次的强者？
  - 林玄的意志为什么能够在短短几年发生如此恐怖的蜕变？
  - 灵魂自陨真的能够解决未来的意识污染吗？
  - 如果机械族生命根本没有灵魂，那么灵魂自陨究竟能够对它产生什么作用？

  foreshadow:
  - 金色光球真正的来源仍然未知。
  - 真灵的真正本质仍然没有被完全解析。
  - 灵魂自陨只能保证林玄能够主动切断某种意识联系，并不能证明他已经真正理解自己的生命本质。
  - 金色光球未来可能展现出超出林玄理解范围的能力。
  - 元烈留下的灵魂秘术未来仍然可以继续修炼。
  - 林玄如今的意志强度将成为未来突破的重要基础。
  - 机械族没有传统意义上的灵魂，这将成为后续人格问题的关键。
  - 林玄第一次真正触碰到“真灵”，但并没有继续深入，这是一个长期伏笔。
  - 林玄以为自己掌握了死亡，但未来可能发现自己掌握的只是死亡的一部分。
  - 灵魂自陨最终会成为林玄面对人格污染时最重要的底牌之一。

  reader_emotion:
  - 让读者第一次真正感受到金手指并不是无代价外挂。
  - 让读者对林玄反复承受灵魂撕裂产生强烈心疼。
  - 让读者理解林玄的强大来自长期极端磨炼。
  - 让读者对“真灵”产生神秘感。
  - 让读者意识到林玄正在研究的东西已经触及生命本质。
  - 让读者开始期待机械族分身实验。
  - 让读者担心即使拥有灵魂自陨，最终实验依旧可能失控。
  - 在压抑之后给读者一种“林玄终于拥有最后底牌”的安全感。
  - 同时保留更大的未知，为后续剧情继续制造悬念。

  children:

  # =====================================================
  # Scene 01
  # 第一次分裂
  # =====================================================

  - id: scene_01
    title: 第一次分裂

    goal:
    - 第一次展示金色光球可以主动从本尊中分离。
    - 第一次真正展示金色光球损毁带来的灵魂痛苦。
    - 让林玄意识到金色光球与自己的关系远比想象中更加深。
    - 建立后续四年研究的起点。

    location:
    - 地球秘密实验室。
    - 林玄私人实验区域。
    - 最高等级生命研究舱。

    characters:
    - 林玄。
    - 小柒本体智能。

    events:
    - 林玄关闭实验室所有外部通讯。
    - 小柒启动最高等级生命监控。
    - 林玄盘坐在实验中心。
    - 一颗金色光球从意识深处缓缓浮现。
    - 林玄开始尝试主动控制它离开本尊。
    - 金色光球一点点脱离。
    - 林玄第一次感受到强烈的灵魂牵扯。
    - 光球彻底脱离的一瞬间，痛苦骤然爆发。
    - 林玄强行保持清醒。
    - 小柒检测到林玄生命体征正常，却无法解释意识层面的异常。
    - 金色光球开始出现剧烈震荡。
    - 林玄没有让实验停止。
    - 他要求小柒完整记录所有数据。
    - 金色光球最终崩碎。

    atmosphere:
    - 黑暗。
    - 寂静。
    - 压抑。
    - 极度紧张。
    - 灵魂层面的恐怖。

    key_scene:
    - 肉身没有受到任何伤害。
    - 林玄却感觉自己的意识正在被一层层剥离。
    - 不是疼痛从身体某处传来，而是“自己本身”正在疼。
    - 每一个念头都像被撕成碎片。
    - 时间感开始失真。
    - 一秒仿佛被无限延长。
    - 林玄甚至无法确定自己是否还拥有完整的意识。
    - 最恐怖的不是痛苦，而是他能够清晰感受到某个属于自己的东西正在远离自己。
    - 林玄第一次产生一个可怕的念头：
      “如果真正的我就在那个光球里，那么现在留下来的我，又是什么？”

    dialogue:
    - 林玄：“开始记录。”
    - 小柒：“主人，意识波动正在急剧上升。”
    - 林玄：“继续。”
    - 小柒：“这种痛苦可能超过当前预测。”
    - 林玄：“我知道。”
    - 林玄：“不要停止。”
    - 林玄：“把所有变化记录下来。”
    - 林玄：“哪怕最后只剩下一组数据，也必须留下。”

    emotional_focus:
    - 第一次面对未知。
    - 对自身生命本质的恐惧。
    - 极端痛苦中的理智。

    mystery:
    - 金色光球到底连接着林玄的哪一部分？
    - 它为什么能够从林玄本尊中脱离？
    - 光球破碎之后，林玄为什么没有死亡？
    - 真正被破坏的究竟是什么？

    ending:
    - 金色光球彻底崩碎。
    - 实验室恢复安静。
    - 林玄倒在实验台旁。
    - 肉身没有任何伤痕。
    - 可他的意识已经陷入极度虚弱状态。
    - 小柒第一次无法立即判断林玄是否还能够正常恢复。
    - 数小时后，林玄终于睁开眼睛。
    - 他没有询问自己的状态。
    - 第一句话是：
      “数据呢？”
    - 小柒沉默片刻。
    - 将所有数据传输给林玄。
    - 林玄看着那份数据。
    - 轻声说道：
      “重新来一次。”

  # =====================================================
  # Scene 02
  # 真灵之光
  # =====================================================

  - id: scene_02
    title: 真灵之光

    goal:
    - 展示林玄成功击碎金色光球之后的深入解析。
    - 第一次发现光球内部存在特殊灵魂光点。
    - 建立“真灵”这一概念。
    - 让林玄意识到自己以前对金色光球的理解完全不够。

    location:
    - 地球秘密实验室。
    - 超微观生命解析实验区。

    characters:
    - 林玄。
    - 小柒本体智能。

    events:
    - 林玄将第一次实验数据全部保存。
    - 第二次实验开始。
    - 金色光球被主动分离。
    - 林玄尝试在其崩溃瞬间捕捉内部结构。
    - 小柒建立超微观解析模型。
    - 金色光球最终被成功击碎。
    - 一片无法用普通物质解释的微型结构出现。
    - 其中存在大量特殊光点。
    - 光点并不是普通能量。
    - 光点与林玄本尊的灵魂波动存在高度一致性。
    - 林玄开始进行长期比对。
    - 最终暂时将这些东西命名为“真灵光点”。

    atmosphere:
    - 神秘。
    - 科技感。
    - 安静。
    - 探索未知。

    key_scene:
    - 巨大的实验屏幕不断放大。
    - 原本看似空无一物的金色光球内部逐渐出现微观结构。
    - 林玄看到那些微小光点时，没有立即下结论。
    - 他只是不断进行数据比对。
    - 最终发现这些光点与自己的生命信息存在无法解释的对应关系。
    - 林玄低声说出：
      “如果灵魂是河流……”
      “那么这些东西，可能才是河流真正的源头。”
    - 他第一次使用“真灵”这个名字。

    dialogue:
