# =====================================================
# ARC 01
# 开局谜团
# =====================================================

id: arc_01_01
title: 开局谜团
stage: 第一幕：未来幽影

goal:
- 采用倒叙结构，以二十年后的未来作为整部小说开篇，让读者先认识已经成长起来的林玄，再回头寻找他的过去。
- 第一章不解释林玄为什么拥有宇宙飞船、为什么能够进入暗宇宙，而是直接将读者带入一个远超地球时代的未来。
- 建立未来林玄、智能生命小柒、宇宙飞船、金色光球、机械族不朽尸体五个核心元素。
- 明确林玄此次行动并非普通修炼，而是一场准备长达五年的生命实验。
- 建立林玄进行实验的第一原则：本尊安全、地球安全、罗峰主线安全、实验失败后仍然拥有退路。
- 展示林玄为了制造第一具机械族分身，进行了极其漫长、严密且近乎疯狂的准备。
- 建立林玄最大的心理危机：金色光球拥有吞噬、解析、融合生命信息的能力，因此新身体诞生之后，林玄无法确定新身体中的人格究竟属于自己，还是属于被吞噬的不朽级机械族生命。
- 建立“灵魂自陨”作为林玄最后的保险机制，让林玄即使失去对新身体的控制，也能够主动舍弃意识，避免机械族人格反向影响本尊。
- 展示林玄过去四年不断分裂、损毁、重生金色光球的灵魂实验，让读者第一次真正理解金手指并非毫无代价。
- 让读者逐渐发现：林玄真正恐惧的不是死亡，而是“死亡之后，活下来的究竟还是不是自己”。
- 在最后实验中让金色光球出现超出林玄预期的异常，引发时间、记忆、灵魂层面的巨大变化。
- Arc结尾将未来林玄的意识强行拉回二十年前，与地球篇正式连接。
- 第二幕不再从“未来”展开，而是从一个已经死亡的人重新睁开眼睛开始。

theme:
- 死亡并不是生命的终点，而是真相真正开始的地方。
- 一个已经死亡的人，重新寻找真正的自己。
- 力量能够改变命运，却无法回答“我是谁”。
- 真正可怕的不是死亡，而是活下来以后已经不再是自己。
- 科技、生命、灵魂最终都指向同一个问题：生命究竟是什么。
- 强者越接近生命本质，越会发现自己依然无法掌控真正的灵魂。
- 所有力量都必须建立在能够控制风险的基础上。
- 真正的强大不是没有失败，而是失败之后仍然存在退路。
- 林玄的第二次人生，本质上是一场寻找自我的旅程。
- 未来与过去并不是两条独立的时间线，而是彼此纠缠的命运。

purpose:
- 第一卷开篇建立最高等级的悬念。
- 让读者第一次见到林玄时，就知道他已经经历了远超普通人的人生。
- 通过未来强者反向制造过去的神秘感。
- 解释林玄为什么必须制造机械族分身，而不是单纯追求力量。
- 展示林玄为了保护地球、保护本尊、保护罗峰未来而做出的极端准备。
- 建立“安全退路”这一重要人物逻辑，让林玄的谨慎、理智与强大同时成立。
- 建立金色光球“能够从本尊分裂并重新恢复”的特殊机制。
- 建立灵魂自陨秘法，为后续人格、意识、分身、灵魂等剧情提供核心逻辑。
- 让读者看到林玄并不是开着金手指一路碾压，而是在不断试错、不断付出代价。
- 让小柒成为未来长期陪伴林玄的重要角色，同时通过智能子体建立后续分身剧情。
- 为后续宇宙篇埋下机械族、智能生命、暗宇宙、宇宙文明等世界观。
- 将“我是谁”从一句哲学问题转化成真实存在的生命危机。
- 让Arc最后的时间回溯不是单纯的剧情转场，而成为整个故事最大的谜团之一。

protagonist_goal:
- 完成第一次真正意义上的机械族生命分身制造。
- 利用金色光球吞噬并融合不朽级机械族生命的身体与生命结构。
- 在不让原机械族人格侵占自己的前提下，获得一具真正属于自己的新身体。
- 将实验地点彻底与地球隔离，确保实验失控不会波及地球。
- 确保本尊始终处于绝对安全状态。
- 建立可以随时终止实验的灵魂自陨机制。
- 让小柒的智能子体伪装成飞船程序，对新身体进行长期观察。
- 在确认新身体人格属于自己之后，再与本尊建立意识连接。
- 找到金色光球与“真灵”之间真正的关系。
- 找到自己复活的根本原因。
- 最终离开地球，进入真正的宇宙寻找答案。

reader_question:
- 现在的林玄究竟经历了什么？
- 为什么一个地球人能够驾驶宇宙飞船进入暗宇宙？
- 林玄为什么已经如此强大，却依然如此谨慎？
- 为什么这场实验需要准备整整五年？
- 林玄究竟在害怕什么？
- 为什么实验地点必须远离银河系？
- 为什么林玄甚至不愿意让自己的本尊参与实验？
- 金色光球究竟是什么？
- 金色光球为什么能够从林玄本尊中分裂出来？
- 为什么吞噬生命之后会获得对方的记忆？
- 如果吞噬的是一个不朽级机械族生命，醒来的到底是谁？
- 林玄为什么害怕自己的新身体拥有原机械族人格？
- 如果新身体人格发生变化，会不会反过来影响林玄本尊？
- 为什么林玄需要创造灵魂自陨秘法？
- 林玄这五年到底经历了多少次失败？
- 小柒为什么如此了解林玄？
- 小柒的智能子体到底是什么？
- 为什么飞船上存在一枚足以毁灭实验体的火神源晶？
- 林玄为什么如此重视地球的安全？
- 林玄为什么认为自己的失败可能影响罗峰？
- 金色光球最后发生了什么？
- 为什么实验结束后，林玄会重新回到二十年前？
- 二十年前的那个死亡，究竟是不是第一次死亡？

reveal:
- 林玄已经进入真正的宇宙时代。
- 林玄拥有能够进入暗宇宙的宇宙飞船。
- 林玄身边存在一个高级智能生命小柒。
- 小柒拥有俏皮、好奇、话痨的一面，同时拥有原智能生命完整记忆。
- 林玄已经研究金色光球多年。
- 林玄已经能够主动从本尊中分离金色光球。
- 林玄计划利用金色光球制造自己的第一具机械族生命分身。
- 分身材料来自一具不朽级机械族生命尸体。
- 吞噬融合过程中存在人格污染风险。
- 林玄已经提前准备了完整的实验隔离方案。
- 飞船将以二十倍光速进入暗宇宙。
- 飞船将在暗宇宙中连续飞行五年。
- 经过五年远离银河系的航行后，林玄会主动放弃这艘高速飞船。
- 林玄准备了一艘最低级、只能进行极低倍速暗宇宙航行的小型飞船作为最终实验地点。
- 小柒的智能子体将伪装成飞船本身的普通控制程序。
- 飞船上安装了火神源晶作为最终毁灭保险。
- 林玄在地球本尊上留下其他金色光球。
- 本尊与其他金色光球持续进行解析实验。
- 林玄已经研究灵魂自陨整整四年。
- 金色光球曾经无数次损毁，再从本尊中重新分裂。
- 林玄已经亲身体验过灵魂撕裂般的痛苦。
- 林玄最终创造出属于自己的灵魂自陨秘法。
- 林玄已经拥有在极端情况下主动舍弃实验体意识的能力。
- 最终实验正式启动。
- 金色光球在实验过程中出现无法解释的异常。

hide:
- 金色光球真正来源。
- 金色光球为什么能够从林玄本尊中分裂。
- 金色光球与林玄“真灵”的真正关系。
- 林玄第一次死亡的真正原因。
- 二十年前金色光芒降临地球的真正原因。
- 林玄复活究竟是偶然、因果还是某种更高层次力量的安排。
- 小柒原本究竟属于什么智能生命。
- 小柒为什么能够保留前一代智能生命的完整记忆。
- 不朽级机械族尸体究竟从何而来。
- 巴巴塔为什么能够得到这具机械族尸体。
- 机械族生命原本的意识究竟残留了多少。
- 金色光球吞噬记忆的真正机制。
- 灵魂自陨是否真的能够彻底切断人格。
- 如果林玄舍弃实验体意识，真正的“林玄”是否仍然存在。
- 为什么未来的罗峰与整条时间线会成为林玄必须考虑的变量。
- 罗峰未来究竟会成长到怎样的层次。
- 林玄真正面对的敌人究竟来自哪里。
- 源星文明与林玄之间的真正关系。
- 死域的真正来源。
- 为什么宇宙中已经存在某些未知存在关注地球。

foreshadow:
- 林玄在飞船上反复确认“本尊状态正常”。
- 小柒准备大量失败预案，而不是单纯准备成功方案。
- 飞船上存在第二套完全独立的逃生系统。
- 飞船离开银河系后将被主动销毁。
- 最终实验飞船只有极低级的暗宇宙航行能力。
- 火神源晶成为最后一道毁灭保险。
- 小柒智能子体始终保持伪装状态。
- 实验过程中禁止本尊直接连接实验体。
- 林玄曾经经历大量金色光球损毁。
- 每次金色光球损毁都伴随着无法想象的灵魂撕裂痛苦。
- 林玄已经习惯在最坏结果发生之前准备最坏方案。
- 林玄提到“我不能死第二次”，但不解释真正含义。
- 林玄曾经在记忆中看到过自己没有经历过的场景。
- 金色光芒在实验过程中再次出现。
- 实验设备最终检测到时间维度异常。
- 林玄的意识最终坠入二十年前。
- “死亡”与“复活”将成为贯穿整部小说的核心谜题。
- 未来的林玄与二十年前的林玄之间可能存在某种无法解释的联系。

emotion_curve:
- 神秘：黑暗宇宙中，一艘孤独飞船以远超光速的速度航行。
- 震撼：透明观景窗前出现未来林玄，读者第一次看到成长后的主角。
- 温暖：小柒出现，以俏皮、话痨的方式打破未来时代的压迫感。
- 好奇：五年计划逐渐揭开，但真正目标依旧隐藏。
- 压迫：读者发现林玄竟然准备了如此多的失败方案。
- 震撼：不朽级机械族尸体出现。
- 恐惧：林玄坦白真正危险不是死亡，而是人格发生改变。
- 悲壮：四年灵魂实验的痛苦逐渐展现。
- 敬畏：林玄一次次主动分裂金色光球，只为了找到一条能够活下来的路。
- 紧张：最终实验正式开始。
- 震撼：金色光球出现异常。
- 恐惧：林玄意识开始失控。
- 宿命：二十年前的记忆重新苏醒。
- 期待：一个已经死去的人，即将在过去重新睁开眼睛。

knowledge_unlock:
- 地球已经进入宇宙时代。
- 人类已经掌握暗宇宙航行技术。
- 普通宇宙空间与暗宇宙之间存在巨大的航行距离倍率差。
- 暗宇宙与原宇宙的距离比例约为1:1008.6。
- 飞船可以通过超过光速进入暗宇宙。
- 未来人类已经能够获得宇宙级飞船。
- 宇宙中存在不朽级机械族生命。
- 机械族拥有与人类完全不同的生命形态。
- 智能生命可以拥有独立人格与记忆。
- 智能生命可以制造智能子体。
- 生命融合不仅涉及肉身，还涉及记忆、意识与灵魂。
- 金色光球能够参与生命融合。
- 吞噬生命可能同时获得对方记忆。
- 灵魂可能存在独立于肉身的更深层结构。
- 林玄将这种最核心的生命本质称为“真灵”。
- 灵魂可以通过特殊秘法进行主动切断。
- 火神源晶能够作为极端情况下的毁灭保险。
- 罗峰未来可能成为影响整个宇宙时代的重要存在。
- 林玄的行为必须考虑对罗峰未来以及地球未来的影响。

ability_unlock:
- 林玄能够主动从本尊中分离金色光球。
- 金色光球可以在脱离本尊后独立存在。
- 金色光球能够吞噬生命物质。
- 金色光球能够解析生命结构。
- 金色光球能够融合生命信息。
- 金色光球能够重新固化生命形态。
- 林玄已经掌握不朽级机械族生命融合实验技术。
- 林玄已经掌握灵魂自陨秘法。
- 林玄能够在极端情况下主动舍弃实验体意识。
- 小柒能够制造具有独立运行能力的智能子体。
- 小柒智能子体能够伪装成普通飞船控制程序。
- 林玄能够利用飞船完成超光速暗宇宙航行。
- 林玄能够建立多重实验安全隔离层。

next_arc_hook:
- 最终实验启动。
- 金色光球与不朽级机械族生命正式融合。
- 实验体内部出现无法解释的生命波动。
- 小柒智能子体检测到人格结构异常。
- 林玄尝试启动灵魂自陨秘法。
- 金色光芒突然覆盖整个意识空间。
- 林玄的意识被强行拖入一段尘封二十年的记忆。
- 黑暗、废墟、鲜血重新出现。
- 一座倒塌的建筑压住年轻的林玄。
- 一个已经死亡二十年的人，重新睁开眼睛。
- 第二幕《死域复苏》正式开始。


children:

# =====================================================
# Plot 01
# 未来强者
# Chapter 001
# =====================================================

- id: plot_01_01_01
  title: 未来强者
  chapter_range: 1

  goal:
  - 以极具视觉冲击力的暗宇宙场景开启全文。
  - 第一次正式展示二十年后的林玄。
  - 让读者感受到林玄已经站在远超地球时代的生命层次。
  - 建立林玄第一次离开银河系、前往宇宙的重大历史感。
  - 引入小柒，但暂时不解释其完整来历。
  - 让“准备了五年”成为第一章核心悬念。
  - 第一章结束时不解释实验内容，只告诉读者：林玄正在前往一个可能改变自己命运的地方。

  theme:
  - 第一次真正踏入宇宙。
  - 强者面对未知。
  - 向往与谨慎并存。
  - 一个已经经历死亡的人再次面对未知。
  - 宇宙真正向林玄打开。

  purpose:
  - 用未来林玄建立读者对主角的第一印象。
  - 用宏大的宇宙尺度压缩地球时代的狭小感。
  - 通过林玄眼中的星空建立“向往”而不是单纯“恐惧”。
  - 让读者产生“他到底经历了什么”的问题。
  - 用小柒调节开场过于沉重的气氛。
  - 用“五年”建立整个Arc的时间悬念。

  opening_hook:
  - 黑暗并不是夜空，而是一片真正没有星辰的空间。
  - 一艘银灰色飞船突然从黑暗中掠过。
  - 飞船速度已经超越普通宇宙航行的理解。
  - 船体内部灯光亮起，一个男人站在透明观景窗前。
  - 男人没有兴奋喊叫，而是安静地看着远方。
  - 五年前，他还不知道自己能不能走到今天。
  - 今天，他终于真正离开银河系。
  - 一道轻快的声音打破沉默：“林玄，你再这么看下去，星星也不会自己跑过来跟你打招呼。”

  protagonist_state:
    physical_state:
    - 林玄身体已经完成长期修炼与生命层次提升。
    - 肉身远超普通地球生命。
    - 精神状态保持高度稳定。
    - 身体没有明显伤势。
    - 身上没有携带明显战斗装备。
    - 当前处于完全放松但随时能够战斗的状态。

    mental_state:
    - 激动。
    - 向往。
    - 镇定。
    - 对真正宇宙文明的期待。
    - 对未知的谨慎。
    - 内心深处仍然保留普通科学家第一次仰望宇宙时的好奇。
    - 对过去已经死亡过一次的人生存在复杂感情。

  key_scene:
  - 林玄独自站在巨大透明观景窗前。
  - 银河系逐渐被甩在身后。
  - 他第一次以真正意义上的宇宙生命身份观察这片星空。
  - 小柒突然出现，用俏皮话打破他的沉默。
  - 林玄没有责怪，而是露出一个很久没有出现过的笑容。
  - 这一刻让读者看到未来林玄并不是一个冰冷无情的强者。

  climax:
  - 飞船系统提示：“暗宇宙航行稳定。”
  - 林玄看向银河系所在的方向。
  - 他知道自己正在离地球越来越远。
