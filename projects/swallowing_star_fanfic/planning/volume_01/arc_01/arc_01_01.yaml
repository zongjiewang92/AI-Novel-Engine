  - 而是主动切断与本尊之间最深层的联系。
  - 金色光球消失。
  - 林玄的意识瞬间陷入死寂。
  - 数秒后，金色光球重新从本尊中诞生。
  - 林玄睁开眼睛。
  - 他终于确定：
    自己可以主动“杀死”实验体中的自己。
  - 林玄低声说道：
    “如果连死亡都由我自己决定……”
  - “那至少最后留下来的，必须是我。”

