  - 展示林玄过去四年对金色光球和真灵的解析。
  - 展示无数次金色光球损毁与重新分裂的痛苦。
  - 让读者真正理解林玄为什么敢进行最终实验。
  - 建立灵魂自陨作为最后保险。
  - 将“我是谁”从悬念升级为生命本质问题。

  theme:
  - 灵魂可以被撕裂吗。
  - 真正的自我究竟存在于哪里。
  - 活着是否一定比死亡更重要。
  - 选择死亡是否也是一种掌控命运。

  purpose:
