id: arc_01_01
title: 复生之始
stage: 第一幕
goal: >
  主角林玄完成复生。 从死亡状态重新获得意识，经历漫长灵魂撕裂痛苦， 重新建立自己的主人格。 通过回忆确认自己的身份， 发现自己获得大量未知生命记忆。 同时发现梦中的《吞噬星空》世界可能是真实未来。 本幕重点建立： 新生、自我认知、孤独、未知、修心主题。
theme:
- 新生
- 孤独
- 自我
- 未知
- 修心
purpose:
- 建立主角林玄人格
- 展示复生过程
- 建立金色光球悬念
- 建立吞噬能力伏笔
- 埋下未来宇宙世界观
- 埋下修心成长主线
protagonist_goal: >
  搞清楚自己是谁。 搞清楚自己为什么复活。 搞清楚脑海中陌生生命记忆的来源。
reader_question:
- 林玄为什么会复活？
- 金光到底是什么？
- 为什么选择地下枯骨？
- 金色光球有什么作用？
- 为什么林玄拥有其他生命记忆？
- 梦中的《吞噬星空》是否是真实未来？
reveal:
- 林玄已经死亡一次
- 林玄通过未知力量重新复生
- 复生过程持续超过正常生命认知
- 地球已经进入怪兽时代
- 林玄脑海中拥有三个未知暗金色光球
- 梦中的吞噬星空世界与现实高度相似
hide:
- 金光真正来源
- 四滴血液秘密
- 第四颗金色光球去向
- 浑源生命存在
- 金球真正权限
- 吞噬、解析、融合、固化完整能力
- 分身真正机制
foreshadow:
- 阿柒
- 罗峰
- 修心体系
- 信息污染
- 无限浑源空间
- 金球成长
- 主人格保护机制
emotion_curve:
- 死亡后的孤寂
- 神秘
- 恐怖
- 灵魂痛苦
- 疯狂边缘
- 清醒
- 希望
knowledge_unlock:
- 确认自己死亡
- 确认自己正在复生
- 确认时间已经改变
- 确认主人格为林玄
- 确认梦中未来可能真实存在
- 确认脑海存在三个未知金球
ability_unlock:
- 意识恢复
- 内视能力
- 感知身体结构
- 初步感知金色光球
next_arc_hook:
- 林玄终于恢复身体控制能力。
- 他发现自己身处一个巨大暗红色生命茧中。
- 为了寻找答案， 他决定破开生命茧， 重新回到已经改变的地球。
children:
# =====================================================
# Chapter 01
# 金光降临与十年吞噬
# =====================================================
- id: plot_01_01_01
  title: 金光降临
  chapter_range: 1
  goal:
  - 描述林玄死亡后的世界。
  - 一道神秘金光穿透地球， 降临地下深处。
  - 金光进入一具已经死亡多年的枯骨， 开始无法理解的生命重构。
  events:
  - 林玄死亡后的意识消散
  - 地球地下空间描写
  - 神秘金光出现
  - 金光进入枯骨
  - 枯骨开始产生生命变化
  - 骨骼重新恢复活性
  conflict:
  - 死亡与新生的冲突
  mystery:
  - 金光来自哪里
  - 为什么选择这具枯骨
  - 这是否是一场偶然
# =====================================================
# Chapter 02
# 十年吞噬与灵魂重塑
# =====================================================
- id: plot_01_01_02
  title: 亿万年痛苦中的意识
  chapter_range: 2
  goal:
  - 展现金色力量不断扩散。
  - 从吞噬枯骨开始， 范围逐渐扩大。
  - 最终形成千米范围生命禁区。
  - 同时林玄意识在漫长痛苦中逐渐恢复， 依靠数字维持最后的自我。
  events:
  - 吞噬一米范围生命
  - 范围扩大到十米
  - 范围扩大到百米
  - 范围扩大到千米
  - 植物死亡
  - 昆虫进入后化为灰烬
  - 千米死域形成
  spiritual_process:
  - 灵魂撕裂
  - 意识无数次昏迷
  - 数字成为唯一支撑
  - 不断重新开始计数
  - 痛苦逐渐降低
  key_scene:
  - >
    林玄意识中不断重复： "846297896" "846297897"
  emotional_focus:
  - 意志
  - 坚持
  - 孤独
  - 不屈
# =====================================================
# Chapter 03
# 我是谁
# =====================================================
- id: plot_01_01_03
  title: 新生人格与科学家林玄
  chapter_range: 3
  goal: >
    林玄第一次真正恢复意识。 面对大量陌生生命记忆， 开始怀疑自己的身份。 通过回忆确认自己是林玄， 建立主人格。
  events:
  - 痛苦消失
  - 林玄第一次拥有完整意识
  - 感受到身体存在
  - 大量生命记忆涌入
  - 怀疑自己精神异常
  key_questions:
  - 我是谁？
  - 为什么我记得蚯蚓？
  - 为什么我记得昆虫？
  - 为什么我记得植物？
  conflict:
  - 自我认知危机
  memories:
  - 1992年出生
  - 天生左腿残疾
  - 被遗弃经历
  - 智力超群
  - 投身生物科研
  - RR病毒研究
  - 怪兽战争前死亡
  character_focus:
  - 林玄孤独的人生
  - 科学家的执着
  - 改变命运的愿望
  - 强大意志来源
  ending_scene: >
    林玄终于确定： "我是林玄。" "那些记忆不是我的人生。" "但现在的我，也是真实存在的我。"
# =====================================================
# Chapter 04
# 梦中吞噬星空与暗金光球
# =====================================================
- id: plot_01_01_04
  title: 未来世界的梦
  chapter_range: 4
  goal: >
    林玄整理死亡前后的所有记忆。 发现自己曾经经历过一个漫长梦境。 梦境中存在一本名为《吞噬星空》的小说。 而小说中的世界， 正与现实高度重合。
  events:
  - 回忆死亡前的梦境
  - 发现病毒时间线一致
  - 发现怪兽时代一致
  - 发现罗峰存在可能
  - 发现未来宇宙文明
  timeline_confirm:
  - 2003年SARS病毒
  - 2009年H1N1病毒
  - 2013年R病毒
  - 2015年RR病毒
  - 2015年至2021年怪兽战争
  reveal:
  - >
    《吞噬星空》可能不是一本小说。
  - >
    而是一段未来信息。
  mystery:
  - 谁让自己看到未来？
  - 自己的复生是否与未来有关？
  - 罗峰是否真的存在？
  ability_scene:
  - 意识观察身体
  - 观察皮肤
  - 观察细胞
  - 观察DNA
  - 观察分子
  - 观察原子
  - 观察更微小粒度失败
  golden_ball_scene:
  - 发现三个暗金色光球
  - 光球不断旋转
  - 光球吸收未知微小粒子
  ending_scene: >
    
    林玄沉默许久。 "如果那个世界是真的……" "那么我的重生，又意味着什么？" 他低头。 意识深处。 三颗暗金色光球缓缓旋转。 仿佛等待着他的探索。
