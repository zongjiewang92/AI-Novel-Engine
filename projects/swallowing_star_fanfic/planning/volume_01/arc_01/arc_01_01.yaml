id: arc_01_01
title: 开局谜团
stage: 第一幕：未来幽影

goal:
  - 采用倒叙结构，以未来时间线作为全书开篇，第一章即制造最高级悬念。
  - 首先塑造未来林玄，而不是过去林玄，让读者先认识最终成长后的主角。
  - 建立宇宙飞船、小柒、机械族尸体、未知生命实验之间的联系。
  - 展示林玄第一次制造分身的能力，却仍然无法解决自身最大的危机。
  - 不解释任何核心秘密，只不断提出新的问题。
  - 在章节结尾切回二十年前，正式进入主线故事。
  - 建立整部小说"寻找真相"而非"升级打怪"的核心驱动力。

theme:
  - 死亡并不是生命的终点。
  - 真相永远比力量更加重要。
  - 一个已经死亡的人，重新寻找真正的自己。
  - 强者背后的孤独与代价。
  - 人类文明与宇宙文明第一次真正接触。
  - 未来与过去的交错。
  - 一个死亡之人的第二次人生。
  - 强者背后的代价。
  - 探索未知宇宙的勇气。

purpose:
  - 第一章建立整本书最大的悬念。
  - 先塑造未来，再回到过去，形成强烈反差。
  - 让读者产生对于林玄过去经历的强烈兴趣。
  - 展示主角不是普通穿越者，而是背负巨大秘密的人。
  - 建立林玄、小柒、宇宙飞船三者之间的核心关系。
  - 建立未来宇宙时代的世界尺度。
  - 引出机械生命、智能生命、宇宙文明等后续体系。
  - 埋下机械族、不朽尸体、智能生命等长期伏笔。
  - 让读者期待回到二十年前寻找答案。
  - 让读者相信未来一定发生了极其精彩的故事。
  - 形成第一篇首尾呼应结构。

protagonist_goal:
  - 完成准备五年的最终实验。第一次主动吞噬融合不朽级机械族生命，尝试制造第一分身。
  - 解决吞噬能力带来的记忆污染问题。
  - 找到自己真正复生的原因。
  - 活着进入宇宙寻找最终答案。

reader_question:
  - 林玄为什么已经成为地球最强者，却仍然执着寻找答案？
  - 他究竟经历了什么？
  - 小柒到底是什么生命？
  - 飞船中的尸体究竟是谁？
  - 为什么机械族尸体能够解决林玄的问题？
  - 林玄为什么说自己"已经死过一次"？
  - 吞噬能力究竟是什么？
  - 五年前到底发生了什么？
  - 林玄为什么会出现在二十年后的世界？
  - 二十年前到底发生了什么？
  - 一个已经死亡的人为什么还能活着？
  - 飞船中的未知生命尸体是谁？
  - 林玄为什么需要机械族不朽尸体？
  - 小柒究竟是什么存在？
  - 林玄口中的失败，会带来什么后果？

reveal:
  - 林玄已经站在地球巅峰。
  - 林玄拥有宇宙飞船，可以进入暗宇宙。
  - 林玄拥有高级智能生命小柒辅助。
  - 林玄长期研究机械生命。
  - 林玄一直受到记忆污染困扰。
  - 这场实验已经准备五年。
  - 林玄正在研究一种能够改变生命形态的实验。
  - 林玄已经准备这次计划五年。
  - 林玄曾经经历过一次无法解释的死亡。

hide:
  - 林玄真正死亡时间。
  - 林玄如何复活。
  - 小柒真实身份。
  - 飞船尸体身份。
  - 死域来源。
  - 源星文明真正历史。
  - 死域形成原因。
  - 机械族尸体的来源。
  - 林玄与源星文明的关系。

foreshadow:
  - 飞船中的机械族尸体。
  - 小柒提前准备的失败方案。
  - 林玄不断出现的记忆断层。
  - ‘我到底是谁’这一核心命题。
  - 金光未来降临。
  - 源星文明遗迹。
  - 宇宙中已经有人注意地球。
  - 林玄未来将离开地球。
  - 飞船中的机械族尸体。
  - 林玄对于“记忆污染”的担忧。
  - 源星文明遗留力量。
  - 宇宙中未知强者关注地球。
emotion_curve:
- 神秘：
  - 宇宙飞船启动，未知任务开启。
- 震撼：
  - 展示未来地球强者林玄。
- 紧张：
  - 小柒说明任务成功率未知。
- 压迫：
  - 林玄面对可能死亡的实验。
- 好奇：
  - 飞船内部出现未知尸体。
- 疑惑：
  - 时间回到二十年前。
- 期待：
  - 开始揭开林玄死亡秘密。

knowledge_unlock:
  - 暗宇宙概念。
  - 宇宙飞船存在。
  - 智能生命存在。
  - 机械生命存在。
  - 地球已经进入宇宙时代。
  - 武者能够离开地球探索宇宙。
  - 宇宙文明远超地球。
  - 生命可以进行机械融合。

ability_unlock:
  - 林玄拥有恒星级以上气息。
  - 强大的精神念力。
  - 宇宙级飞船控制权限。
  - 智能生命辅助系统。
  - 精神扫描能力。
  - 生命融合技术。
  - 超越普通武者的心境。

next_arc_hook:
  - 时间倒流至二十年前。
  - 林玄仍然只是普通科学家。
  - RR病毒爆发。
  - 怪兽时代降临。
  - 建筑倒塌。
  - 一道金光穿越时空。
  - 一个已经死亡的人重新睁开眼睛。

