  - 避免金色光球成为无条件外挂。
  - 建立林玄对自己能力的深层理解。
  - 让最终实验具备可信的成功条件。
  - 为最终人格危机建立真正的解决方案。

  opening_hook:
  - 故事从现在切回四年前。
  - 一个林玄从自己意识中分裂出来的金色光球正在剧烈震颤。
  - 下一刻，它彻底崩碎。
  - 林玄跪倒在地。
  - 那不是身体上的疼痛。
  - 而像是自己的灵魂被一只无形的手从身体内部一点一点撕开。

  protagonist_state:
    physical_state:
