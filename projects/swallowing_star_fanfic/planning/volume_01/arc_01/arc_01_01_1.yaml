# =====================================================
# Plot 01
# 未来强者
# Chapter 001
# =====================================================

- id: plot_01_01_01
  title: 未来强者
  chapter_range: 1

  goal:
  - 展示未来时间线。
  - 建立林玄未来强者身份。
  - 建立宇宙时代背景。
  - 制造第一个核心悬念，让读者产生对林玄过去的兴趣。

  events:
  - 黑暗宇宙空间中，一艘银灰色宇宙飞船以20倍光速向着目的地航行着。
  - 飞船周围没有任何星球，只有无尽的暗宇宙黑暗。
  - 飞船内部控制大厅开启。
  - 一个男人独自站在巨大观景窗前。手中还有一个金色光球，忽明忽暗的发出一些光芒，又好似在不停地吞噬一些光芒。
  - 镜头视线后移，飞船大厅中有一个巨大的棺椁，里面躺着一具尸体，胸口处有一道贯穿伤口，好像是被人一把掏掉了心脏。这具尸体仿佛已经死亡了无数年。【这里AI进行场景拓展写作，描写飞船大厅的空旷，以及尸体，等等】
  - 视线继续左移，有一个透明金属方盒，里面有一个半米左右的长梭形火红色晶体，似乎有无穷的力量积蓄在其中。【这里AI进行扩写，描述其蕴含的恐怖威力，这是一颗火神源晶，爆炸之后瞬间释放的能量可以灭杀封侯不朽】
  - 林玄看着遥远星辰，确认最后一次任务坐标，四角座星系，奇洛星附近，这个星球上有虚拟宇宙的界主级强者，如计划出问题，可以借助虚拟宇宙的力量减少计划失控对人类的损失。
  - 飞船自动扫描周围宇宙环境。
  - 智能系统报告航行状态。
  - 小柒【这里是小柒的智能子体】报告到：“预计还有10天到达奇洛星球附近，到时候便可以进行下一步了。”
  - 林玄[这里不是林玄本尊，是全息投影，这艘C级飞船上没有任何生命]没有任何激动，只表现出经历无数岁月后的平静。
  - 读者第一次认识未来的林玄。

  spiritual_process:
  - 展示未来林玄经历无数磨难后的成熟心境。
  - 表现他已经习惯独自面对未知。
  - 暗示林玄曾经失去过重要东西。
  - 表现一个强者面对死亡时的平静。
  - 埋下林玄对于生命意义的思考。

  key_scene:
  - 林玄站在飞船观景窗前。
  - 无数星辰倒映在他的眼中。
  - 他低声说道：
    "准备了五年，终于到了这一天。"

  emotional_focus:
  - 神秘。
  - 震撼。
  - 孤独。
  - 压迫感。

  conflict:
  - 林玄即将执行一项成功率未知的危险计划。
  - 失败意味着失去现在拥有的一切。

  mystery:
  - 林玄为什么拥有宇宙飞船？
  - 林玄为什么需要准备五年？
  - 这次任务到底是什么？

