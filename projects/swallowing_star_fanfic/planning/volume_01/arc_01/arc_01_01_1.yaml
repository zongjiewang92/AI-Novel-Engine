id: arc_01_01
title: 开局谜团
stage: 第一幕：未来幽影

goal:
  - 采用倒叙结构，以未来时间线作为全书开篇，让读者先认识未来的林玄，再寻找过去的林玄。
  - 第一章即建立整部小说最高等级悬念，不解释答案，而是不断提出新的问题。
  - 塑造已经成长为地球巅峰强者的林玄，建立成熟、冷静、孤独而神秘的第一印象。
  - 建立林玄、小柒、宇宙飞船、机械族尸体之间的核心关系。
  - 展示林玄已经拥有改变生命形态的能力，却仍然无法解决自身最大的危机。
  - 建立"寻找真相"而不是"获得力量"作为整部小说真正的主线。
  - 让读者相信未来一定发生了极其精彩的故事，从而期待回到过去寻找答案。
  - Arc结束时，以实验启动为高潮，让林玄的意识重新回到二十年前，为第二幕正式展开做准备。

theme:
  - 死亡并不是生命的终点，而是真相的开始。
  - 一个已经死亡的人，重新寻找真正的自己。
  - 力量可以改变命运，但真相才能定义自我。
  - 强者越接近巅峰，越会发现自身的渺小。
  - 科技、生命与灵魂，本质上属于同一种探索。
  - 未来与过去彼此影响，命运形成闭环。
  - 每一次成长，都伴随着无法承受的代价。
  - 真正可怕的敌人，并不是未知文明，而是遗忘的过去。

purpose:
  - 第一卷开篇即建立整部小说最大的阅读驱动力。
  - 先展示故事终点，再引导读者寻找故事起点。
  - 塑造未来林玄的人格魅力，使读者愿意陪伴他重新走完过去的人生。
  - 建立宇宙飞船、小柒、机械族尸体、记忆污染四条长期主线。
  - 埋下机械生命、智能生命、源星文明、暗宇宙等世界观伏笔。
  - 让读者始终保持"为什么"的阅读欲望，而不是"接下来发生什么"。
  - 展现未来世界尺度，提高整部小说的格局。
  - 为林玄第二次人生提供完整的目标与动力。

protagonist_goal:
  - 完成准备五年的最终实验。
  - 主动吞噬融合机械族不朽生命，尝试制造自己的第一具机械族分身。
  - 修复吞噬能力造成的记忆污染。
  - 找到自己真正死亡与复生的原因。
  - 破解未知生命遗留的信息。
  - 活着离开地球，进入真正的宇宙寻找最终答案。

reader_question:
  - 林玄为什么已经站在地球巅峰，却仍然执着寻找真相？
  - 他究竟经历了怎样的人生？
  - 林玄为什么说自己已经死过一次？
  - 小柒究竟是什么存在？
  - 飞船中的未知尸体究竟是谁？
  - 为什么机械族尸体能够帮助林玄？
  - 吞噬能力究竟来自哪里？
  - 记忆污染为什么越来越严重？
  - 五年前究竟发生了什么？
  - 林玄真正害怕的到底是什么？
  - 为什么整个计划只能成功，不能失败？
  - 林玄最终要寻找的答案究竟是什么？

reveal:
  - 林玄已经成为地球最顶尖强者之一。
  - 林玄拥有能够进入暗宇宙的宇宙飞船。
  - 林玄拥有高级智能生命小柒长期协助。
  - 林玄已经研究机械生命多年。
  - 林玄正在进行改变生命形态的重要实验。
  - 林玄一直受到记忆污染困扰。
  - 整个计划已经准备五年。
  - 林玄已经能够制造生命层次上的突破，但依旧无法解决自己的根本问题。

hide:
  - 林玄真正死亡的时间与地点。
  - 林玄如何重新获得生命。
  - 金色灵魂球的存在。
  - 吞噬能力真正来源。
  - 小柒真正身份。
  - 飞船中机械族尸体真正来历。
  - 记忆污染真正原因。
  - 源星文明与林玄之间真正关系。
  - 死域形成原因。
  - 为什么宇宙中有人一直关注地球。

foreshadow:
  - 五年前发生的一场重大失败。
  - 林玄不断恶化的记忆污染。
  - 小柒提前准备的大量失败预案。
  - 飞船中的机械族不朽尸体。
  - 林玄第一次制造机械族分身计划。
  - 金色光芒将在未来重新出现。
  - 源星文明留下的重要遗产。
  - 宇宙深处某位存在已经注意到林玄。
  - 林玄真正身份并没有他自己认为的那么简单。
  - 实验结束后，过去的记忆将重新苏醒。

emotion_curve:
  - 神秘：黑暗宇宙中，一艘孤独飞船缓缓航行。
  - 震撼：未来强者林玄首次登场。
  - 温暖：林玄与小柒轻松交流，展现多年伙伴关系。
  - 好奇：五年计划逐渐浮出水面。
  - 压迫：实验风险远超预期，没有第二次机会。
  - 震惊：机械族不朽尸体出现。
  - 疑惑：林玄出现越来越严重的记忆异常。
  - 恐惧：飞船识别出林玄未知身份。
  - 悲壮：林玄决定赌上一切启动实验。
  - 期待：意识坠入过去，真正故事即将开始。

knowledge_unlock:
  - 地球已经进入宇宙时代。
  - 暗宇宙是真实存在的航行方式。
  - 人类已经能够制造宇宙飞船。
  - 智能生命能够独立成长与思考。
  - 机械生命拥有完整生命体系。
  - 武者能够突破地球，探索宇宙。
  - 生命可以通过特殊方式完成融合。
  - 宇宙中存在远超地球文明的势力。
  - 地球隐藏着尚未揭开的巨大秘密。

ability_unlock:
  - 林玄拥有恒星级以上强者气息。
  - 林玄拥有极强精神念力。
  - 林玄拥有远超普通人的精神意志。
  - 林玄能够操控宇宙级飞船。
  - 小柒拥有高级智能生命辅助能力。
  - 林玄已经掌握机械生命融合技术。
  - 林玄拥有制造第一具机械族分身的能力。
  - 林玄拥有远超普通武者的生命层次认知。

next_arc_hook:
  - 实验正式启动。
  - 林玄意识开始崩溃。
  - 无数陌生记忆疯狂涌现。
  - 一段尘封二十年的过去重新打开。
  - 一个早已死亡的人，再一次睁开双眼。
  - 第二幕《死域复苏》正式开始。


