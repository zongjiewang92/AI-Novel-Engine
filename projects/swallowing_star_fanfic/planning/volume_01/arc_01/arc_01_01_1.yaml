- id: plot_01_01_04
  title: 不属于自己的记忆
  chapter_range: 4

  goal:
  - 深入展示林玄最大的隐患：吞噬能力带来的记忆污染。
  - 让读者第一次怀疑林玄自身存在异常。
  - 将核心主题从"寻找力量"转向"寻找自我"。
  - 为最终实验失败或者异常结果埋下心理和剧情基础。
  - 建立"我是谁"这一贯穿全书的核心问题。

  events:
  - 实验准备阶段开始。
  - 小柒对林玄进行最后一次精神状态检测。
  - 检测结果出现异常数据。
  - 林玄的部分记忆区域存在无法解析的信息。
  - 小柒发现部分记忆并不符合林玄自身经历。
  - 林玄回忆过去吞噬其他生命后的变化。
  - 每一次吞噬都会获得新的信息和能力。
  - 但同时也会出现陌生情绪、陌生记忆、陌生认知。
  - 林玄曾经认为这是能力副作用。
  - 但这一次检测结果让他第一次产生怀疑。
  - 那些陌生记忆，也许并不是来自被吞噬生命。
  - 小柒提出停止实验。
  - 林玄拒绝。

  spiritual_process:
  - 林玄第一次面对自己的身份危机。
  - 表现一个强者对于未知自己的恐惧。
  - 展示林玄一直隐藏的不安。
  - 从追求力量转变为追求真相。
  - 强化林玄"必须知道自己是谁"的执念。
  - 体现林玄已经做好面对最坏结果的准备。

  key_scene:
  - 小柒展示精神检测结果。
  - 屏幕中出现一段无法识别的记忆影像。
  - 画面中出现一个陌生视角。
  - 林玄看到一个自己从未经历过的场景。
  - 他第一次产生疑问：

    "这些记忆，真的是我的吗？"

  emotional_focus:
  - 疑惑。
  - 不安。
  - 压迫。
  - 恐惧。
  - 孤独。

  conflict:
  - 林玄必须选择：
    - 停止实验，保持现在的自己。
    - 继续实验，寻找真正答案。
  - 继续实验可能让他失去现在的意识。

  mystery:
