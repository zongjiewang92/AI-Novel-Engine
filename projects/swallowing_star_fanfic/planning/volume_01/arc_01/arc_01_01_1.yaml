- id: plot_01_01_02
  title: 五年计划
  chapter_range: 2

  goal:
  - 引入智能生命小柒。
  - 建立林玄与小柒之间特殊关系。
  - 展示这不是一次普通任务，而是一场赌上一切的实验。

  events:
