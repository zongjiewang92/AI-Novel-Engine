  description: 
  - '论道，修心，获取血液。整理人类文明，精神思考等等。'
  - 世界完成一统， 整合世界的资源，以及科技。
  - 消灭兽皇，地星 进入高速发展状态。
  - 选拔各种人才。
  - 大量建设规划。
  - 保留部分荒野区。
  - 汉语表现出了对于修心的强力作用，全面废除其他语种，推行汉语。同时汉语文字进一步扩充，扩充中表现出了汉语的强大的融合性语言魅力，轻易的完成扩充。



