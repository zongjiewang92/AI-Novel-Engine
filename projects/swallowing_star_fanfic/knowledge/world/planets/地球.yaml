id: planet_earth

name:
  zh: 地球
  en: Earth

aliases:
  - Earth
  - 原始地球
  - 母星

type:
  - planet
  - life_planet
  - human_origin_world

description:
  zh: >
    地球人类文明起源星球。
    大涅槃时期后，地球进入怪兽与武者共存时代。
    罗峰、洪、雷神等强者均诞生于此。
    地球也是人类族群进入宇宙文明体系前的重要发源地。

cosmic_position:
  universe: 原始宇宙
  galaxy: 银河系
  star_region: 偏远星域
  importance: human_origin

environment:
  gravity:
    level: normal
  atmosphere:
    type: oxygen_based
  life_environment:
    suitable_for_human: true

civilization:
  name: 地球人类文明
  type:
    - human_civilization
    - planetary_civilization
  development_stage:
    early: 行星级以下文明
    later: 加入宇宙文明体系
  characteristics:
    - 武者体系
    - 精神念师体系
    - 古文明遗迹科技

history:
  ancient_era:
    name: 旧时代
    description: 人类科技文明发展时期
  great_nirvana:
    name: 大涅槃时期
    description: >
      全球生物发生变异，
      怪兽出现，
      人类诞生武者和精神念师。
  post_nirvana:
    name: 大涅槃后时代
    description: >
      人类建立基地市体系，
      武者成为保护人类的重要力量。

geography:
