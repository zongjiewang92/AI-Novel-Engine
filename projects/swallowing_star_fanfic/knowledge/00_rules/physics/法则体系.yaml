law_system:
  version: 2
  description:
    name: 浑源法则体系
    note:
      - 基于吞噬星空法则体系
      - 扩展浑源空间规则体系
      - 基础法则通过本质感悟
      - 多种法则融合产生更高层规则
  hierarchy:
    # =====================================================
    # 第一层：属性领域
    # =====================================================
    - level: 1
      name: 属性领域
      description:
        - 生命最初接触宇宙规则的表现形式
        - 由自身原能结合属性产生领域
      types:
        - 金领域
        - 木领域
        - 水领域
        - 火领域
        - 土领域
        - 风领域
        - 雷领域
        - 光领域
        - 时间领域
        - 空间领域
    # =====================================================
    # 第二层：基础法则
    # =====================================================
    - level: 2
      name: 基础法则
      description:
        - 宇宙运行最基础规则
        - 不同源世界基础法则数量可能不同
      laws:
        lower_laws:
          - name: 金之法则
            core:
              - 锋锐
              - 杀伐
              - 穿透
              - 坚固
            essence:
              total_count: 36
              description:
                - 金之法则包含36种基础法则本质
                - 通过不同本质组合形成各种金之秘法
              examples:
                - 金属结构
                - 金之锋芒
                - 金之切割
                - 金之穿透
                - 金之不灭

          - name: 木之法则
            core:
              - 生命
              - 生长
              - 恢复
            essence:
              total_count: 36
              examples:
                - 再生
                - 吸收
                - 蔓延
                - 生命转化
                
          - name: 水之法则
            core:
              - 流动
              - 包容
              - 变化
            essence:
              total_count: 36
              examples:
                - 水流
                - 冰冻
                - 渗透
                - 循环

          - name: 火之法则
            core:
              - 燃烧
              - 爆发
              - 能量
            essence:
              total_count: 36
              examples:
                - 火焰
                - 爆炸
                - 熔炼
                - 毁灭

          - name: 土之法则
            core:
              - 厚重
              - 防御
              - 承载
            essence:
              total_count: 36
              examples:
                - 大地
                - 重力
                - 镇压
                - 稳定

          - name: 风之法则
            core:
              - 速度
              - 变化
              - 自由
            essence:
              total_count: 48
              examples:
                - 气流
                - 极速
                - 风刃
                - 穿梭
                - 风暴

          - name: 雷电法则
            core:
              - 瞬间
              - 爆发
              - 震荡
            essence:
              total_count: 48
              examples:
                - 雷霆
                - 麻痹
                - 高频
                - 能量传递
                - 毁灭雷霆

          - name: 光线法则
            core:
              - 传播
              - 穿透
              - 照耀
            essence:
              total_count: 48
              examples:
                - 光速
                - 光束
                - 幻化
                - 信息传递
        higher_laws:
          - name: 空间法则
            core:
              - 空间封锁
              - 瞬移
              - 空间绞杀
            essence:
              total_count: 108
              description:
                - 原著设定空间法则拥有108种本质
                - 所有空间秘法均由这些本质组合产生
              examples:
                - 空间折叠
                - 空间压缩
                - 空间切割
                - 空间封锁
                - 瞬移
                - 空间传送
                - 空间破碎
                - 空间创造

          - name: 时间法则
            core:
              - 时间静止
              - 时间加速
              - 时间倒退
            essence:
              total_count: 108
              description:
                - 时间法则拥有108种核心本质
                - 时间秘法由不同时间本质组合产生
              examples:
                - 时间加速
                - 时间减速
                - 时间暂停
                - 时间倒退
                - 时间预测
                - 时间轮回

    # =====================================================
    # 第三层：双法则融合
    # =====================================================
    - level: 3
      name: 双法则融合
      description:
        - 两种基础法则结合
        - 产生新的融合规则
      examples:
        - 金 + 空间
        - 木 + 空间
        - 水 + 空间
        - 火 + 空间
        - 土 + 空间
        - 风 + 时间
        - 雷电 + 时间
        - 光线 + 时间
      famous:
        - 金之兽神之道
        - 木之兽神之道
        - 水之兽神之道
        - 火之兽神之道
        - 土之兽神之道
        - 风之兽神之道
        - 雷电之兽神之道
        - 光线之兽神之道
    # =====================================================
    # 第四层：多重融合
    # =====================================================
    - level: 4
      name: 多重融合法则
      description:
        - 三种以上基础法则融合
        - 融合数量越多越接近宇宙本质
      examples:
        - 五行融合
        - 时空融合
        - 阴阳融合
        - 多属性世界构造
    # =====================================================
    # 第五层：本源
    # =====================================================
    - level: 5
      name: 法则本源
      description:
        - 对多重融合法则最深层理解
        - 掌控某些法则的融合
      examples:
        - 金之本源 + 木水火土+空+时 部分融合
        - 木之本源 + 金水火土+空+时 部分融合
        - 空间本源 +++
        - 时间本源 +++
        - 毁灭本源
        - 生命本源
        - 创造本源
        
    # =====================================================
    # 第六层：混沌法则
    # =====================================================
    - level: 6
      name: 混沌法则
      description:
        - 超越普通基础法则
        - 多种大道融合后的更高规则
      branches:
        - name: 生命混沌法则
          controls:
            - 创造
            - 进化
            - 修复
        - name: 毁灭混沌法则
          controls:
            - 破坏
            - 湮灭
            - 终结
        - name: 因果混沌法则
          controls:
            - 命运
            - 联系
            - 因果链
        - name: 物质混沌法则
          controls:
            - 物质形成
            - 世界结构
    # =====================================================
    # 第七层：至高规则
    # =====================================================
    - level: 7
      name: 至高规则
      description:
        - 源世界最高运行规则
        - 决定一个世界存在方式
      controls:
        - birth
        - death
        - reincarnation
        - destiny
        - space
        - time
    # =====================================================
    # 第八层：浑源道
    # =====================================================
    - level: 8
      name: 浑源道
      description:
        - 超越单一源世界
        - 探索无限浑源空间本质
      levels:
        - 普通浑源生命
        - 世界级浑源生命
        - 领主级浑源生命
        - 元级存在

