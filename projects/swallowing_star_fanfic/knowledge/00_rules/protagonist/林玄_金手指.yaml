golden_core:
  id: unknown_origin_core
  name: 未知金色生命核心
  alias:
    - 金色光球
    - 灵魂金球
    - 金魂珠
  category: origin_life_seed
  version: 1
  description: >
    主角最大的秘密。
    四颗金色光球并非宝物，也并非法则至宝，
    而是一种未知生命本源。
    整个故事中，主角始终不知道其真正来历，
    所有能力均需要不断探索、实验、成长才能逐渐发现。
  ##############################################################
  # 作者设定（主角未知）
  ##############################################################
  author_only:
    origin:
      level: 浑源层次
      description: >
        无限浑源空间存在一种极其特殊的浑源生命。
        其天赋为无限吞噬，可以吞噬生命、能量、法则、
        世界本源乃至浑源规则。
      original_owner:
        title: 混乱之源
        characteristic:
          - 无限吞噬
          - 无限成长
          - 无限解析
          - 无限融合
        ending: >
          因吞噬无数生命信息，
          最终人格无限分裂，
          成为无限浑源空间最危险的混乱生命。
      creator:
        name: 浑源道主
      processing:
        - 提取四滴本源血液
        - 斩断所有因果联系
        - 清除原生命意识
        - 保留生命本能
        - 保留成长潜力
        - 保留吞噬本能
      descend:
        description: >
          第一滴血液融入主角身体，
          剩余三滴化作灵魂金球，
          四滴共同组成主角真正生命本源。
  ##############################################################
  # 主角当前认知
  ##############################################################
  owner_cognition:
    current:
      understands_origin: false
      understands_rule: false
      understands_limit: false
      understands_growth: false
      understands_future: false
    discovered:
      - 身体能够缓慢吸收周围生命能量
      - 脑海拥有四颗金色光球
      - 光球具有自主意识倾向
      - 吞噬后偶尔会出现陌生记忆
  ##############################################################
  # 四颗生命核心
  ##############################################################
  cores:
    total: 4
    body_core:
      status: active
      description: >
        第一颗融入身体，
        重塑主角生命。
    soul_core_1:
      status: dormant
    soul_core_2:
      status: dormant
    soul_core_3:
      status: dormant
  ##############################################################
  # 生命周期
  ##############################################################
  life_cycle:
    description: >
      金色核心并不存在固定能力，
      而是一种生命本能。
      随着成长，
      每一种能力都会不断进化。
    sequence:
      - 吞噬
      - 解析
      - 融合
      - 固化
      - 演化
  ##############################################################
  # 第一生命本能：吞噬
  ##############################################################
  devour:
    discovered: true
    awareness:
      owner: >
        主角发现，
        光球能够缓慢吸收附近生命能量。
    actual:
      description: >
        吞噬目标全部生命信息。
    growth:
      level_1:
        targets:
          - 血液
          - 生物组织
          - 低级能量
      level_2:
        targets:
          - 完整尸体
          - 怪兽尸体
      level_3:
        targets:
          - 活体生命
      level_4:
        targets:
          - 特殊资源
          - 神体
      level_5:
        targets:
          - 灵魂
          - 法则印记
      level_6:
        targets:
          - 本源能量
      level_7:
        targets:
          - 世界本源
          - 浑源规则
  ##############################################################
  # 第二生命本能：解析
  ##############################################################
  analyze:
    discovered: false
    awareness:
      owner: >
        主角偶尔会获得一些陌生知识，
        原因未知。
    actual:
      description: >
        将吞噬目标拆解为最基础生命信息。
    growth:
      level_1:
        granularity:
          - 身体结构
      level_2:
        granularity:
          - 基因
          - 血统
      level_3:
        granularity:
          - 能量运行
          - 修炼体系
      level_4:
        granularity:
          - 法则纹路
      level_5:
        granularity:
          - 灵魂结构
      level_6:
        granularity:
          - 真灵
      level_7:
        granularity:
          - 生命本源
  ##############################################################
  # 第三生命本能：融合
  ##############################################################
  assimilation:
    discovered: false
    automatic: true
    controllable: false
    description: >
      所有解析完成的信息都会自动开始融合。
    evolution:
      level_1:
        owner_state: 完全被动
      level_2:
        owner_state: 能够感知融合
      level_3:
        owner_state: 能暂停融合
      level_4:
        owner_state: 能选择融合对象
      level_5:
        owner_state: 能拆解人格信息
      level_6:
        owner_state: 能主动重组生命信息
      level_7:
        owner_state: 能创造生命信息
  ##############################################################
  # 第四生命本能：固化
  ##############################################################
  solidification:
    discovered: false
    description: >
      将完整生命信息永久固定，
      形成生命模板。
    limitation:
      template_slots: 4
      permanent: true
    current:
      used: 1
      remain: 3
    result:
      description: >
        每一个生命模板，
        都可形成一个永久生命分身。
  ##############################################################
  # 第五生命本能：演化
  ##############################################################
  evolution:
    discovered: false
    description: >
      最终能力。
      可以创造新的生命，
      而不是复制生命。
    possibilities:
      - 模板融合
      - 血统优化
      - 天赋重组
      - 法则生命化
      - 创造生命
      - 创造种族
      - 创造浑源生命
  ##############################################################
  # 信息污染
  ##############################################################
  information_pollution:
    description: >
      每一次吞噬，
      真正进入主角体内的不是力量，
      而是生命信息。
      信息永远不会消失，
      只能不断累积。
    source:
      - 人格
      - 情绪
      - 执念
      - 信念
      - 修炼记忆
      - 战斗本能
    stages:
      stage_1:
        symptoms:
          - 梦境
          - 幻觉
          - 陌生记忆
      stage_2:
        symptoms:
          - 情绪异常
          - 性格变化
      stage_3:
        symptoms:
          - 人格冲突
      stage_4:
        symptoms:
          - 自我迷失
      stage_5:
        symptoms:
          - 真灵污染
      stage_6:
        symptoms:
          - 完全混乱
  ##############################################################
  # 修心体系
  ##############################################################
  will_system:
    description: >
      修心不是为了提升实力，
      而是为了保持真正的自我。
    function:
      - 抵抗人格污染
      - 压制陌生记忆
      - 控制融合速度
      - 保持真我
      - 驾驭无限生命信息
  ##############################################################
  # 最终目标
  ##############################################################
  final_goal:
    description: >
      主角真正需要战胜的，
      并不是敌人，
      而是无限吞噬带来的无限信息污染。
      当主角能够完全驾驭四颗生命核心，
      保持真我不灭，
      最终将真正掌握生命演化规则，
      成为新的完美浑源生命。
  ##############################################################
  # 核心主题
  ##############################################################
  themes:
    - 吞噬
    - 生命信息
    - 修心
    - 真我
    - 人格污染
    - 无限成长
    - 生命演化
    - 浑源生命