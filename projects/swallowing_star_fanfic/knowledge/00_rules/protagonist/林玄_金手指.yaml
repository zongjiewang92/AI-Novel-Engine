# 四核生命
#      │
#      ▼
# 形成四具身体
#      │
#      ▼
# 每具身体都可以独立修炼
#      │
#      ▼
# 吞噬生命
#      │
#      ▼
# 解析生命
#      │
#      ▼
# 获得生命信息
#      │
#      ▼
# 人格污染
#      │
#      ▼
# 修心压制
#      │
#      ▼
# 固化生命模板
#      │
#      ▼
# 最终生命演化

# 主角的金手指 需要主角自己去探索出来，最开始 他会发现脑海中有3个玻璃珠一样的光球， 但是其实是4个，有一个跟 地球上的骸骨融合，生成了主角的第一个身体。 
# 这个3个光球的能力是形成4个意志分身，基本上是完美分身，共享记忆，感知，意识。 而且由于 光球吞噬不同的生命，固化成的分身之间 灵魂气息不一样。 
# 只是刚开始不一样，后续会慢慢趋于共同。4个身体可以独立修行。 
# 每个身体都有的能力， 可以吞噬 解析 任何物质，解析到 底层粒子，看懂的状态。 
# 随着解析的深入，会获取被解析生命的生命记忆片段，不是完完整整的，类似 之前早期影片中的吸血鬼的能力。

golden_core:
  id: four_origin_cores
  name: 四核生命体系
  alias:
  - 金色光球
  - 灵魂金球
  - 四核生命
  - 四源生命核心
  category: origin_life
  version: 2
  description:
  - 主角最大的秘密。
  - 四颗生命核心并非宝物，也并非法则至宝， 而是一种未知生命形态。
  - 主角真正的生命由四颗生命核心共同组成。
  - 第一颗生命核心已经与地球地下远古骸骨融合， 重塑了主角的第一具身体。
  - 剩余三颗生命核心沉睡于灵魂之海。
  - 主角始终不知道它们真正的来历， 所有能力都需要依靠探索、实验与成长逐渐发现。
  #################################################################
  # 作者设定（主角未知）
  #################################################################
  author_only:
    origin:
      level: 浑源生命
      description:
      - 四颗生命核心来自一位极其特殊的浑源生命。
      - 这种生命拥有无限吞噬、无限成长、无限解析、 无限融合的天赋。
      - 它能够吞噬生命、能量、法则、世界本源， 甚至吞噬生命信息。
      - 然而随着吞噬越来越多的生命， 无数生命记忆不断积累， 最终人格无限分裂， 成为无限浑源空间最危险的混乱生命。
      original_owner:
        title: 混乱之源
        characteristics:
        - 无限吞噬
        - 无限成长
        - 无限解析
        - 无限融合
        ending: >
          被无穷生命信息彻底污染， 人格无限分裂， 最终失去真正自我，变成只知道无限吞噬的怪物。
      creator:
        name: 浑源道主
      processing:
      - 抹除全部人格
      - 保留生命本能
      - 保留成长能力
      - 保留吞噬本能
      - 切断全部因果
      - 分裂为四颗生命核心
  #################################################################
  # 主角认知
  #################################################################
  owner_cognition:
    current:
      knows_origin: false
      knows_fourth_core: false
      knows_clone_system: false
      knows_information_pollution: false
      knows_life_template: false
    discovered:
    - 脑海中存在三颗金色玻璃珠
    - 光球拥有生命波动
    - 身体恢复能力异常
    - 身体能够缓慢吸收生命能量
    - 吞噬后偶尔出现陌生记忆
    unknown:
    - 实际共有四颗生命核心
    - 第一颗已经成为自己的身体
    - 四颗核心可以形成四具身体
    - 所有身体共享意识
    - 吞噬的是生命信息而非力量
  #################################################################
  # 四颗生命核心
  #################################################################
  cores:
    total: 4
    shared_network:
      enabled: true
      share:
      - 意识
      - 记忆
      - 感知
      - 灵魂网络
    body_core:
      status: active
      role: 主身体
      description: >
        第一颗生命核心已经融合远古骸骨， 成为主角第一具身体。
    soul_core_1:
      status: dormant
      role: 第二身体
    soul_core_2:
      status: dormant
      role: 第三身体
    soul_core_3:
      status: dormant
      role: 第四身体
  #################################################################
  # 第一生命本能：生命分身
  #################################################################
  life_avatar:
    discovered: false
    description: >
      每颗生命核心都能够固化一具真正的生命身体。 四具身体不是分身术， 而是真正意义上的四个生命个体。 四具身体共享同一个真我。
    characteristics:
    - 完全独立生命
    - 完全独立修炼
    - 完全独立行动
    - 完全独立成长
    - 可远距离存在
    - 可同时修炼不同体系
    synchronization:
      consciousness: true
      memory: true
      perception: true
      emotion: true
    limitation:
      max_avatar: 4
  #################################################################
  # 第二生命本能：吞噬
  #################################################################
  devour:
    discovered: true
    description: >
      每具身体都拥有吞噬能力。 吞噬的不只是能量， 更重要的是生命信息。
    targets:
      level_1:
      - 血液
      - 生物组织
      - 骨骼
      - 低级能量
      level_2:
      - 怪兽尸体
      - 完整尸体
      level_3:
      - 活体生命
      level_4:
      - 特殊资源
      - 神体
      level_5:
      - 灵魂
      - 法则印记
      level_6:
      - 本源能量
      level_7:
      - 世界本源
      - 浑源规则
  #################################################################
  # 第三生命本能：解析
  #################################################################
  analyze:
    discovered: false
    description: >
      吞噬完成后， 自动开始解析目标生命。 解析并不是复制， 而是彻底理解生命本质。
    depth:
      level_1:
      - 身体结构
      level_2:
      - 基因
      - 血统
      level_3:
      - 细胞
      - 能量运行
      level_4:
      - 微观粒子
      - 法则纹路
      level_5:
      - 灵魂结构
      level_6:
      - 真灵
      level_7:
      - 生命本源
  #################################################################
  # 第四生命本能：生命信息继承
  #################################################################
  memory_inheritance:
    discovered: false
    description: >
      解析生命过程中， 有概率读取目标残留的生命信息。 获取的并非完整记忆， 而是大量零散的信息碎片。
    obtainable:
    - 战斗经验
    - 修炼感悟
    - 本能
    - 技艺
    - 情绪
    - 执念
    - 人生片段
    - 部分语言
    note: >
      生命越强， 获取的信息越多， 同时人格污染风险也越高。
  #################################################################
  # 第五生命本能：生命模板
  #################################################################
  life_template:
    discovered: false
    description: >
      当生命解析达到足够程度， 可将目标永久固化为生命模板。 每个生命模板都可作为未来身体的基础。
    slots:
      total: 4
      used: 1
      remain: 3
    applications:
    - 构建身体
    - 重塑身体
    - 强化身体
    - 创造生命分身
  #################################################################
  # 第六生命本能：生命演化
  #################################################################
  evolution:
    discovered: false
    description: >
      金手指最终能力。 不再只是复制生命， 而是真正创造生命。
    possibilities:
    - 模板融合
    - 血统优化
    - 天赋融合
    - 法则生命化
    - 创造新生命
    - 创造新种族
    - 创造浑源生命
  #################################################################
  # 灵魂特性
  #################################################################
  soul_characteristics:
    description: >
      每具身体固化不同生命模板以后， 都会拥有对应生命的灵魂气息。 即使宇宙最强者也难以判断 四具身体属于同一个生命。
    stages:
      early:
        description: >
          四具身体灵魂气息完全不同。
      middle:
        description: >
          四具身体开始出现细微共鸣。
      late:
        description: >
          四具身体最终回归同一个真我。
  #################################################################
  # 信息污染
  #################################################################
  information_pollution:
    description: >
      每次吞噬真正进入体内的， 并不是力量， 而是生命信息。 信息永远不会消失， 只能不断累积。
    source:
    - 人格
    - 情绪
    - 执念
    - 信念
    - 战斗本能
    - 修炼经验
    - 人生经历
    stages:
      stage_1:
        symptoms:
        - 梦境
        - 幻觉
        - 陌生记忆
      stage_2:
        symptoms:
        - 情绪异常
        - 性格变化
      stage_3:
        symptoms:
        - 人格冲突
      stage_4:
        symptoms:
        - 多重人格
      stage_5:
        symptoms:
        - 真我迷失
      stage_6:
        symptoms:
        - 完全混乱
  #################################################################
  # 修心体系
  #################################################################
  will_system:
    description: >
      修心并非提升战斗力， 而是保持真正的自我。
    functions:
    - 保持真我
    - 压制人格污染
    - 控制信息融合
    - 稳定四具身体
    - 驾驭无限生命信息
  #################################################################
  # 整体成长路线
  #################################################################
  growth_path:
  - 获得第一具身体
  - 发现生命核心
  - 激活第二身体
  - 学会吞噬
  - 学会解析
  - 获取生命记忆
  - 承受信息污染
  - 修炼心境
  - 固化生命模板
  - 四身共同成长
  - 创造生命
  - 成为完美浑源生命
  #################################################################
  # 核心主题
  #################################################################
  themes:
  - 四身同修
  - 吞噬生命
  - 生命解析
  - 生命信息
  - 人格污染
  - 修心
  - 真我
  - 无限成长
  - 生命演化
  - 浑源生命
