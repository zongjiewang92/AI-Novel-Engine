life_level_system:

  source: '吞噬星空'

  version: 1

  description: >
    
    描述宇宙生命本质层次。

    生命层次代表一个生命存在形式的高度。

    不完全等同于境界。

    境界代表力量掌控程度。

    基因代表生命结构质量。

    生命层次代表生命本质。

  fundamental:

    definition:

      name: 生命层次

      description: >
        
        衡量生命从低级结构向高级存在进化的程度。

    factors:

    - 基因层次
    - 神体结构
    - 灵魂结构
    - 真灵强度
    - 能量本质
    - 法则融合程度

  hierarchy:

  # =================================================
  # 第一层 普通生命
  # =================================================


  - id: ordinary_life

    name: 普通生命

    level: 1

    examples:

    - 人类
    - 普通动物

    characteristics:

      body:

        description: >
          
          肉体结构。

          依赖自然能量。

      soul:

        description: >
          
          拥有普通灵魂。

      true_spirit:

        description: >
          
          存在真灵。

          但非常弱小。

    limitation:

    - 寿命有限
    - 无法宇宙生存
    - 无法吸收宇宙能量

  # =================================================
  # 第二层 学徒生命
  # =================================================


  - id: apprentice_life

    name: 学徒级生命

    level: 2

    description: >
      
      开始超越普通生命极限。

    evolution:

    - 身体强化
    - 精神增强
    - 初步吸收宇宙能量

    gene:

      multiple:

        range: 1-2

  # =================================================
  # 第三层 行星级宇宙生命
  # =================================================


  - id: planetary_life

    name: 行星级生命

    level: 3

    description: >
      
      第一次宇宙生命跃迁。

    changes:

      body:

      - 细胞宇宙化
      - 凝聚原力核心

      soul:

      - 灵魂增强
      - 精神念力觉醒

    ability:

    - 宇宙空间生存
    - 原力使用

  # =================================================
  # 第四层 恒星级生命
  # =================================================


  - id: stellar_life

    name: 恒星级生命

    level: 4

    description: >
      
      体内形成恒星结构。

      生命本质进一步提升。

    changes:

      body:

      - 细胞能量化
      - 恒星核心形成

      lifespan:

        years: 3000

  # =================================================
  # 第五层 宇宙级生命
  # =================================================


  - id: universe_life

    name: 宇宙级生命

    level: 5

    description: >
      
      真正进入宇宙生命体系。

    characteristics:

    - 掌控宇宙能量
    - 灵魂增强
    - 法则开始感悟

  # =================================================
  # 第六层 域主生命
  # =================================================


  - id: domain_lord_life

    name: 域主级生命

    level: 6

    characteristics:

      body:

      - 身体高度能量化

      soul:

      - 灵魂凝练

      ability:

      - 领域掌控

  # =================================================
  # 第七层 界主生命
  # =================================================


  - id: world_lord_life

    name: 界主级生命

    level: 7

    description: >
      
      生命开始拥有创造世界能力。

    evolution:

      core:

      - 原力核心
      - 灵魂
      - 念力
      - 界主晶核

    inner_world:

      exists: true

      description: >
        
        晶核内部孕育体内世界。

    characteristics:

    - 掌控世界力量
    - 创造空间
    - 法则感悟速度提升

  # =================================================
  # 第八层 不朽生命
  # =================================================


  - id: immortal_life

    name: 不朽生命

    level: 8

    description: >
      
      第一次真正生命本质跃迁。

    transformation:

      process:

      - 原始宇宙法则灌体
      - 神体转化
      - 真灵融合神体

    result:

      immortal_mark:

        description: >
          
          每一个神体粒子拥有生命印记。

    characteristics:

    - 无限寿命
    - 神体恢复
    - 真灵不灭

  # =================================================
  # 第九层 特殊生命
  # =================================================


  - id: special_life

    name: 天生特殊生命

    level: 9

    description: >
      
      宇宙自然孕育的特殊生命。

    examples:

    - 金角巨兽
    - 九幽之主族群
    - 特殊植物生命

    characteristics:

    - 出生高基因倍数
    - 天赋秘法
    - 神体巨大

    gene:

      multiple:

        greater_than: 100

  # =================================================
  # 第十层 完美基因生命
  # =================================================


  - id: perfect_gene_life

    name: 完美基因生命

    level: 10

    gene:

      multiple: 10086

    description: >
      
      宇宙生命理论极限。

    characteristics:

    - 神体强大
    - 生命本质极高
    - 后续突破潜力巨大

  # =================================================
  # 第十一层 真神生命
  # =================================================


  - id: true_god_life

    name: 真神生命

    level: 11

    description: >
      
      掌控自身小型宇宙。

    changes:

    - 神体进一步蜕变
    - 真灵强化
    - 小型宇宙形成

  # =================================================
  # 第十二层 虚空真神
  # =================================================


  - id: void_true_god

    name: 虚空真神生命

    level: 12

    characteristics:

    - 意志实体化
    - 掌控更高规则

  # =================================================
  # 第十三层 永恒真神
  # =================================================


  - id: eternal_true_god

    name: 永恒真神生命

    level: 13

    characteristics:

    - 神体无限提升
    - 生命本质继续升华

  # =================================================
  # 第十四层 混沌主宰
  # =================================================


  - id: chaos_master

    name: 混沌主宰生命

    level: 14

    characteristics:

    - 掌控混沌规则
    - 接近源世界本质

  # =================================================
  # 第十五层 神王生命
  # =================================================


  - id: god_king

    name: 神王生命

    level: 15

    characteristics:

    - 掌控一方大道
    - 超越宇宙海限制

  # =================================================
  # 第十六层 浑源生命
  # =================================================


  - id: origin_hunyuan_life

    name: 浑源生命

    level: 16

    description: >
      
      超越普通宇宙规则的生命。

    characteristics:

      true_spirit:

        description: >
          
          真灵直接接近浑源本质。

      body:

        description: >
          
          身体不再依赖普通宇宙规则。

      ability:

      - 跨越源世界
      - 抵抗浑源规则

  relationship:

    realm:

      description: >
        
        境界代表力量等级。

        生命层次代表生命本质。

    gene:

      description: >
        
        基因倍数是生命层次的重要指标。

    soul:

      description: >
        
        灵魂是真灵外在表现。

    will:

      description: >
        
        意志决定生命能够驾驭多少力量。

  protagonist_path:

    name: 林玄进化路线

    stages:

    - 普通生命

    - 黄金光改造生命

    - 特殊生命

    - 高基因生命

    - 完美基因生命

    - 神体生命

    - 浑源生命
