domain_system:
  source: '吞噬星空'
  version: 1
  description: >
    
    描述生命对于自身力量、 法则力量以及宇宙规则的掌控体系。 领域代表： 从影响局部空间， 到掌控宇宙规则的发展过程。
  # =====================================================
  # 第一阶段 领域
  # =====================================================
  domain_stage:
    name: 初始领域
    realm:
    - 行星级
    - 恒星级
    - 宇宙级
    description: >
      
      武者通过精神、原力、念力形成自身影响范围。
    characteristics:
      effect:
      - 压制敌人
      - 增强自身
      - 改变局部环境
      limitation:
        description: >
          
          主要依靠自身力量。 未真正接触宇宙本源法则。
    levels:
    - level: 1
      name: 一重领域
    - level: 2
      name: 二重领域
    - level: 9
      name: 九重领域
  # =====================================================
  # 第二阶段 世界投影
  # =====================================================
  world_projection:
    name: 世界投影
    realm: 域主
    description: >
      
      域主开始将自身对于空间、 法则以及世界的理解投射出来。
    source:
      description: >
        
        域主拥有自己的域。 可以形成类似小世界的力量投影。
    abilities:
    - 压制领域
    - 空间控制
    - 改变局部规则
    limitation:
      description: >
        
        仍然无法真正创造世界。
  # =====================================================
  # 第三阶段 界主世界领域
  # =====================================================
  world_lord_domain:
    name: 界主世界领域
    realm: 界主
    description: >
      
      界主拥有体内世界。 可以借助世界力量影响外界。
    abilities:
      world_power:
        name: 世界之力
        effect:
        - 增强攻击
        - 防御提升
        - 空间控制
      projection:
        name: 世界投影强化
        description: >
          
          将体内世界部分力量投射现实。
    special:
      create:
        abilities:
        - 简单空间切割
        - 创造界中界
        - 创造空间戒指
  # =====================================================
  # 第四阶段 法则领域
  # =====================================================
  law_domain:
    name: 法则领域
    description: >
      
      当生命真正理解宇宙本源法则后。 领域开始转变为法则领域。
    types:
      gold:
        name: 金之领域
        abilities:
        - 锋锐
        - 切割
      wood:
        name: 木之领域
        abilities:
        - 生命恢复
        - 生长
      water:
        name: 水之领域
      fire:
        name: 火之领域
      earth:
        name: 土之领域
      wind:
        name: 风之领域
      lightning:
        name: 雷电领域
      light:
        name: 光线领域
      space:
        name: 空间领域
      time:
        name: 时间领域
  # =====================================================
  # 第五阶段 空间时间领域
  # =====================================================
  space_time_domain:
    description: >
      
      宇宙中最高级本源法则领域。
    space:
      stages:
      - name: 空间感悟
      - name: 空间领域
      - name: 空间封锁
      - name: 空间切割
      - name: 空间瞬移
      - name: 完整空间法则
    time:
      stages:
      - name: 时间感悟
      - name: 时间领域
      - name: 时间加速
      - name: 时间减速
      - name: 时间暂停
      - name: 完整时间法则
  # =====================================================
  # 第六阶段 宇宙之主掌控时空
  # =====================================================
  universe_master_control:
    realm: 宇宙之主
    name: 掌控时空
    description: >
      
      宇宙之主融合时间空间。 获得原始宇宙部分控制权。
    abilities:
      time_space_control:
        name: 时空掌控
        effects:
        - 封锁时空
        - 修改空间结构
        - 时间逆转
        - 复活生命
    difference:
      description: >
        
        普通生命是在规则中使用力量。 宇宙之主可以调动规则本身。
  # =====================================================
  # 第七阶段 真神言出法随
  # =====================================================
  true_god_word_rule:
    realm: 真神
    name: 言出法随
    description: >
      
      真神掌控自身小型宇宙。 对规则拥有绝对控制。
    ability:
      effect:
      - 一念改变环境
      - 修改规则
      - 创造生命
      - 改变物质结构
    principle:
      description: >
        
        真神不是使用规则。 而是自身成为规则的一部分。
  # =====================================================
  # 领域发展关系
  # =====================================================
  evolution:
    path:
    - 领域
    - 世界投影
    - 法则领域
    - 本源法则领域
    - 时空掌控
    - 言出法随
  relationship:
    law:
      description: >
        
        法则决定领域高度。
    realm:
      description: >
        
        境界决定领域权限。
    will:
      description: >
        
        意志决定领域承载能力。
