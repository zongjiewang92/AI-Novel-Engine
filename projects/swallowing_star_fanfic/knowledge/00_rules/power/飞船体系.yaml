spaceship_system:

  source: '吞噬星空'

  version: 1

  description: >
    
    描述吞噬星空宇宙中的飞船等级体系。

    飞船是宇宙文明发展的重要工具。

    主要评价：

    材料等级 防御能力 速度 能源系统 智能系统 空间穿梭能力。

  # =====================================================
  # 飞船等级
  # =====================================================


  spaceship_levels:

  # =================================================
  # A级飞船
  # =================================================


  - id: A

    name: A级飞船

    civilization:

      level:

        初等宇宙文明

    description: >
      
      普通星际文明早期飞船。

    capability:

      travel:

        description:

          行星系内部航行

      defense:

        level:

          低

    users:

    - 行星级生命
    - 恒星级生命

  # =================================================
  # B级
  # =================================================


  - id: B

    name: B级飞船

    description: >
      
      比A级更加先进。

    capability:

      speed:

        increased: true

  # =================================================
  # C级
  # =================================================


  - id: C

    name: C级飞船

    description: >
      
      宇宙文明常见飞船。

    capability:

    - 星际航行
    - 暗宇宙进入

  # =================================================
  # D级
  # =================================================


  - id: D

    name: D级飞船

    levels:

      1-9

    description: >
      
      高级宇宙文明使用。

    capability:

    - 高速暗宇宙航行
    - 强化防御

  # =================================================
  # E级
  # =================================================


  - id: E

    name: E级飞船

    levels:

      1-9

    description: >
      
      大型宇宙势力常用飞船。

    users:

    - 域主级
    - 界主级

  # =================================================
  # F级
  # =================================================


  - id: F

    name: F级飞船

    levels:

      1-9

    description: >
      
      使用特殊材料制造。

      防御能力极强。

    capability:

      resist:

        description:

          可以抵挡界主攻击。

  # =================================================
  # G级
  # =================================================


  - id: G

    name: G级飞船

    description: >
      
      宇宙中极其珍贵的飞船。

    material:

      description: >
        
        使用极高级宇宙材料。

    capability:

      defense:

        description:

          可以抵挡不朽攻击。

    examples:

    - 陨墨星号
  # =====================================================
  # 飞船特殊分类
  # =====================================================


  special_spaceships:

    immortal_spaceship:

      name:

        不朽级飞船

      description: >
        
        使用不朽材料。

        可以承受不朽神力攻击。

    mechanical_spaceship:

      name:

        机械族飞船

      characteristics:

      - 智能生命控制
      - 自动战斗
      - 高度机械化

    universe_master_spaceship:

      name:

        宇宙之主级飞船

      description: >
        
        使用至宝材料制造。

        可以抵挡宇宙之主攻击。

  # =====================================================
  # 飞船核心系统
  # =====================================================


  components:

    engine:

      name:

        动力系统

      types:

      - 普通宇宙动力
      - 暗宇宙动力
      - 空间跳跃动力

    defense:

      name:

        防御系统

      factors:

      - 材料
      - 阵法
      - 能源罩

    intelligence:

      name:

        智能系统

      levels:

      - 普通智能
      - 智能生命
      - 机械族智能

    weapon:

      name:

        飞船武器

      types:

      - 能量炮
      - 镭射炮
      - 主炮
      - 不朽级攻击系统

  # =====================================================
  # 飞船速度体系
  # =====================================================


  speed_system:

    normal_space:

      description:

        原宇宙航行

    dark_universe:

      description:

        进入暗宇宙后速度提升

    teleport:

      description:

        高级存在使用空间瞬移

  # =====================================================
  # 代表飞船
  # =====================================================


  examples:

    meteor_star_ship:

      name:

        陨墨星号

      level:

        G级

      owner:

        呼延博

      characteristic:

      - G级材料
      - 防御强大
      - 智能辅助

    dragon_black:

      name:

        黑龙山X81型飞船

      level:

        D级

      characteristic:

      - 银河系常见高级飞船

  # =====================================================
  # 装备体系关系
  # =====================================================


  relationship:

    normal_equipment:

      description: >
        
        普通科技装备。

    spaceship:

      description: >
        
        负责移动、防御、运输。

    treasure:

      description: >
        
        融合宇宙本源法则的特殊物品。
