# 秘法体系
# ├── 第一阶段：地球技巧体系
# │
# ├── 第二阶段：宇宙生命秘法
# │
# │     ├── 不朽秘法体系
# │     │
# │     ├── 宇宙尊者秘法体系
# │     │
# │     └── 宇宙之主秘法体系
# │
# └── 第三阶段：真神以后秘法体系
# 技巧阶段
#  |
#  |-- 入微
#  |-- 意境
#  |-- 世界
# 宇宙生命阶段
#  |
#  |-- 普通秘法
#  |-- 高等秘法
#  |-- 顶级秘法
#  |-- 巅峰秘法
#  |-- 最强秘法
# 宇宙之主阶段
#  |
#  |-- 普通宇宙之主秘法
#  |-- 巅峰秘法
#  |-- 究极秘法
# 真神以后
#  |
#  |-- 一阶秘法
#  |-- 二阶秘法
#  |-- 三阶秘法
#  |
#  |-- 六阶秘法
#  |
#  |-- 七阶
#  |-- 八阶
#  |-- 九阶
#  |-- 九阶顶尖
#  |-- 十阶
secret_art_system:
  source: '吞噬星空'
  version: 2
  description: >
    
    秘法代表生命对于法则、 能量、身体、灵魂的运用方式。 秘法等级受到： 1. 创造者境界 2. 法则感悟 3. 创造能力 三方面影响。
  # =====================================================
  # 不朽秘法体系
  # =====================================================
  immortal_secret_system:
    realm: 不朽
    description: >
      
      不朽开始真正创造宇宙秘法。 因为拥有不朽神力， 可以承载更高等级秘法。
    levels:
      ordinary:
        name: 普通秘法
        creator:
        - 普通不朽
        requirement:
          description: >
            
            掌握单一法则。 能够简单调动法则力量。
        power:
          level: 不朽基础
      high:
        name: 高等秘法
        creator:
        - 精英不朽
        - 普通封侯不朽
        requirement:
        - 深入理解单一法则
        - 创造个人战斗体系
      top:
        name: 顶级秘法
        creator:
        - 封侯不朽
        - 强大封侯
        requirement:
        - 接近法则本质
        - 秘法结构完善
      peak:
        name: 巅峰秘法
        creator:
        - 封王不朽
        requirement:
        - 融合法则雏形
        - 极高法则感悟
        examples:
        - 封王无敌秘法
      strongest:
        name: 最强秘法
        creator:
        - 顶尖封王
        - 特殊天才
        requirement:
        - 接近宇宙尊者层次理解
        description: >
          
          已经超越普通不朽极限。
  # =====================================================
  # 宇宙尊者秘法体系
  # =====================================================
  universe_exalt_secret_system:
    realm: 宇宙尊者
    description: >
      
      尊者已经完全掌握一种本源法则。 秘法开始进入法则本质层面。
    levels:
      ordinary:
        name: 普通尊者秘法
        creator:
        - 普通宇宙尊者
        ability:
          description: >
            
            完整法则运用。
      high:
        name: 高等尊者秘法
        creator:
        - 高等宇宙尊者
        ability:
          description: >
            
            对法则拥有极深理解。
      top:
        name: 顶级尊者秘法
        creator:
        - 顶尖宇宙尊者
        ability:
          description: >
            
            可以跨越多个小境界战斗。
      peak:
        name: 巅峰尊者秘法
        creator:
        - 宇宙霸主
        requirement:
        - 接近宇宙之主境界
      strongest:
        name: 最强尊者秘法
        creator:
        - 顶尖宇宙霸主
        description: >
          
          已经拥有部分宇宙之主威能。
  # =====================================================
  # 宇宙之主秘法体系
  # =====================================================
  universe_master_secret_system:
    realm: 宇宙之主
    description: >
      
      宇宙之主掌控时空。 可以创造真正属于自己的究极秘法。
    levels:
      ordinary:
        name: 普通宇宙之主秘法
        creator:
        - 普通宇宙之主
        power:
          level: 三阶左右
      peak:
        name: 巅峰秘法
        creator:
        - 强大宇宙之主
        power:
          level: 四阶 五阶
      ultimate:
        name: 究极秘法
        creator:
        - 顶尖宇宙之主
        power:
          level: 六阶
        description: >
          
          宇宙之主最强秘法。 已经接近真神层次。
