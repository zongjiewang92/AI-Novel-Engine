# 装备体系.yaml
# 装备
# ├── 科技装备
# │
# │   ├── 武器
# │   ├── 防具
# │   ├── 飞船
# │   └── 智能设备
# │
# ├── 修炼装备
# │
# │   ├── 原力兵器
# │   ├── 念力兵器
# │   ├── 灵魂装备
# │   └── 铠甲
# └── 宝物体系
#     ├── 普通宝物
#     ├── 重宝
#     ├── 高等重宝
#     ├── 顶级重宝
#     ├── 至宝
#     ├── 高等至宝
#     ├── 顶级至宝
#     └── 至强至宝
equipment_system:
  source: '吞噬星空'
  version: 1
  description: >
    
    描述吞噬星空宇宙中的装备体系。 装备按照来源分为： 科技装备 修炼装备 特殊装备 宝物装备 其中宝物装备涉及宇宙本源法则， 是最高等级装备体系。
  # =====================================================
  # 第一类 科技装备
  # =====================================================
  technology_equipment:
    description: >
      
      宇宙文明通过科技制造的装备。 特点： 可批量制造。 依赖文明等级和材料科技。
    categories:
      weapons:
        name: 科技武器
        examples:
        - 镭射炮
        - 能量炮
        - 主炮
        levels:
        - A级
        - B级
        - C级
        - D级
        - E级
        - F级
        - G级
      armor:
        name: 科技防具
        examples:
        - 合金战甲
        - 能量护盾
        - 机械铠甲
      spaceship:
        name: 飞船
        reference:
          file: 飞船体系.yaml
      intelligent_device:
        name: 智能设备
        types:
        - 智能光脑
        - 辅助系统
        - 智能生命
  # =====================================================
  # 第二类 修炼装备
  # =====================================================
  cultivation_equipment:
    description: >
      
      修炼者通过原力、念力、法则制造或者使用的装备。
    categories:
      origin_weapon:
        name: 原力兵器
        user:
        - 行星级
        - 恒星级
        - 宇宙级
        examples:
        - 血影战刀
        - 原力战甲
      spirit_weapon:
        name: 念力兵器
        user:
        - 精神念师
        examples:
        - 飞剑
        - 念力兵器
      soul_equipment:
        name: 灵魂装备
        description: >
          
          防御或者增强灵魂能力。
        examples:
        - 灵魂防御宝物
        - 灵魂攻击装备
      armor:
        name: 修炼铠甲
        types:
        - 原力铠甲
        - 神力铠甲
        - 至宝铠甲
  # =====================================================
  # 第三类 特殊装备
  # =====================================================
  special_equipment:
    description: >
      
      无法简单归类。 通常拥有特殊能力。
    categories:
      wings:
        name: 羽翼类装备
        examples:
        - 弑吴羽翼
        abilities:
        - 飞行
        - 防御
        - 空间能力
      palace:
        name: 宫殿类装备
        abilities:
        - 防御
        - 镇压
        - 囚禁
      domain:
        name: 领域类装备
        abilities:
        - 领域压制
        - 范围控制
  # =====================================================
  # 第四类 宝物体系
  # =====================================================
  treasure_system:
    description: >
      
      宇宙强者认可的宝物等级体系。 宝物融合宇宙本源法则。 等级越高， 威能越接近规则本质。
    levels:
      # -----------------------------------------------------
      # 普通宝物
      # -----------------------------------------------------
      ordinary:
        name: 普通宝物
        users:
        - 界主
        - 不朽
        characteristics:
        - 有一定法则威能
        - 非法则至宝
      # -----------------------------------------------------
      # 重宝
      # -----------------------------------------------------
      heavy_treasure:
        name: 重宝
        users:
        - 不朽
        - 宇宙尊者
        characteristics:
        - 融合法则
        - 稀有珍贵
      # -----------------------------------------------------
      # 高等重宝
      # -----------------------------------------------------
      advanced_heavy_treasure:
        name: 高等重宝
        users:
        - 封王不朽
        - 宇宙尊者
        characteristics:
        - 强大法则威能
        - 可以影响战局
      # -----------------------------------------------------
      # 顶级重宝
      # -----------------------------------------------------
      peak_heavy_treasure:
        name: 顶级重宝
        users:
        - 宇宙霸主
        characteristics:
        - 接近至宝威能
      # -----------------------------------------------------
      # 至宝
      # -----------------------------------------------------
      supreme_treasure:
        name: 至宝
        users:
        - 宇宙尊者以上
        characteristics:
        - 宇宙本源孕育
        - 拥有完整秘纹
      # -----------------------------------------------------
      # 高等至宝
      # -----------------------------------------------------
      advanced_supreme_treasure:
        name: 高等至宝
        users:
        - 宇宙之主
        characteristics:
        - 强大秘纹
        - 多重能力
      # -----------------------------------------------------
      # 顶级至宝
      # -----------------------------------------------------
      peak_supreme_treasure:
        name: 顶级至宝
        users:
        - 顶尖宇宙之主
        characteristics:
        - 接近最强者层次
      # -----------------------------------------------------
      # 至强至宝
      # -----------------------------------------------------
      strongest_treasure:
        name: 至强至宝
        users:
        - 宇宙最强者
        characteristics:
        - 宇宙规则极限产物
        - 拥有完整本源秘纹
        examples:
        - 星辰塔
        - 至强至宝兵器
  # =====================================================
  # 宝物类型
  # =====================================================
  treasure_types:
    weapon:
      name: 攻击类
    armor:
      name: 防御类
    soul:
      name: 灵魂类
    palace:
      name: 宫殿类
    domain:
      name: 领域类
    flight:
      name: 飞行类
    special:
      name: 特殊类
  # =====================================================
  # 装备和境界关系
  # =====================================================
  realm_relation:
    apprentice:
      equipment: 普通科技装备
    planetary:
      equipment: 原力兵器
    universe:
      equipment: 念力兵器
    domain_lord:
      equipment: 高级修炼装备
    world_lord:
      equipment: 普通宝物
    immortal:
      equipment: 重宝
    universe_exalt:
      equipment: 高等重宝 至宝
    universe_master:
      equipment: 顶级至宝
    true_god:
      equipment: 至强至宝
  # =====================================================
  # 评价体系
  # =====================================================
  evaluation:
    factors:
    - 材料等级
    - 法则秘纹
    - 能源
    - 认主条件
    - 使用者实力
    principle: >
      
      装备等级不等于使用者实力。 强者可以发挥低级装备更高威力。 高级装备也需要实力承载。
