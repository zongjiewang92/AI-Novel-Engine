# 血统生命
# 不入流血统
#     ↓
# 普通人类血统
#     ↓
# 宇宙级血统
#     ↓
# 域主级血统
#     ↓
# 界主级血统
# ├── 普通血统
# │
# ├── 高等血统
# │
# ├── 特殊生命血统
# │
# ├── 巅峰血统
# │
# ├── 完美生命血统
# │
# └── 浑源生命血统
bloodline_system:

  source: '吞噬星空'

  version: 1

  description: >
    
    描述宇宙生命血统体系。

    血统代表生命种族先天潜力。

    决定：

    成长速度 身体强度 基因潜力 突破上限

    血统不完全等同于基因倍数。

    后天宝物和秘法可以进一步提升基因层次。

  concepts:

    bloodline:

      name: 血统

      description: >
        
        生命种族长期进化形成的生命基础。

    gene_multiple:

      name: 基因倍数

      description: >
        
        当前生命基因层次。

        可以通过：

        宝物 秘法 传承

        继续提升。

  # =====================================================
  # 血统等级
  # =====================================================


  hierarchy:

  # =================================================
  # 不入流血统
  # =================================================


  - id: inferior_bloodline

    name: 不入流血统

    level: 0

    examples:

    - 普通地球生命
    - 普通宇宙弱小生命

    characteristics:

      gene:

        multiple:

          1倍左右

      potential:

        description: >
          
          基础生命。

          成长潜力有限。

    limitation:

    - 突破速度慢
    - 身体基础弱

  # =====================================================
  # 普通人类血统
  # =====================================================


  - id: human_common_bloodline

    name: 普通人类血统

    level: 1

    description: >
      
      原始宇宙中普通人类族群血统。

    characteristics:

      lifespan:

        normal:


      gene:

        multiple:

          1倍

    evolution:

      possible:

      - 修炼
      - 基因药剂
      - 宝物提升

  # =====================================================
  # 宇宙级血统
  # =====================================================


  - id: universe_level_bloodline

    name: 宇宙级血统

    level: 2

    description: >
      
      经过宇宙级基因药剂改造后的生命。

    characteristics:

      body:

        description: >
          
          身体结构适合宇宙能量吸收。

      cultivation:

        speed:

          increase: true

    enhancement:

      method:

      - 宇宙级基因药剂

  # =====================================================
  # 域主级血统
  # =====================================================


  - id: domain_lord_bloodline

    name: 域主级血统

    level: 3

    description: >
      
      人类族群较高等级血统。

    characteristics:

      body:

      - 细胞更加稳定
      - 能量容量提升

      cultivation:

        description: >
          
          对宇宙本源能量亲和度提升。

    enhancement:

      method:

      - 域主级基因药剂

  # =====================================================
  # 界主级血统
  # =====================================================


  - id: world_lord_bloodline

    name: 界主级血统

    level: 4

    description: >
      
      普通人类能够达到的最高血统等级之一。

    characteristics:

      body:

      - 生命结构接近界主生命
      - 原力承载能力极强

      breakthrough:

        easier:

        - 域主突破界主
        - 法则感悟

    gene:

      potential:

        description: >
          
          拥有更高基因提升空间。

    limitation:

      description: >
        
        即使界主级血统。

        仍然不是特殊生命。

  # =====================================================
  # 普通特殊血统
  # =====================================================


  - id: special_bloodline

    name: 特殊生命血统

    level: 5

    description: >
      
      宇宙自然孕育的特殊生命。

    examples:

    - 金角巨兽
    - 九幽族
    - 植物生命

    characteristics:

    - 天赋秘法
    - 巨大神体
    - 高基因倍数

    gene:

      initial:

        greater_than:

          100

  # =====================================================
  # 巅峰血统
  # =====================================================


  - id: peak_bloodline

    name: 巅峰血统

    level: 6

    description: >
      
      宇宙中极其稀少的高级生命。

    characteristics:

    - 天生高生命层次
    - 强大神体结构
    - 极高成长潜力

    examples:

    - 顶级特殊生命

  # =====================================================
  # 完美生命血统
  # =====================================================


  - id: perfect_bloodline

    name: 完美生命血统

    level: 7

    description: >
      
      基因结构达到理论极致。

    characteristics:

      gene:

        multiple:

          10086

      features:

      - 完美生命结构
      - 神体潜力无限

    examples:

    - 罗峰完美基因生命

  # =====================================================
  # 浑源生命血统
  # =====================================================


  - id: hunyuan_bloodline

    name: 浑源生命血统

    level: 8

    description: >
      
      超越原始宇宙规则的生命血统。

    characteristics:

      body:

        description: >
          
          身体结构接近浑源规则。

      true_spirit:

        description: >
          
          真灵本质发生蜕变。

    abilities:

    - 超越宇宙限制
    - 抵抗规则压制
    - 浑源级生命力量
  # =====================================================
  # 基因药剂体系
  # =====================================================


  gene_medicine:

    description: >
      
      人类通过科技制造的血统提升方式。

    levels:

    - name: 宇宙级基因药剂

      target:

        宇宙级以下生命

      effect:

        description:

          提升到宇宙级血统

    - name: 域主级基因药剂

      target:

        域主以下生命

      effect:

        description:

          提升生命基础

    - name: 界主级基因药剂

      availability:

        extremely_rare

      description: >
        
        理论存在。

        但是制造难度极高。

        人类族群没有普及。

  # =====================================================
  # 血统和基因关系
  # =====================================================


  relationship:

    rules:

    - >
      
      血统决定初始生命潜力。

    - >
      
      基因倍数决定当前生命质量。

    - >
      
      宝物可以提升基因倍数。

    - >
      
      秘法可以突破血统限制。

    example:

      human:

        bloodline:

          界主级血统

        gene:

          100倍

        result:

          description: >
            
            可以成长为极强界主。

            但仍属于普通生命。

      luofeng:

        bloodline:

          人类血统

        gene:

          完美基因

        result:

          description: >
            
            后天突破生命极限。
