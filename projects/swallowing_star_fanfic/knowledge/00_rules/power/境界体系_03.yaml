power_system:

  source: '吞噬星空'
  version: 1

  description: >
    宇宙尊者，是界主突破不朽后，在不朽基础上进一步领悟完整空间法则或时间法则， 神体完全转化为神力生命后的超级存在。 宇宙尊者拥有不死之身，能够瞬移。 战斗力主要由法则感悟、秘法层次、神体大小、基因层次、至宝决定。

  power_unit: '界主巅峰 = 1'

  realms:

  - id: 'universe_venerable'
    name: '宇宙尊者'

    description: >
      宇宙尊者内部差距巨大。 普通尊者可能只有数千倍界主巅峰战力， 顶尖宇宙霸主甚至可以媲美弱小宇宙之主。

    levels: 4

    stages:

    # ============================
    # 第一阶段：普通宇宙尊者
    # ============================

    - level: 1
      name: '普通宇宙尊者'
      alias:
      - '初等宇宙尊者'
      power:
        level: '约1000倍~10000倍界主巅峰'
        description: >
          掌握完整空间法则或时间法则， 能够创造普通宇宙尊者级秘法。
      law:
        stage: '完整空间法则'
      ability:
      - '瞬移'
      - '神国传送'
      - '不死之身'
      body:
        description: >
          神体由生命本源转化为神力， 普通人类尊者神体通常数十公里到数百公里。

    # ============================
    # 第二阶段：高等宇宙尊者
    # ============================

    - level: 2
      name: '高等宇宙尊者'
      power:
        level: '数万倍界主巅峰'
        description: >
          对空间法则或时间法则理解更加深入， 秘法威力明显提升。

      law:
        stage: '空间法则圆满'

      ability:
      - '更强瞬移'
      - '创造高等尊者秘法'
      - '更强神体爆发'

    # ============================
    # 第三阶段：宇宙霸主
    # ============================

    - level: 3
      name: '宇宙霸主'
      alias:
      - '尊者巅峰'

      power:
        level: '百万倍界主巅峰以上'
        description: >
          尊者中的超级强者。 通常拥有顶级尊者秘法， 能够横扫普通宇宙尊者。

      law:
        stage: >
          空间法则和时间法则高度融合， 已经触摸宇宙之主境界。

      ability:
      - '创造巅峰秘法'
      - '媲美部分宇宙之主攻击'
      - '超级神体爆发'

    # ============================
    # 第四阶段：顶尖宇宙霸主
    # ============================

    - level: 4
      name: '顶尖宇宙霸主'

      power:
        level: >
          接近宇宙之主一阶、二阶战力

        description: >
          宇宙尊者中的最顶级存在。 已经创造出接近宇宙之主层次的秘法。

      examples:
      - '天狼之主突破前层次'
      - '混沌城主弟子中的超级存在'

      law:
        stage: >
          两大本源法则融合达到极高程度， 距离宇宙之主只差最后突破。

      ability:
      - '顶级领域类至宝'
      - '顶级攻击秘法'
      - '强大神体'
      - '越阶挑战宇宙之主'

    hierarchy:

    - '普通宇宙尊者'
    - '高等宇宙尊者'
    - '宇宙霸主'
    - '顶尖宇宙霸主'

    combat_reference:

      ordinary_venerable:
        comparable:
        - '多个封王无敌'
        - '普通不朽无法抗衡'

      universe_overlord:
        comparable:
        - '普通宇宙之主'

      peak_universe_overlord:
        comparable:
        - '弱小宇宙之主'
        - '部分宇宙之主二阶战力'
