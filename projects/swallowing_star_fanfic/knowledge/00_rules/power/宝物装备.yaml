treasure_equipment:

  source: '吞噬星空'

  version: 1

  description: >
    
    记录吞噬星空宇宙中的具体装备类宝物。

    包括武器、防具、宫殿、领域、飞行、 灵魂、防御、特殊装备。

    用于小说生成时判断角色装备合理性。

  equipment_categories:

    # =====================================================
    # 武器类
    # =====================================================


    weapon:

      description: >
        
        直接提升攻击能力的装备。

        通常融合使用者秘法和法则。

      types:

        original_weapon:

          name: 原力兵器

          users:

          - 行星级
          - 恒星级
          - 宇宙级
          - 域主级

          description: >
            
            使用宇宙特殊金属制造。

            可以承载原力。

        spirit_weapon:

          name: 念力兵器

          users:

          - 精神念师

          description: >
            
            通过精神念力控制。

            可以远程攻击。

        treasure_weapon:

          name: 重宝武器

          users:

          - 不朽
          - 宇宙尊者

          description: >
            
            蕴含法则秘纹。

            可以增强秘法威力。

        supreme_weapon:

          name: 至宝武器

          users:

          - 宇宙之主

          description: >
            
            拥有完整法则秘纹。

            可以大幅增强宇宙之主战力。

  # =====================================================
  # 防具
  # =====================================================


  armor:

    description: >
      
      用于保护神体。

      减少攻击造成的伤害。

    equipment:

      battle_armor:

        name: 战甲

        effects:

        - 防御物理攻击
        - 削弱能量攻击
        - 减少神体损耗

        users:

        - 不朽
        - 尊者

      tribulation_armor:

        name: 劫甲

        owner:

          name: 罗峰

        level:

          category: 顶级装备

        effects:

        - 大幅削弱攻击
        - 保护神体
        - 增强生存能力

        description: >
          
          罗峰获得的特殊铠甲。

          可以极大提升弱小时期生存能力。

  # =====================================================
  # 宫殿类装备
  # =====================================================


  palace:

    description: >
      
      最珍贵的装备类别之一。

      集防御、飞行、镇压于一体。

    equipment:

      star_tower:

        name: 星辰塔

        level:

          category: 至强至宝

        owner:

          name: 罗峰

        category:

        - 宫殿类
        - 攻击类
        - 镇封类

        abilities:

          defense:

            description: >
              
              可以抵挡极强攻击。

          suppression:

            description: >
              
              可以镇压敌人。

          flight:

            description: >
              
              可以高速飞行。

          attack:

            description: >
              
              内部蕴含强大攻击能力。

        origin:

          description: >
            
            坐山客炼制。

        restriction:

          description: >
            
            需要极高实力才能完全发挥。

      black_prison_tower:

        name: 黑狱塔

        category:

        - 宫殿类
        - 镇封类

        abilities:

        - 镇压敌人
        - 囚禁生命

  # =====================================================
  # 领域类装备
  # =====================================================


  domain:

    description: >
      
      展开特殊领域。

      压制敌人行动。

    equipment:

      five_color_light_lake:

        name: 五彩极光湖

        level:

          category: 领域类至宝

        abilities:

        - 大范围压制
        - 削弱敌人速度
        - 限制行动

        users:

        - 虫族女皇

  # =====================================================
  # 灵魂类装备
  # =====================================================


  soul:

    description: >
      
      灵魂攻击极难防御。

      因此灵魂类宝物极其珍贵。

    abilities:

      defense:

      - 防御灵魂攻击
      - 保护灵魂核心

      attack:

      - 增强灵魂秘法
      - 提升灵魂攻击威力

    users:

    - 宇宙尊者
    - 宇宙之主

  # =====================================================
  # 飞行类装备
  # =====================================================


  flying:

    description: >
      
      提升移动速度。

      高等级通常与宫殿类结合。

    abilities:

    - 宇宙空间飞行
    - 暗宇宙穿梭
    - 逃命

  # =====================================================
  # 探测类装备
  # =====================================================


  detection:

    description: >
      
      用于发现敌人和隐藏目标。

    abilities:

    - 探测生命
    - 探测宝物
    - 发现空间异常

    importance:

      description: >
        
        宇宙海强者竞争中。

        探测类宝物价值极高。

  # =====================================================
  # 镇封装备
  # =====================================================


  sealing:

    description: >
      
      用于封印、镇压敌人。

    abilities:

    - 封印神体
    - 限制行动
    - 镇压灵魂

    examples:

    - 星辰塔
    - 黑狱塔

  # =====================================================
  # 特殊装备
  # =====================================================


  special:

    space_storage:

      name: 空间储存装备

      examples:

      - 世界戒指
      - 空间戒指

      description: >
        
        内部拥有稳定空间。

        通常需要界主以上强者制造。

    communication:

      name: 通讯装备

      examples:

      - 虚拟宇宙连接设备

      abilities:

      - 远距离交流
      - 虚拟空间连接

  # =====================================================
  # 装备规则
  # =====================================================


  rules:

  - id: equipment_level_rule

    description: >
      
      宝物等级越高。

      对使用者实力要求越高。

  - id: law_requirement

    description: >
      
      高级宝物需要对应法则感悟。

  - id: treasure_recognition

    description: >
      
      顶级宝物通常需要认主。

  - id: strength_multiplier

    description: >
      
      宝物可以让低境界生命越级战斗。

      但无法完全替代境界差距。

  cultivation_relation:

    apprentice:

      equipment:

      - 普通武器

    planetary:

      equipment:

      - 原力兵器
      - 念力兵器

    domain_lord:

      equipment:

      - 高级念力兵器
      - 普通重宝

    world_lord:

      equipment:

      - 重宝碎片
      - 特殊装备

    immortal:

      equipment:

      - 重宝
      - 普通至宝

    universe_lord:

      equipment:

      - 至宝
      - 顶级至宝

    universe_master:

      equipment:

      - 巅峰至宝
      - 至强至宝
