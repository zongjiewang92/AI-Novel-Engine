    - id: 'immortal'
      name: '不朽神灵'
      levels: 11
      description: "不朽神灵阶段，生命完成神体化，拥有不死之身。战斗力主要取决于法则、神体、秘法、至宝、基因层次，而非单纯力量。\n"
      power_unit: '界主巅峰 = 1'
      body_height: "\"神体的高度决定了神体的体积，从而决定了神体的神力总含量，但是跟力量大小没有关系，跟持续性有关系。\" \"妖族的神体高度是人类的100倍左右\" \"妖族的神体高度是人类的10000倍左右\"\n"
      genetic_level: "\"基因倍数，基因倍数是发挥力量的重要指标，基因倍数越高，单位爆发的力量级别更高。\" \"普通生命基因倍数最高为100倍\" \"妖族皇族基因倍数是人类的10倍左右，有的特殊的皇族可能高一点。\" \"特殊生命的基因倍数大都是超过100倍，所以才叫特殊生命。\"\n"
      stages:
