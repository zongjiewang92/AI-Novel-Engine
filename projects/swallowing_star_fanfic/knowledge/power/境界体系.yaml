  界主级:

    描述: 开辟世界， 拥有体内世界。

  不朽神灵:

    描述: 生命本质跃迁， 永恒存在。

  宇宙尊者:

    描述: 感悟空间法则， 强大存在。

  宇宙之主:

    描述: 掌控宇宙本源法则。

