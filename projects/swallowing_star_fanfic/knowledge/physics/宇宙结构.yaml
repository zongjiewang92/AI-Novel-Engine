id: universe_structure

name: 宇宙结构

description: >
  描述整个无限浑源空间的空间层级。


hierarchy:

  - id: infinite_origin_space

    name: 无限浑源空间

    level: 0

    description: >
      已知最高层空间。

    contains:

      - origin_world

      - natural_hunyuan_region

      - special_regions



  - id: origin_world

    name: 源世界

    level: 1

    description: >
      无限浑源空间中孕育出的世界。


    examples:

      - 起源初界

      - 雪鹰世界

      - 莽荒世界



    contains:

      - central_continent

      - universe_sea



  - id: universe_sea

    name: 宇宙海

    level: 2

    description: >
      围绕中心大陆存在。


    contains:

      - original_universe

      - holy_universe

      - small_universe

      - three_forbidden_lands



  - id: original_universe

    name: 原始宇宙

    level: 3