  description: '“对，旋元！就是那位很是喜欢冒险闯荡的宇宙最强者‘旋元’！'
- time: 显然这两块距离很近，加上面积大，这两份就等于一般较小的六七份牵丝图碎片，自然是个个争夺。
  event: 六名宇宙之主争抢两份较大的牵丝图碎片
