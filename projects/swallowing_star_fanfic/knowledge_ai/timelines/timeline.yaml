  description: '虚拟宇宙独立位面华美大殿内，坐在一边的罗峰、混沌城主、黑暗之主、彭工之主，都在看着对面的六位，等待着他们的答复。“我方所有宇宙之主。”那六位中穿着一身银色战铠，有着银色双角，双眸也泛着丝丝金光的八臂男子开口道，“统一由我代表。”“嗯？”人类一方罗峰他们四个都一惊。而自由联盟的六位代表中的‘始化岛主’却有些错愕，他连转头看向身侧其他各派领头者。“对。”“对，由光行之主代表。”“对。”始化岛主顿时表情难看，他现实中的本尊，自然立即神力传音询问麾下的一大群宇宙之主。'
