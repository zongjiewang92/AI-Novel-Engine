- speaker_id: zhou_zheng_yong
  listener_ids: [ lu_feng, yang_hui ]
  content: "罗峰，我极限武馆全球总部那，一共有两大训练营，分别是基础训练营和精英训练营。"
  context: 介绍两个训练营。

- speaker_id: zhou_zheng_yong
  listener_ids: [ lu_feng, yang_hui ]
  content: "精英训练营是吸纳天才中的天才，师资力量也是战神级别。"
  context: 描述精英训练营的特点。

- speaker_id: yang_hui
  listener_ids: [ lu_feng ]
  content: "罗峰，你现在有机会进入全球第一训练营，唯一条件是你必须通过B级考验！"
  context: 鼓励罗峰通过考核以获得机会。

