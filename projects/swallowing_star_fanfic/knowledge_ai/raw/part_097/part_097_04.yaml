entities:
- id: 罗峰
  type: Character
  name: 罗峰
  aliases: []
  description: 银河领主，正处在成为真神的关键时刻。
  attributes:
    实力: 正在提升中，拥有小型宇宙。
    目标: 提升实力以保护整个宇宙海各族的命运。

- id: 摩罗撒
  type: Character
  name: 摩罗撒
  aliases: []
  description: 界兽，能够吞噬小型宇宙本源，提升自身实力。
  attributes:
    实力: 二阶界兽

- id: 震魔神
  type: Character
  name: 震魔神
  aliases: []
  description: 宇宙海中的真神之一。
  attributes:
    小型宇宙: 正遭受摩罗撒的吞噬。

- id: 混沌城主
  type: Character
  name: 混沌城主
  aliases: []
  description: 真神，虚拟宇宙内的领导者之一。
  attributes:
    职位: 真神殿最上方王座的拥有者。

- id: 金角真神
  type: Character
  name: 金角真神
  aliases: []
  description: 属于星空巨兽联盟，与罗峰关系密切。
  attributes:
    职位: 星空巨兽联盟和人类联系的主要渠道。

organizations:
- id: 原始宇宙一方
  type: Organization
  name: 原始宇宙各族
  description: 组织起来保护银河领主罗峰，避免界兽的干扰。
  attributes:
    目标: 确保银河领主实力提升。

locations:
- id: 宇宙本源内
  type: Location
  name: 宇宙海内的小型宇宙核心区域
  description: 包含十万颗星球环绕着中央虚空旋转，形成一元之始。
  attributes:
    特点: 可以诞生和恢复位面空间。

abilities:
- id: 一元之始
  type: Ability
  name: 一元之始
  description: 小型宇宙的核心架构，能够自动修复和再生位面空间。
  attributes:
    效果: 提高小型宇宙的自我修复能力和无穷无尽的可能性。

items:
- id: 神力海水
  type: Item
  name: 神力海水
  description: 小型宇宙核心区域中产生的能量来源，用于维持和增强整个小型宇宙。
  attributes:
    来源: 混沌气流的转化。

events:
- id: 摩罗撒吞噬震魔神的小型宇宙本源
  type: Event
  name: 界兽吞吃小型宇宙本源
  description: 摩罗撒不断地吞噬各个小型宇宙的本源。
  timeline:
    时间点: 数月内多次出现，持续不断的进行。

dialogues:
- id: 对话1
  speaker: 金角真神
  recipient: 混沌城主
  content: "震魔神的小型宇宙又遭到界兽吞吃，那界兽，又来了。"

- id: 对话2
  speaker: 混沌城主
  recipient: 真神们
  content: "银河领主正在成为真神的最为关键时刻，他的实力提升关系到我们整个宇宙海各族的命运，在银河领主未曾出小型宇宙前……谁都不可打扰他！"

timeline:
- id: 时间点1
  event: 摩罗撒首次出现在震魔神的小型宇宙外。
  date: 数月内

- id: 时间点2
  event: 大量真神和宇宙之主派出巡守小型宇宙周围，禁止第一轮回时代、第二轮回时代的强者打扰罗峰。
  date: 摩罗撒出现后不久

mysteries:
- id: 界兽吞吃小型宇宙本源的影响
  type: Mystery
  description: 没有详细说明界兽持续进行吞食行为对整个宇宙海各族的未来命运将产生怎样的影响。
