organizations:
- id: 虬嗜族
  type: Organization
  name: 蟒嗜族
  description: 不明，但为妖族的一部分
  attributes:


events:
- id: 布置暗手
  type: Event
  description: 夫威撒在被人类小队击败后布置了一枚带有暗手的空间戒指。
  timeline: 现阶段

dialogues:
- speaker: 雷克亚
  listener: 夫威撒
  content: "你真狡猾。"
- speaker: 夫威撒
  listener: 雷克亚
  content: "杀我兄弟手下，我当然得报复。"
- speaker: 雷克亚
  listener: 夫威撒
  content: "人类队伍实力怎么样？"
- speaker: 夫威撒
  listener: 雷克亚
  content: "人类队伍有一名不朽神灵，九名界主。其中的两名界主拥有超强战斗力，完全能媲美不朽……"
- speaker: 夫威撒
  listener: 雷克亚
  content: "蒙维纳殿下正常形态虽然仅仅普通不朽高等，可以他天赋爆发下来，战力接近封侯级。有他在，绝对有十足把握。"

mysteries:
- id: 蒙维纳是否出手
  type: Mystery
  description: 夫威撒能否成功邀请蒙维纳殿下与他们一同出马对付人类小队。
