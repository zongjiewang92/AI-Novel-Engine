events:
  - id: 不朽虫族攻击
    type: Event
    name: 不朽虫族母巢和虫族战士袭击人类疆域
    description: 数千名不朽级虫族战士在虫族母皇的指挥下对人类发动了毁灭性的攻击。
    participants:
      - 罗峰等人
      - 虫族母皇及其麾下的不朽虫族战士

dialogues:
  - speaker: 寺番祁长老
    content: "数千个不朽虫族联手，远超几千个真正不朽神灵的联合。"
  - speaker: 罗峰
    content: "刚才那一招，竟然毁灭直径千万公里的区域。"
  - speaker: 迪伦
    content: "数千名不朽神灵想要准确的同时施展攻击，难以成功但威力可怕。"
  - speaker: 第九军主
    content: "虫族母皇可以控制无数虫族战士并精确攻击，灵魂运用堪称巅峰。"

timeline:
  - event: 不朽级虫族母巢袭击帝都星
    date: 不详

mysteries:
  - question: 虫族母巢为何敢来人类疆域？
    answer: 可能是通过控制的不朽神灵传送，避免追杀。

