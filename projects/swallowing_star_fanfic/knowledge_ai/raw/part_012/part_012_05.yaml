  type: Character
  name: 罗峰
  aliases: []
  description: 监察使，身穿黑神套装，拥有极强的战斗能力。
  attributes:
    实力: 高等兽将级及以上
    能力: 速度极快，攻击力强大

- id: 李达威
  type: Character
  name: 李达威
  aliases: []
  description: 战争基地的司令员。
  attributes:
    实力: 高级将领
    职位: 军方高层

- id: 透明水母类怪兽
  type: Species
  name: 透明水母类怪兽
  aliases: []
  description: 具有大量柔软触手的透明水母，能够进入战争基地。
  attributes:
    类型: 领主级水域怪兽

relationships:
- id: 罗峰与李达威的关系
  type: Relationship
  name: 指挥与执行关系
  description: 李司令员指挥罗峰击杀上岸的领主级水域怪兽。
  attributes: []

events:
