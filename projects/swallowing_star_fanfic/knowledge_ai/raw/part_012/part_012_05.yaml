  type: Event
  name: 罗峰迅速杀死了一头巨大的龟鳖类领主级怪兽。
  description: 利用六道冰冷刀光斩杀了冲向战争基地的龟鳖怪物，表现出了惊人的战斗能力。
  attributes:
    时间: 未知
    地点: 黄浦江

- id: 透明水母进入基地
  type: Event
  name: 透明水母类怪兽进入了最外围的战争基地区域。
  description: 这一事件触发了警报，李达威司令员立即做出了应对措施。
  attributes:
    时间: 未知
    地点: 战争基地最外围

dialogues:
- id: 李达威指挥罗峰
  type: Dialogue
  name: "李司令：罗峰、雷猛，请两位击杀一些上岸的领主级水域怪兽。"
  description: 李达威通过通讯手表直接向罗峰下达命令。
  attributes: []

timeline:
