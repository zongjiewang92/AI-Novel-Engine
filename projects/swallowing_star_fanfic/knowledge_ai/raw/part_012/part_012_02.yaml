relationships:
- 罗峰与极限武馆有工作关系
- 极限武馆发出关于黑神套装的限制通知

events:
- id: 古文明遗迹探索任务
  type: Event
  description: 极限武馆要求战神们前往9号古文明遗迹，以获得黑神套装。
  attributes:
    时间: 2057年8月31日
    地点: 洪宁基地市极限武馆全球总部
    风险: 死亡伤残率高达72%

dialogues:
- id: 罗峰与极限武馆内部人员对话
  type: Dialogue
  content: |
    "你好，我是罗峰。"
    "我知道是你，罗峰监察使，你有什么事？"
    "我刚刚收到一份《古文明遗迹出通知》的邮件... 此次目标是9号古文明遗迹，而且死伤率达到72%，并且无法使用黑神套装等器具，是么？"
    "对。"
    "我想知道战神们进去遇到的挑战、危险是一样吗？"
    "不一样！"
    "只要身体素质达到战神级即可进入9号古文明遗迹... 难度不一。有的高等战神可能丧命，而初等战神反而有成功的例子！"
    "不过按照比例，高等战神成功比例是比中等战神要高，中等战神成功比例是比初等战神要高。"

timeline:
- 时间: 2057年8月31日
  事件描述: 极限武馆发出关于9号古文明遗迹的通知邮件

mysteries:
- id: 黑神套装为何不能进入9号古文明遗迹时使用？
  type: Mystery
  description: 究竟为什么禁止穿上黑神套装？是否因为黑神套装可能带来额外风险或限制探索任务的成功率？
