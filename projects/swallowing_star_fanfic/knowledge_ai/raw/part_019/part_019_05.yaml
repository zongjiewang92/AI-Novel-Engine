events:
- 名称: 地球领主申请信息讨论
  时间线位置: 开始
  描述: 罗峰和巴巴塔讨论地球成为领地的条件。
  参与者: 罗峰, 巴巴塔

- 名称: 高升邀请罗峰就餐
  时间线位置: 中间
  描述: 高升在百味餐厅邀请罗峰吃饭，并分享自己的好消息。
  参与者: 罗峰, 高升

dialogues:
- 主体: 巴巴塔
  对象: 罗峰
  内容: "第三种选择，是和帝国合作管理星球。只需要缴纳最低1000亿，最高1万亿黑龙币即可。这合作管理，黑龙山帝国不会插手星球内部管理，他们只会收取星球进口、出口的关税。"

- 主体: 罗峰
  对象: 高升
  内容: "至少现在地球还很安全！罗峰微微一笑，端起旁边的水果汁杯，喝了一口，嗯？这味道……"

timeline:
- 时间点1: 地球领主申请讨论时间
- 时间点2: 罗峰和高升在百味餐厅会面

mysteries:
- 未解决信息: 距离地球不算太遥远的星域有宇宙冒险者飞船正以惊人的速度朝地球逼近。
