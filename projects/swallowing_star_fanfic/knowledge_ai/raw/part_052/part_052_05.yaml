    实力: 不朽级及以上

relationships:
- id: 罗峰与泰沃
  type: 合作关系
  description: 罗峰是泰沃队伍中的一员。

- id: 毒药对七哥的情感
  type: 复仇关系
  description: 因为死去的战友，毒药充满仇恨和复仇心。

events:
- id: 队伍遭遇敌人
  type: Event
  description: 罗峰发现远处有敌人接近，并提醒队伍。
  timeline: 战斗开始前

- id: 不朽神力压缩体攻击
  type: Ability
  description: 泰沃使用不朽神力进行攻击，以抵御敌人的进攻。

- id: 再次遭遇仇敌
  type: Event
  description: 队伍再次遇到曾经杀死他们战友的敌人。
  timeline: 战斗爆发时

dialogues:
- speaker: 泰沃
  content: "疯子，岩石，那队伍是我们的生死仇敌，不要留手，拼命，杀死他们，将那群食尸鬼杀光。"
  context: 罗峰提醒发现敌人后，泰沃对队员的指示。

timeline:
- event: 遭遇敌人
  time: 战斗开始前

- event: 不朽神力压缩体攻击
  time: 敌人接近时

- event: 再次遭遇仇敌
  time: 紧随其后

mysteries:
- id: 七哥的死亡原因
  description: 虽然提到了毒药的战友，但是没有详细解释七哥具体的死因。
