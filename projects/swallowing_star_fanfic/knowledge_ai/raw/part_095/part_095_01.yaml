    time: 不详, 定在一年后进行大扫荡行动

dialogues:
- id: 混沌城主对罗峰的评价
  content: "罗峰，你对我人类之功，可媲美原祖。"
- id: 罗峰回答混沌城主
  content: "老师一直坐镇我族群中枢, 守护我族群, 管理族群, 令我族群不断发达强盛, 这才是最大的功德。"

