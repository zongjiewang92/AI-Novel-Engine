  name: 第九深渊
  aliases: []
  description: 深渊浩广，吞吸力量强大，是罗峰寻找灭绝神铠最后一片鳞片的地方。

items:
- id: 疯魔灭神甲
  type: Item
  name: 疯魔灭神甲
  aliases: [ 灭绝神铠 ]
  description: 宇宙中极为珍贵的神铠，罗峰正在收集最后两片以形成完整装备。
  attributes:
    材质: 鳞片（疑似）
    功能: 未知

relationships:
- id: 罗峰-坐山客
  type: Relationship
  name: 师徒关系
  description: 罗峰是坐山客的弟子，坐山客是罗峰的老师。

dialogues:
- id: 联系令牌对话
  characters:
  - 罗峰
  - 坐山客
  content: "罗峰：老师。/坐山客：你现在在哪？/罗峰：我还在第九深渊。"
  context: 当罗峰身处危险时，通过联系令牌向坐山客求助。

timeline:
- 时间点: 六天后
  描述: 罗峰与坐山客在三角山峰之巅会面。

mysteries:
- id: 疯魔灭神甲的完整形态
  description: 罗峰需要收集最后两片鳞片来完成疯魔灭神甲，但具体用途和能力尚不清楚。
