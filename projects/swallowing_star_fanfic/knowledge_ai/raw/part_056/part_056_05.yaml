mysteries:
- 内容: 吴吕王为何会特意羞辱罗峰？
  解释: 罗峰推测这体现了异族在人类中的自卑感，或许不是故意的。

dialogues:
- speaker: MuYuWang
  listener: LuoFeng
  content: "宇宝堂一楼的宝物，价格从百万混元单位到千亿混元单位，应有尽有。"
  context: 罗峰进入宇宝堂时木玉王给他的介绍

- speaker: WuLvWang
  listener: LuoFeng
  content: "（瞥了罗峰一眼）"
  context: 吴吕王在二楼楼梯口对罗峰的不屑一顾

timeline:
- 时间点: 罗峰进入宇宝堂
  内容: 罗峰探索和观察宇宝堂一楼的各种宝物。
