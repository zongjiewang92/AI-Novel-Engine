events:
- id: 飞云阁入住
  type: Event
  description: 罗峰入住飞云阁，并安排住宿。
  timeline: 未知时间点，燕岗城内
- id: 调查燕岗城
  type: Event
  description: 倾城青年仆人向罗峰详细描述燕岗城内的势力情况和重要地点。
  timeline: 罗峰入住飞云阁后不久

dialogues:
- speaker_id: 穿着黑色毛皮的娇小少女
  listener_id: 罗峰
  content: "我们这有地级、天级、云级，不知道你要住哪一级的？至于价格，那边墙壁上挂着。"
  context: 飞云阁入住时接待罗峰。
- speaker_id: 罗峰
  listener_id: 倾城青年仆人
  content: "我是第一次来你们燕岗城，你跟我说说，这燕岗城有哪些特殊地方，有哪些大人物。"
  context: 要求了解燕岗城的详细信息。
- speaker_id: 纳可
  listener_id: 纳布
  content: "峰大哥传音在我脑子里的。"
  context: 接收到罗峰的信息后告知父亲。

timeline:
- time_point: 第二天早晨
  description: 罗峰通过念力感应到纳家父子的到来，并与之联系。
  events:
  - id: 纳可到来传音

mysteries:
- mystery_id: 城主石风家族的血洛晶持有情况
  description: 虽然城主最有可能拥有第二颗血洛晶，但罗峰暂时不去招惹他。
- mystery_id: 淳羽家族是否真的有领域级老者潜修
  description: 这是仆人道听途说的信息，真实性存疑。
