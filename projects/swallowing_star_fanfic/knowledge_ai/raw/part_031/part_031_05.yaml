dialogues:
- speaker: uka
  listener: rofei
  content: "想要收戎钧为弟子的，不单单是一个宇宙国主，而是两位！不过，你应该知道1008宇宙国其实背后都隶属于五大巨头，这两位宇宙国主，一个是属于虚拟宇宙公司，另一个属于巨斧斗武场。因为戎钧是我们虚拟宇宙公司的人，最后才被元辰宇宙国主成功收为弟子。"
  context: 罗峰和乌卡的对话中提及。

mysteries:
- id: mystery_rongjun
  type: 伏笔
  description: 戎钧为何会被两位宇宙国主争夺，即使其本源法则感悟不算太强。
