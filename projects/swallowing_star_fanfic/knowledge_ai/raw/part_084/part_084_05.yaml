source:
  id: universe-story

entities:
- id: rofeng
  type: Character
  name: 罗峰
  aliases: []
  description: 拥有金角巨兽分身，修炼了断东河一脉传承的绝学。目标是尽早突破至宇宙之主。
  attributes:
  - 实力: 无限幽海级实力
  - 法则感悟: 近乎第七重圆满但尚未完全掌握
  - 神力: 显著影响修炼速度和战斗能力

- id: north_true_starlord
  type: Character
  name: 北真星主
  aliases: []
  description: 来自东帝圣地，拥有至强至宝的宇宙之主。
  attributes:
  - 实力: 宇宙之主级
  - 目标: 捕捉罗峰

- id: east_emperor_sovereign_ancestor
  type: Character
  name: 东帝始祖
  aliases: []
  description: 来自东帝圣地，至高无上的存在。
  attributes:
  - 实力: 宇宙之主级或更高
  - 目标: 获取断东河一脉传承

- id: treasure_spaceship
  type: Location
  name: 墓陵之舟
  aliases: []
  description: 包含大量宝物和传承的空间，是历代断东河的积累之地。
  attributes:
  - 宝物数量: 约322件

- id: east_emperor_sanctuary
  type: Organization
  name: 东帝圣地
  aliases: []
  description: 来自东方帝国的强大组织，拥有众多宇宙之主和至强至宝。
  attributes:
  - 宇宙之主数量: 至少20名
  - 至强至宝持有者: 超过10名

- id: supreme_treasures
  type: Item
  name: 至强至宝
  aliases: []
  description: 拥有强大能量的特殊宝物，可以增强宇宙之主的实力。
  attributes:
  - 数量: 十件以上

relationships:
- subject_id: rofeng
  object_id: treasure_spaceship
  type: 属于
  description: 罗峰身处墓陵之舟内进行修炼。

- subject_id: east_emperor_sovereign_ ancestor
  object_id: north_true_starlord
  type: 指派
  description: 东帝始祖指派北真星主等人捕捉罗峰。

- subject_id: east_emperor_sanctuary
  object_id: rofeng
  type: 追捕
  description: 东帝圣地组织力量追捕罗峰，意图夺取其手中的断东河一脉传承。

dialogues:
- speaker_id: north_true_starlord
  listener_ids: []
  content: "始祖刚刚找过我。"
  context: 北真星主通过传讯令牌告知其他宇宙之主消息。

- speaker_id: east_emperor_sovereign_ancestor
  listener_ids: [ north_true_starlord ]
  content: "这罗峰必须抓住！他得到的断东河一脉传承，极为重要！抓他……不惜一切代价！"
  context: 东帝始祖强调了抓捕罗峰的重要性。

timeline:
- event_id: east_emperor_sovereign_ancestor_instructs
  time: 前不久
  description: 东帝始祖指示北真星主等人捕捉罗峰。

events:
- id: rofeng_breakthrough_plan
  type: 决策
  description: 罗峰决定尽快拿到白色羽翼，突破至宇宙之主。

mysteries:
- question: 白色羽翼的下落如何影响罗峰的实力提升？
  context: 拿到白色羽翼后，罗峰会迅速增强自己的力量。
