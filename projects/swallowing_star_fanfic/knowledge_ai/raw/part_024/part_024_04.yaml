  type: Character
  name: 布罗林
  aliases: []
  description: >
    贵为九皇子，母亲一脉极其强势。占据优势：一是他是九皇子，在圣地“黑龙山”中皇族控制的势力支持他；二是他的外公在圣地“黑龙山”地位极高，有一批人支持他。
