events:
- id: RR病毒的出现和传播
  type: Event
  name: RR病毒的出现和传播
  description: 2015年1月，RR型病毒感染全球所有生命，死亡率极高。
  timeline: 公元2015年1月

- id: 怪兽战争开始
  type: Event
  name: 怪兽战争开始
  description: 2015年9月起，海洋中的怪兽开始攻击人类居住地。
  timeline: 公元2015年9月至2021年3月

dialogues:
- 发言人: 罗峰
  对话内容: "从2013年到2021年，这八年时间，便是人类历史上的大涅盘时期！"

- 发言人: 罗华
  对话内容: "哥，实话说，我还真的有点无法想象，大涅盘时期之前，全球的国家地区竟然超过两百个。那时候人口才多少？70亿而已。有些小国，真的太小了。恐怕一头厉害的怪兽，就能将当初的小国给灭国。"

timeline:
- 时间点: 公元2013年
  描述: 大涅盘时期的开始

- 时间点: 公元2015年1月
  描述: RR病毒出现并迅速传播全球，导致大量死亡。

- 时间点: 公元2015年9月至2021年3月
  描述: 怪兽战争期间

- 时间点: 公元2021年3月
  描述: 超高频激光炮的研制成功，标志着怪兽和人类大规模战争结束。

mysteries:
- 神秘点: 没有提及大涅盘时期前详细的社会结构和个人生活。
