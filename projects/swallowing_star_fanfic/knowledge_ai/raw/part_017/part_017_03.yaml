source:
  id: 第250章八爪兽皇

entities:
- id: 罗峰
  type: Character
  name: 罗峰
  aliases: []
  description: 刚踏入行星级不久，拥有超过一般行星级强者的实力。
  attributes:
    实力: 行星级六阶及以上，能和洪、雷神媲美
- id: 巴巴塔
  type: Character
  name: 巴巴塔
  aliases: []
  description: 罗峰的智能助手
  attributes:
    性格: 不屑、调侃
- id: 八爪兽皇
  type: Species
  name: 八爪兽皇
  aliases: []
  description: 海洋中的强大生物，实力为行星级六阶。
  attributes:
    特征: 多个粗长腕足，巨大的头颅
- id: 洪
  type: Character
  name: 洪
  aliases: [ 洪哥 ]
  description: 地球上的最强精神念师之一，行星级强者。
  attributes:
    实力: 超过地球上的多数行星级强者
- id: 雷神
  type: Character
  name: 雷神
  aliases: []
  description: 洪的弟弟，精通内家拳和古瑜伽术。
  attributes:
    实力: 行星级六阶及以上，刚踏入领域之境

relationships:
- 主角: 罗峰
  关系类型: 能力超越
  相关人物: 八爪兽皇
  描述: 罗峰轻松击败了八爪兽皇。
- 主角: 洪
  关系类型: 弟弟
  相关人物: 雷神
  描述: 洪与雷神是兄弟关系，彼此互相扶持。

events:
- id: 八爪兽皇之死
  type: Event
  name: 八爪兽皇被罗峰杀死
  description: 罗峰在空中使用武器击败了八爪兽皇。
  timeline: 文中描述的时间点
- id: 雷神踏入领域之境
  type: Event
  name: 雷神突破至领域之境
  description: 雷神在修炼过程中，因为与金角巨兽的战斗而突破到了新的境界。
  timeline: 文中描述的时间点

dialogues:
- 主角: 巴巴塔
  对话内容: "这八爪兽皇真是找死啊。它出了海，都不是雷神和洪的对手！现在洪和雷神躲起来，它就以为无敌了？罗峰你的实力比雷神都要强点，收拾它还不是小菜一碟！真是白痴。"
  场景: 智能空间中
- 主角: 雷神
  对话内容: "洪哥。地球上有这样的天才，我若死去，也能安心。"
  场景: 极限武馆总部的修炼室

timeline:
- 时间点: 文章开始时间
  描述: 八爪兽皇被罗峰杀死。
- 时间点: 战斗结束后不久
  描述: 雷神突破至领域之境。

mysteries:
- 未知信息: 地球上除了洪和雷神，还有没有其他人可以与兽皇一战？
