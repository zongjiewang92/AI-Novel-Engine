source:
  id: 813

entities:
- id: 1
  type: Character
  name: 罗峰
  aliases: []
  description: 坐在控制室中品着果酒，计划杀死即将接近的异族不朽以获取军功。
  attributes:
    实力: 领域主
    船只等级: E级宇宙飞船

- id: 2
  type: Character
  name: 尾遗族女子
  aliases: []
  description: 具有蝴蝶般羽翼，头部有着鼓起的独眼“复眼”，擅长用丝线攻击。
  attributes:
    实力: 封侯巅峰不朽神灵

- id: 3
  type: Character
  name: 尾遗族男子
  aliases: []
  description: 具有蝴蝶般羽翼，头部有着鼓起的独眼“复眼”，擅长用丝线攻击。
  attributes:
    实力: 封侯巅峰不朽神灵

- id: 4
  type: Character
  name: 生物飞船
  aliases: []
  description: 携带三名异族不朽，接近罗峰的宇宙飞船。

organizations:
- id: 1
  type: Organization
  name: 妖族联盟
  description: 联合星空巨兽等其他势力以壮大自身实力。

species:
- id: 1
  type: Species
  name: 尾遗族
  description: 具有蝴蝶般羽翼，头部鼓起的独眼“复眼”的异族，拥有封侯巅峰不朽神灵的实力。

locations:
- id: 1
  type: Location
  name: 焱祭大陆主大陆
  description: 强者如云的地方，任何一支队伍中都有封侯不朽或者媲美封侯不朽的特殊手段。

events:
- id: 1
  type: Event
  name: 宇宙飞船接近
  description: 生物飞船上三名尾遗族异族不朽接近罗峰所在的宇宙飞船。
  timeline: 罗峰发现后等待5分钟，之后被攻击。

dialogues:
- id: 1
  type: Dialogue
  content: "如果他知道，他正在被妖族的'恐金犼族'的封侯巅峰强者给盯上……估计会被吓得腿发软吧。"
  speaker: 尾遗族女子

- id: 2
  type: Dialogue
  content: "小家伙，你有些胆色呢，竟然敢来焱祭大陆主大陆。才界主实力啊，在人类中算是绝世天才了吧，可为什么这么愚蠢呢。"
  speaker: 尾遗族女子

- id: 3
  type: Dialogue
  content: "他愚蠢，我们才能赚军功。"
  speaker: 尾遗族男子

- id: 4
  type: Dialogue
  content: "别浪费时间，赶紧解决他。"
  speaker: 生物飞船上的领队

timeline:
- 罗峰发现生物飞船上三名尾遗族异族不朽接近自己的宇宙飞船。
- 尾遗族女子和男子化作迷蒙幻影直接向罗峰逼去，同时射出大量白色丝线。

mysteries:
- 尾遗族不朽为何要杀死人类界主以获取军功？
- 罗峰会如何应对三名异族不朽的攻击？
