entities:
- id: "罗峰"
  type: Character
  name: 罗峰
  aliases: []
  description: 虚拟宇宙公司的天才成员，争夺原始秘境名额的参赛者。
  attributes:
    实力: 绝世天才, 初始级实力
    性格: 有决心和毅力
    关系:
    - 师傅: 真衍王
    - 朋友: 戎钧、乌卡等
    - 家人: 洪(兄弟)、雷神、妻子孩子、弟弟

- id: "克罗夫"
  type: Character
  name: 克罗夫
