  描述: 克罗夫未出现, 罗峰获得胜利

mysteries:
- id: "克罗夫为何放弃最后一场比赛"
  type: Mystery
  content: 在规定时间内，克罗夫的意识未进入虚拟宇宙网络，导致弃权。
