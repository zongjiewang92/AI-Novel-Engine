  data:
    source:
      id: 吞噬星空-第227章
    entities:
    - id: 罗峰
      type: Character
      name: 罗峰
      aliases: []
      description: '主人公，已经掌握了赤混铜母残片，并计划前往洪宁基地市兑换草木之灵和可能的其他宝物。

        '
      attributes:
