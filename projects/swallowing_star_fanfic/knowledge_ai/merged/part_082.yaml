    - id: xinwujiuditu
      name: 新无极地图的发现和分享
      description: 罗峰在宇宙舟内域中发现了三大绝地的新地图，并与老师分享。
    dialogues:
    - speaker: rofei
      listener: hundunsheyushi
      content: 恭喜老师。
    - speaker: hundunsheyushi
      listener: rofei
      content: 只是稍有些突破，可离宇宙最强者却还差一些。
    - speaker: rofei
      listener: hundunsheyushi
      content: 弟子在宇宙舟内域，走了大运，发现了一黑色信物。之后抵达黑纹石柱空间，进入了那黑色信物所对应的密室独立空间，在那独立空间中发现了那地图。
    - speaker: hundunsheyushi
      listener: rofei
      content: 罗峰，你这地图哪里来？这价值无量的地图，没谁会乱放的，而且没足够实力，也不敢带在身边吧。
    timeline:
    - event: huangdazhiqianliu
      time: 最近一次
    mysteries:
