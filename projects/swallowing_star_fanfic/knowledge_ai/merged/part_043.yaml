    - speaker: 幻灵王
      content: 洪，我给你一次机会，赌命的机会！你选择第一条可以拥有从现在到界主巅峰时期的修炼时间；选择第二条就是马上去闯十八爱欲幻境。只要你失败，那么，我一定会下令让宇宙佣兵联盟派出高手直接击杀你。
      context: 提出挑战和条件。
    - speaker: 洪
      content: 我选择第二条。闯幻灵王你布置的十八爱欲幻境，假设我失败……不用大人你派遣人来追杀我，我会直接前往某个宇宙佣兵联盟驻地，在驻地人员面前，我会自杀，并且进行虚拟宇宙网络同步传播给幻灵王大人。
      context: 接受挑战并表示决心。
