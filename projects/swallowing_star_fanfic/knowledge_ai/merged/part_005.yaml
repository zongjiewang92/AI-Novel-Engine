    events:
    - id: 猎杀初级兽将级怪兽
      type: Event
      description: 罗峰等人在003号城市内猎杀大量的初级兽将级怪兽，获取重要材料出售。
      timeline:
        开始时间: 十几天前
        结束时间: 暂未结束
    dialogues:
    - id: 资源分配讨论
      speaker1: gaofeng
      dialogue: 队长，我们这段时间杀的比较狠。不过不用急，怪兽是大量流窜的……据我估计，十天内，这小区中的怪兽数量又会多起来！我们要做的只是安静守在这，毕竟我们对这的环境最熟悉。
    - id: 功劳分享
      speaker1: luofeng
      dialogue: 赚钱多？不多不多。一名精神念师，一年赚几十亿，是很正常的。我们敢在这混，主要也是靠罗峰。
    timeline:
    - 开始时间: 十几天前
      结束时间: 暂未结束
    mysteries:
    - id: 怪兽数量减少的原因
      description: 罗峰等人发现周围一带初级兽将级怪兽数量明显少了不少，推测可能是因为他们这段时间杀的比较狠。
