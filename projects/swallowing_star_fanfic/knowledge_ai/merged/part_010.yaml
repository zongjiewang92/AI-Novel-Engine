    items:
    - id: 千年柳木心
      type: Item
      name: 千年柳木心
      aliases: []
      description: 草木之灵的重要宝物，具有特殊的孕育能力。
      attributes:
        来源: 柳树类草木之灵
    - id: 黑神套装
      type: Item
      name: 黒神套装
      aliases: []
      description: 卡特兰的特殊装备, 能够随意变幻成各种形状。
    events:
    - id: 四人小队接近柳树王
      type: Event
      name: 四人小队接近柳树王
      description: 李耀等人接近九棵柳树草木之灵，准备对付它们。
      timeline:
        时间点: 夜晚, 雾大时分
    dialogues:
    - id: 对话1
      type: Dialogue
      characters:
      - 罗峰
      - 卡特兰
      - 李耀
      content:
      - 卡特兰，前面就是九棵柳树类草木之灵。
      - 对付？那柳树王可是直径达到三米，当年孕育着‘千年柳木心’的柳树类草木之灵，也才直径一米。这柳树王可比那棵厉害多了。特别是它的一根根淡金色柳枝条，每一根都非常坚韧，一旦被重重捆缚住，就是我，也必死无疑！
      - 卡特兰，你看，那九棵柳树……核心的一棵，也是最粗的一棵柳树王是最厉害的。而且它的淡金色柳枝条是足以覆盖周围其他柳树的，所以，我想要攻击其他柳树也是没有办法。
    timeline:
    - 时间点: 夜晚, 雾大时分
      描述: 罗峰在草丛中监听四人小队接近九棵柳树类草木之灵。
    mysteries:
    - 卡特兰是否能成功对付柳树王？
    - 黑神套装的具体能力是什么？
