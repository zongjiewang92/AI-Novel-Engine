    - speaker: zhengzhi
      dialogue: 我有宫殿至强至宝‘冰崖堡’，且有镇封之能。不过这件至强至宝认主，对意志要求颇高。若是宇宙之主……那必须得是宇宙最强者的意志。你们两大圣地，宇宙之主们一个个活的无比漫长，意志达到宇宙最强者行列的怕有些，你们随便推举出一位，让他暂时认这至强至宝，让他来镇封罗峰。
