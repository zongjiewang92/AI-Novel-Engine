      aliases: []
      description: 制造了“掌上宇宙”这件宝物，以保护族群。
      attributes:
        能力: 炼制高等至宝
    - id: 掌上宇宙
      type: Item
      name: 掌上宇宙
      aliases:
      - 机械流派的宝物
      description: 由混沌城主操控，包含山脉、湖水、木屋等组成的系统化小型宇宙。
      attributes:
        威能: 六阶顶尖攻击
        影响范围: 最大1光年
    relationships:
    - 主体: 混沌城主
      客体: 掌上宇宙
      关系类型: 控制
      描述: 混沌城主可以操控掌上宇宙，释放其威能。
    events:
    - 名称: 混沌城主展示“掌上宇宙”
      时间线: 文本描述中
      地点: 殿厅内
      参与者:
      - 混沌城主
      - 罗峰
      - 彭工之主
      - 黑暗之主
      - 龙行之主
      - 荒鉴之主
    dialogues:
    - 主体: 混沌城主
      对象: 罗峰等人
      内容: '"此宝，是老师他当年耗尽无数心血才亲手造出。这里的山脉、大地、湖水、木屋等等，实际上是由36200个部件构成，每个部件用材都极好，可构造的秘法却很简略，只有组合后……才能系统化，山脉、湖水、木屋，三大系统，最终构成这一方天地。老师当年曾说……这，便是宇宙运行的初始规律。此宝，名为‘掌上宇宙’。但凡是我掌上宇宙所能掌控的区域内，可以瞬间透过这掌上宇宙威能，同时施展出两次六阶顶尖攻击。并且，它所能影响的范围，最大可达到1光年。”

        '
    timeline:
    - 时间点: 文本描述中
      描述: 混沌城主展示“掌上宇宙”的场景
    mysteries:
    - 内容: 掌上宇宙的构造原理和秘法是如何实现六阶顶尖攻击。
