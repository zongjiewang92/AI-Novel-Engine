      aliases: []
      description: 顶级领域类至宝，拥有强大攻击力。被罗峰轻易突破。
    dialogues:
    - speaker: 雄浑声音
      content: 人类罗峰！
      context: 罗峰周围响起的雄浑声音自称是妖族联盟通岭之主。
    - speaker: 罗峰
      content: 可是妖族联盟的通岭之主？
      context: 知道对方身份后，微笑回应。
    - speaker: 雄浑声音
      content: 你竟能笑得出！哈哈哈……真是有胆色，提前告诉你，班夫之主很快便到。
      context: 告诉罗峰即将面对更强的对手。
    events:
    - id: 罗峰突破重重黑色海水
      description: 罗峰在浮山海中肆意遨游，轻易抵挡住对方全力攻击。
      timeline: 文章开头至中间部分
    - id: 罗峰创出《血光》秘法
      description: 在杀戮心境中创出第二套宇宙之主究极秘法《血光》。
      timeline: 中间部分
    - id: 班夫之主来临
      description: 远处一道身影迫近，通岭之主告知罗峰班夫之主即将到来。
      timeline: 文章结尾
    timeline:
    - event: 罗峰轻松抵挡浮山海攻击
      time: 前部分
    - event: 罗峰创出《血光》秘法
      time: 中间部分
    - event: 班夫之主即将来临
      time: 结尾
