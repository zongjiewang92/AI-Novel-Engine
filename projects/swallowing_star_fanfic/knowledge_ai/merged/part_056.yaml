    mysteries:
    - 问题: 为何黑甲青年未能有效控制住金角巨兽？
      提示: 他可能未充分研究瞬移技术。
    - 问题: 金角巨兽的真正实力究竟如何？
      提示: 罗沙提到其拥有封王巅峰战力，但实际上它借助弑吴羽翼能达到此效果。
