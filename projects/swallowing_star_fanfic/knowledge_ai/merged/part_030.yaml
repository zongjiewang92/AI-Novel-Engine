    - id: 虚拟宇宙公司
      type: Organization
      name: 虚拟宇宙公司
      aliases: []
      description: '安排最优等的F级宇宙飞船接天才战参与者前往全宇宙总部。

        '
      attributes:
        科技含量: 非常高
    - id: 乾巫拍卖会
      type: Event
      name: 乾巫拍卖会
      aliases: []
      description: '罗峰参加过的两次大型拍卖会。

        '
    relationships:
    - 主体: 罗峰
      关系类型: 参与者
      客体: 天才战
    - 主体: 马纳
      关系类型: 负责
      客体: 接天才战参与者前往全宇宙总部的安排工作
    dialogues:
    - 发言人: 罗峰
      对话内容: 乾巫宇宙国、黑龙山星域、银河系、白兰星。
      上下文描述: 写自己的星球地址。
    - 发言人: 马纳
      对话内容: '“请大家暂时别走，关于接大家去我虚拟宇宙公司全宇宙总部，还有一些事和大家商谈。” "自我介绍一下，我叫马纳。" "因为旅途贯穿很多宇宙国，非常遥远，而民间的宇宙飞船在‘暗宇宙’中速度又慢，想要抵达我公司全宇宙总部，要很久很久。为了节省大家时间，自然是我们虚拟宇宙公司专门安排最优等的宇宙飞船去接！"
        "这次在座的1000位，距离我们虚拟宇宙公司全宇宙总部，最远的一位，距离大概是在15亿光年。暗宇宙中和原宇宙距离比是1:1008.1万倍，就算1倍光速在暗宇宙中前进，也需要约150年才能抵达。"
        "如果大家要自己乘坐飞船。1，速度慢，需要时间太久。2，超长旅途的飞行，飞船消耗的能量非常惊人。3，也是最重要的一点，就是暗宇宙飞行，在一些特殊地带也不安全，会有宇宙星盗乃至出现其他族群的劫掠。在座的各位，安全很重要。现在民间的宇宙飞船，在暗宇宙中优秀者速度也就数倍光速，超长距离飞行依旧要很久很久。"
        "我虚拟宇宙公司，给各位安排的一律是F级宇宙飞船。而且并非是轻易能够购买到的F级飞船，而是……我虚拟宇宙公司内部的特殊型号F级飞船，内部科技含量远朝各个宇宙国的F级飞船。"

        '
    timeline:
    - 时间点: 天才战结束
      事件描述: 马纳开始介绍如何接天才战参与者前往全宇宙总部。
    mysteries:
    - 描述: 如何在三年内跨越15亿光年的距离，达到令人难以置信的飞行速度。
